body:
  text: 提要雙溪醉隱集六卷别集類四元臣等謹案雙溪醉隱集六卷元耶律鑄撰鑄字成仲遼東丹王九世孫中書令楚材之子也纍官中書左丞相卒追贈懿寧王諡文忠事迹具元史本傳楚材佐元太祖太宗平定天下立綱陳紀皆出其所規畫鑄少而聰敏尤工騎射從憲宗征蜀纍建功績後三入中書定法令製雅樂多所禆贊經濟不愧其父而文章亦具有父風故元好問李冶諸人皆與相欵契然楚材湛然居士集尚有鈔本而鑄集久佚不傳藏書家至不能舉其名氏惟明錢溥內閣書目有耶律丞相雙溪集十九册亦不詳其卷目檢勘永樂大典所收鑄雙溪醉隱集篇什較夥有前集新集續集别集外集諸名又别載趙著麻革王萬慶諸序跋乃為鑄少年之詩名雙溪小藁者而作是所作諸集本各為卷帙頗有瑣碎之嫌謹裒集編次都為一集而仍以雙溪小稿原序原跋分繫首末用存其槩鑄早從征伐足迹涉厯多西北極逺之區故所述塞外地理典故往往詳核如據和林城唐明皇御書闕特勤碑證新舊唐書作特勒之誤處月丁零二注辨論頗詳此類皆有禆於考證又其家在金元之間纍世貴顯諳習朝廷舊聞集中如瓊林園龍和宫諸賦敘述海陵章宗軼事及宫室制度多金史所未及其他題咏亦多關係燕都故實而帝京景物略諸書均未紀録亦足以資博識也至於金史耶律履傳元史耶律楚材傳均不著其里貫於史例頗為不合今考鑄寓歷亭詩注云豫家遼上後家醫無閭又五湖别業詩注云余先居和林後寓隗臺今卜築縉雲五湖别業敘其遷徙之迹頗詳是尤足以補史之闕矣乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序中書省掌書記李暐一日袖書一編詣余曰此雙溪之歌詩也即公蒙年所為者約千首且十竊其一焉兼附近作共得一百五十餘篇離為五卷目之曰雙溪小藁今欲廣傳之庶在綺紈者見而思齊焉因之可以起吾風之己僨者也請子文以引其端幸毋讓余受而觀之見韁龍軛鳯鞭虬笞鼇以求其變極其所變而發諸心思則羅雲縠月紉秋藻春以盡其情嘻實天下之奇作也如金極夜延螢燭暗翠簾風窣月鈎間此時年十五耳兩漢水乾秋飲馬五南霜重夜屯兵此又十七時語也蓋天與其性發言便高公諱鑄字成仲雙溪自號也公以東丹王之後右丞文獻公之孫中書令玉泉老之子鑠盡貴氣屈己以下人刮去驕佚折節以讀書及所為詩文又如此在天地間豈易得哉故樂為之引甲辰年上巳日龍山居士鴈門吕鯤書詩之為義也大矣哉三百篇而下離騷經得風雅之變秦亡漢興王澤未逺元鼎已來河梁之别始作得離騷之變也黃初綿絡以至於大業之際詩文比比而出大名於世者亦不可多得漢有蘇李魏有曹劉晉有潘陸宋有陶謝而已是故遺風不泯焉武德再造徐庾淫靡尚且存焉為陳子昻一變而至於魯為李太白杜子美再變至於道退之後來使文起八代之衰道濟天下之溺於文章慎許可至於歌詩獨推之曰李杜文章在光熖萬丈長及乎天寶亂息大厯元和詩律再變以至今日矣嗚呼風雅不可復得見唐人之餘烈斯可矣雪浪齋日記有云建安才六七子開元數兩三人則所取其難如此又云書止於晉詩止於唐誠不誣矣若李若杜若韓若桞豈愧六朝諸賢歟國朝自取魏以來詩人益盛余嘗在貞祐季年親見玉泉大老懷親詩云黃犬不來愁耿耿白雲望斷思依依欲憑鱗羽傳音信海水西流鴈北飛又云黃沙三萬里白髮一孀親腸斷邉城月徘徊照旅人所以見哀思之情極矣又和人詩云仁義説與當途人恰似春風射馬耳此見感憤之懷亦以極矣思之有以見唐人餘烈焉雙溪成仲即玉泉中令君之子也生長北溟十三作歌詩下筆便入唐人之閫奧嘗作髙城曲云城髙三百尺枉教人費力賊不從外來當察城中賊又曰將出帶將來小胡笳擬回文暮春曲磨劔行春夜吟獨倚門之類皆十三時作也又隂不雨惜花吟琵琶詞公子行廣陵散十五六作也又贈坐竿道士水平橋題藍采和早行吟十八九作也又山市吟暮春對花寄故人題牧牛圖二十一二作也則知興寄情趣前人間有所不到者此詩向時往往傳至燕臺人初未甚信及其去嵗秋八月來自北庭大葬既已眀日首禮於香山寺元吕及余從行禮成長老拂几捧硯請各賦詩雙溪即書古詩云渺渺入平野悠悠到上方雲開見天闕回首超凡鄉元吕垂書余亦落筆既而雙溪復次元韻云人去豪華山好在夢回歌舞水空流又次余韻云翠輦不回天地老白雲飛盡海山秋時已夕矣不及次吕之韻會九日登瓊花島用吕香山詩韻留題云蓬萊宫殿遺基在休對西風子細看及載觀次韻之作如蘭依修竹菊映青松輝彩省淨氣韻深長便覺首倡大似落絮飛花雖有流風回雪之態豈能倫擬未幾復書途中之所作云松聲曲春雪謡蟄龍行雨圖休嗟行路難大傳燕市使向之未甚信者私用慚怍自是與燕士大夫唱酬無虛日每一篇出識者益增歎服不及悉書俱在前帙或謂余曰雙溪自十三以至今日方二十有餘便入唐人之閫奧而雕蟲篆刻白首坐窗見之者莫能何謂也余曰且騏驥墮地一日千里駑駘百嵗十駕而始至分也又何足怪歐陽文忠公有云能以技自顯於一世亦悟之天非積習致然信哉愚謂源深者自長矣向玉泉作懷親詩時亦是方冠之餘今雙溪思親三絶云一上居庸萬里心又一聲長笛野雲秋又云躊蹰搔首無人會時下樓來却上樓有是父有是子良然繼作甕山有感三絶云仙佩飄飄駕彩鸞感之至也又雪後吟立春前一日曲情之至也春日登蓬萊島頸聯云既解寶藏秦照膽也須珍惜漢吹毛用事之至也過故宫云栁陌風來雪滿沙理之至也擬古云水涵春色栁涵煙半是人間半是仙境之至也以代留别余云燕南春色老燕北草初肥露冷野花瘦月明江樹稀又云芳草不隨鶯燕老好山依舊水雲深逺之至也惜乎李子取之不多詞彩風流皆可備於管絃矣其容雅而體間意深而情婉氣修而色粹調逸而聲諧抑之則紆餘委備揚之則條達疏暢得不蕩搖情性者哉執此過余求為後引懇切再四義不可辭此非小道實文章之菁華也可以意名難以言狀噫古今之人惟貴耳而賤目特異者乃見此耳不然安能結天下識者之舌也其經國圖逺之略推賢去惡之心而已形諸歌詠余雖老矣猶可拭目而待續勒銘於雙溪未晚云趙著序中書大丞相之子有竒名善為詩余在朔方時嘗見其一二駭唶以為異及獲觀雙溪小藁始信嚮所傳不謬云趙虎岩吕龍山世雄於歌詩為之序引甚偹余辭其贅歟古人嫌其少作往往削藁不傳如李賀七嵗賦髙軒過迄於今傳誦亹亹在人口不能廢則少作何負乎况雙溪相門子生長北庭戎馬間甫十餘嵗已能為歌詩至於斯嘻亦過人逺甚搏而躍之有激頽俗可無傳乎門下生秦人李暐眀之實為倡而我曹又和之其傳蓋無疑今雙溪已嗣行中書事將見沛然為文黼為卿雲蒸為雨露以芘澤其天下此特土苴耳雖然源於細流乃成江漢則是集其權輿乎固不可以不志麻革序

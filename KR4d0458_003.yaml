body:
  text: 雙溪醉隠集卷三元耶律鑄撰五言律詩寄趙虎巖吕龍山年來縁底事不復出柴闗兀兀千杯酒蕭蕭兩鬢斑一作暮色千峰逺年華兩鬢斑月明河漢淡天闊水雲閑目斷故人逺去鴻猶未還寄高仲傑一枕功名夢半年風雨床地高秋易老人去夜偏長悲賦傷鸚鵡哀琴怨鳯凰晚風吹落日明月滿寒塘寄人空翠撲晴影輕黄着栁枝春風戀游子渾似縱游時除醉更無事憶君方有詩如何一片月兩地照相思送元遺山行燕北秋風起幽花滿地開既邀今日别合道幾時來白玉煙沉閣黄金草暗臺不須傷老大珍重掌中杯送李敬齋行一代文章老素車歸故山露濃山月浄荷老野塘寒茅屋巳知足布衣甘分閑世人學不得須信古今難送完顔奏差行君侯詣闕日欵曲為慈親故國少知已舊山多逸民林園随分雨天地自然春四海滿桃李惜花無一人送正夫行嵗窮風景惡萍梗客天涯咫尺辭蘭省優游出鳯墀霜寒笳韵切天逺鴈聲遲瘦馬長途晚癡雲雪欲垂春日懐趙超然萬里故鄉夢五更殘月鐘去鴻書斷絶歸燕語朦朧流水艶春態好山呈曉容是誰将怨笛吹斷緑楊風寄郭隠君輔之寄傲人間世潜真計未踈鳥行恬豹隐􅙿食澹鶉居座列清談客門屯好事車不應馳素謁堅待偃波書秋夜對月贈唐臣寒水摇空碧西風滿玉琴孤光萬家月一寸百年心白鴈驚殘葉清霜急亂碪故山休掛夢無地可投簮永嘉周道人求詩一首氣昇期汗漫世法一黔婁啟鑰因師㫖咀芝從祖求肆言諧律吕不夢本精脩玉室金堂邇飄飄竹杖游客中寄懐李先生九山居士相憶復相憶登臨原本缺三字河山分野色風雨混松聲白雁書秋思蒼苔篆古情如何千萬里獨自計歸程晚集瑶華殿月浸瑶華殿雲垂素女幃水精簾半捲火玉燭交輝紫氣遊清宴休光下太㣲不知留帝所疑執化人衣火玉上尖下圓光照數十歩春日即事遲日照青春遊風蕩紫宸雪霜無氣力一作藉在桃李有精神幽思平欺酒閑愁自避人忘機殊不惡魚鳥者來馴泛太液池同虎巖龍山賦爛縱飛龍馭凝神入醉鄉烟霞生縹緲絲竹裊微茫蒲劍割秋水荷盤傾夕陽莫輕年少日青鬢易驚霜飛龍道陵所製泛太液之舟也又名翔龍伯哩行勝氣横千里懽聲洽萬夫虎牙為後拒犀首是先驅金練鴉兒隊銀槍鴈子都率然乗伯哩一戰下崲峹伯哩山名也遜多伯哩者即此遜多亦是山名皆在和林西南崲峹又在其南丁丑冬弄邉者軍敗之地也唐高仁愿節度西川數敗巢軍賊號蜀兵為鴉兒毎戰輙戒曰母與鴉兒鬭老将結髪究一作事韜畧驅馳一作從戎四十年長征秦五嶺苦戰漢三邉萬死奮不顧一生今幸全雲臺無住處何日上凌煙魏徴曰秦事五嶺漢事三邉云云平南将江淮平圯裂元不事梯衝鋭氣吞堅陣威聲挫戰鋒高昻地上虎王濬水中龍詎可同年語論功與定封北齊高昻字敖曹率兵渡河祭河伯曰河伯水中之神高敖曹地上之虎行經所居故相沃酹南征奏㨗宸算将雄斷天然是羙談一征平漠北再舉下江南須不聞漂杵何曽見溺驂元和歌聖徳恐未免懐慙一作展詩陳薦信頌徳為無慙西征白首征西将封侯儘未貪逺離窮髪北深入不毛南笑觧重圍困威延轉戰酣若須求虎子虎穴是當探聞北耗詔發大軍進討護軍承詔日驃騎佐輕車授豹韜攘惡教龍鈐辟邪除狼還得虎養虺竟成蛇致使雲臺将如雲過涿邪音耶經扼狐嶺得勝口會河戰場烏兎縱飛走急於寒女梭扼狐名好在得勝事如何暮雨連芳草秋風捲素波戰塵如可洗當與侍中過居庸闗秀㧞延天險寒盤萬古根東西躔日月南北限乾坤影落海山冷氣摇星斗昏如何戰塵下荆棘暗重門僊居亭意匠驚難状天然醉飲圖兩行風外栁一册枕邉書雲錦薰沉水鶯簧脱串珠煙光将勝槩特貯在僊居題虚白齋壁可待留靈𤨏方期得駐顔乆虗生白室長啟扣𤣥闗放浪形骸外逍遥天地間要當知霧豹依舊在南山書後堂壁丁未八月二日自西宫囘和林放浪形骸外寄鄉杯酒中催歸有情鳥促織可憐蟲落日隔踈雨斷雲垂渴虹弋人何所慕霄漢㸃㝠鴻迎風館滌暑迎風館雄風襲玉扉雲開天乙網霞捲羽人衣倒景摇清禁飛煙擁翠微泛蘭将轉蕙須更入羅帷司春園地偏饒勝事花事迥標竒春自長須在人誰盡得知笑宜教捧腹醉不解攅眉未那司春子騰譏釋二疑雪香亭月下偶得名酒徑醉為賦瓊露融雲液金泉湧月波帯花浮緑蟻和月卷紅螺夜色依香雪春容動綺羅是須轟玊笛倚弄玉龍歌余嘗有詩碎擘桃花泛酒巵時亦取花泛酒釂遺花者依花片數浮以大白蘅薄蘅薄頻牽望陽林六駐鑣香嚢徒叩叩雲月自苕苕翠佩傳情宻層波託意遥翩鴻漸高逝翻恨隔神霄擬西崑體後閣夜枕雨聲細曉牎花氣濃玉臺掛秋月繡幕生春風藻井翠盤鳯畫欄金走龍功名是何物只合付兒童讀新樂府集攬盡江山秀珠璣咳唾新艶浮天上錦情動月中人花鳥音容冶風雲氣象頻郢歌将白雪顦顇對陽春秋閨供給深閨怨秋聲又擣衣鴛鴦不獨宿燕子自雙飛塵暗芙蓉帳風褰翡翠幃馳心囑明月将此照金微春曉月下觀白牡丹小立猶癡睡凝情出翠籠玉盤承曉露金鏡掛春風豈為素娥妬不呈青帝功萬花推苐一誰更忌専宫詠雪樓曉倚欄干天低欲壓闌削氷封岳色飛席下雲端風陣連朝凍星鋩摇夜寒嶺梅應見怨何憚一來㸔日淡隔雲幕地虗鋪雪氊捲簾㸔不見如畫舊山川豈憶三杯酒能迴六月天一聲何處笛吹裂野梅邉圓福院竹虗心雖渉世貞節自孤堅翠矟掛明月錦䙀披紫烟豈無儀鳯日别有化龍年玉質捎雲裏唯須著列仙荅座客千紅将萬紫剪染盡氷𬎼莫晚誰施巧惟春自出竒向陽花易發伴老病難治若得如人意除天是國醫調人幽居瑟瑟苔封逕萋萋草暗堦蓮舟浮太乙玉笛噴洪崖巾漉塗糊酒爐煨榾柮柴莫将千古計取次却沉埋賀人飛泉幽居萬斛驚珠冷銀河落翠㣲自歌還自舞誰是復誰非高鳥投何處浮雲去未歸好風将落葉著意戀柴扉旅興白眼㸔時事剛腸厭俗流也知蜂有毒未信鼠堪投熟睡消磨日清吟撥置愁倚門應望切早晚賦刀頭倦夜時方南征展轉延清漏開簾納月光西風戀殘葉終夕伴啼螀静析沈邊徼踈鐘撼客床六龍應振轡飛日上扶桑無何狂醉隐三首無何狂醉隐慢訑音但更癡蒙雖渉人間世殊參塞上翁只須推倚伏不必論窮通且把無邉事横陳在酒中無何狂醉隐直拙更踈慵花鳥閑情外江山醉眼中渉江搴薜荔緣木采芙蓉待把人間事從頭問化工無何狂醉隐酣適是生涯馴護能言鴨調籠觧語花不應抛蝶夢須與趂蜂衙誰佐杯中酒仙人蕚緑華穹廬篇巢燕年年客山河日日新牕分一鏡曉一作碧門掩滿庭春棲鳥覊籠影行蝸游壁塵故園雖好在樓觀㡬荆榛寓居靈州北村野色荒烟暗氛霾畫影昏客情紛若絮塵事亂如雲楊栁春風渡北有黄河渡梨花暮雨春村落梨花特盛不如歸去鳥著意喚誰聞雙溪月下戲贈觸熱衝暴雨者夐入清虗府輕河漾月舟水天通色浄水月雜波流雨横蟻兵潰日熇山市收若然閒意况元不到心頭戊申巳酉北中大風衝風迴白日飛礫灑青天富貴城西畔珍珠河北邉陽氷元不冶隂火更潜然直徹龍荒外蕭條是野烟和林東北錫蘭河側有古城唐賈耽地志所謂仙娥河富貴城者是也仙娥今聲轉為錫蘭河烏孫所治赤山城西北三十里有珎珠河過東山縣有懐憶昨驚塵下腸迴望眼穿計程雖信宿恨别似經年自致青雲上誰來白日邉萬金遊子信空與夢牽纒再如蒲圻二首雲暝雨将雪天低風正寒簡書端可畏行李不遑安要路飛騰好窮塗進取難折腰徒自苦吾亦悔儒冠北走蓴塘路從公敢憚行凄凉當短日寂寞過荒城薄禄非吾願塵緣窘此生丘園如可樂何必問功名追悼大人領省鶴駕知何處仙遊閲古今英靈千載氣松栢一生心白日空寒色蒼天更暮隂志終伸不得遺恨海長深五言排律春色浮山外春色無高下寧分澤與丘世間依舊好山外若為浮桃李花争折池塘草自抽緑涵峰勢合紅溢燒痕收遲日千鍾酒東風百尺樓夜來甘雨足溪谷已成流七言律詩立春東帝施恩似恤貧嚴凝時節喚囘春未知和氣先歸栁便覺寒威不著人上苑三冬梅正發和林五月草初新世間均道唯春色春色年來也不均節物驚心苦見催一年還見兩春來臘寒自向人間盡春色却從天上迴乍暖栁條先易緑向陽花樹不難開高歌買斷西城酒更對東風盡此杯春日寓懐燕語鶯啼怯晚隂蝶狂蜂亂更闗心㝠鴻空自運寒暑駭浪為誰淘古今毎縱思吟輕萬户但信眉笑抵千金閉門不出近十日忽到水邉春已深三月和林道中未見草萌不覺清明夢裏驚問人人道過清明須知上苑花飛樹誰信和林草未萌一作生緑水歸鴻空自感淡烟啼鳥若為情翩翩瘦馬荒山路衰草斜陽正獨行西園春興因贈雪庭上人兼簡張公講師萬丈虹霓絡紫煙笙歌清沸雨餘天滿庭芳草翠如積一洞碧桃明欲然流水引來梅塢底春風吹到酒壚邉散花喚起毗耶夢從此無心號謫僊清明寒食清明失舊期躊蹰搔首日沉西風生楊栁鴉先覺寒逼梧桐鳯不棲山色雪迷春意老鴈聲雲遏暮天低蘇門二月春光好好逐東風發馬蹄重和惜春詩韻余時經始西園惜春情味舊情緣依舊中情似去年怪得玉音殊鄭重想将花事易唐捐白蓮已結為詩社翠水唯浮載酒船誰謂惜花人老大買花輸盡買山錢謹用尊大人領省十六夜月詩韻黄鷄白酒管絃和一任浮生嵗月磨銀管題詩悲逺客玉簫吹恨憶秦娥人言皓魄今宵減我見清光依舊多一十二時争幾許人間奈此世情何中秋對月銀燭煌煌十二衢冷金波浸酒仙居由來物外通明殿只是人間不夜珠玉女窻扉唯白曉素娥庭院更清虚桂花香陌無塵景坌入壺翁碧玉壺冬日即事征鴻南度老年華漸覺冬來眼界多寒雪狂風顫林木凍雲殘照鎻闗河高低山勢黄沙磧逺近人家白草坡極目碧天人萬里醉邀明月一高歌蠟梔五萬酬鞭直洴絖百金真食封蕭散不萌争閙趣真醇繆覬養生慵滌清研裏憨凡筆磨徹鑑中嚬窘容傷早𤣥㝠僣春令狐裘羔酒貯嚴冬日南至獵獵嚴風正酷寒一陽潜動舊闗山人情徒怨融和晚天意何曽造化慳暗逐寒威歸漢外漸回春色到人間明年桃李知多少莫把一作道東風作一作是等閒謹用尊大人領省龍庭風雪詩韻登高何處是燕然極目闗山塞草連落日幾峰寒帯雪西風一鴈冷横天冬居氷谷頼酮酒夜宿沙堤借草氊為向中州豪傑道天涯如此過年年凍折瑶琴三兩絃起來孤坐憶成連可堪此世成何事了却平生莫問天門外共傳三尺雪帳中頼有四圍氊遥思千古功名軰回首西風不記年九月道中遇雪宻宻癡雲曉自凝飄零蹤跡斷蓬輕幽禽底事啼長咽流水何緣浪不平清夢未迴人換世萬花應怨我寒盟故園回首腸堪斷雪滿荒山瘦馬行途中值雪不禁風色避穹廬寂寞行人止半途日暮闗河雲黯淡晚來天地雪糢糊千山未霽寒尤重一鳥不飛人更孤旋撥寒爐一罇酒故人知我此情無欲雪癡雲洩洩復溶溶底事龍公睡起慵薄暮遥㸔巖岫失夜䦨空把斗牛封徘徊天外心無定繚亂江頭色正濃寄與西風莫吹散梅花憔悴憶相逢雙溪書院對雪宴處雲華不夜庭為餐瓊蘂更談經聴随瑞葉風來處㸔散天花酒半酲白鳯羽毛寒蕩漾玉龍鱗甲戰凋零儻非太素司光化誰壓驚塵與效靈是嵗北征獻㨗送賈彦從淡煙衰草兩無情寒㵼金波送子行可奈驅馳來瀚海不堪牢落過清明半簾皓月人千里滿目春風鴈一聲瘦馬鞭催低塞日數峰江上雨初晴送馮贇北去南來牽利名紅塵鞍馬老生平天涯海角長為客薄酒新詩傷送行秋早地高山改色夜深風𦂳鴈饒聲起來細把歸期數今日一作夜凄凉第一程送安善甫龍庭二月送君歸底事人生足别離幽鳥一聲春寂寂東風千里馬遲遲煙迷故壘襟分處月淡山城夢破時此去萱堂休忘却堅持忠孝是男兒送魏隐居十年相憶不相逢一日相逢意氣同落落了無寒士態堂堂渾有古人風雨寒秋泣黄華淡霜重山涵碧樹紅嵗晚可憐猶是客素琴孤劍幾西東送誠之行惆悵分襟北海西悠然不覺涕漣洏自憐逺地無朋友忍與君侯遽别離萬里風沙秋半後一龕燈火夜深時相期老栢三千丈不改凌霜傲雪姿送子周行衰草凄凄塞日斜春風得意出龍沙南飛鴻鴈三秋雪東望闗河萬里家杯酌岐邉浮竹葉角吹隴上弄梅花征鞍迢逓中州道淡淡長空㸃暮鴉送子華行鴈行飛盡暮雲收送子岐邉酒一甌逺樹深埋黒山雪晚風寒索紫貂裘悠揚皷角千巖月慘淡闗河萬里秋寂寞歸來回首處幾聲山鳥語啾啾送孟端卿萬里歸來兩鬢霜百年閒事也難量跳丸嵗月無留計畫餅功名不可嘗鴻斷碧雲空落日塵飛滄海已生桑鶯花未老春猶在更對青山共一觴送寧朔説從薛燭授吹毛從事孫呉與六韜應䇿騰空調赤電驚弦裂石試烏號鼎魚幕燕由西極假氣游魂在北郊擊惰擣虚元有策必須先直取窠巢漢武名烏孫馬為西極馬時弄兵者由烏孫故地而束欵和林北境送李稚川雲來雲去元因雨花落花開總是風白酒儘堪驕富貴青山只合傲王公從甘鷄肋功名後已墮羊腸世路中為語屏山癡子弟虎狼叢裏逞英雄又一樽濁酒與君同握手相随出帝宫牧笛喚迴千里夢秋空㸃破一飛鴻參横斗轉闗河月山寂猿啼草木風酌别淡煙衰草路飄零蹤跡又西東送人是是非非儘自宜掀髯一笑且信眉休辭沉醉過終日縱得再歸來幾時極浦遥山遺别夢碧雲流水寄相思傷心去國頭如雪顦悴春風對栁枝送韓浩然開懐樽爼笑談傾未暇論文君已行富貴塗亨渠易致詩篇韻險我難賡已成傾盖金蘭友安用沾襟兒女情准擬秋深迓歸騎一樽濁酒逺相迎送子文還家道直如弦氣吐虹儘輸心計静頽風倦蘄待詔留金馬遽乞還山命玉驄天幕幾曽巢客燕雲羅終不掛㝠鴻多君高謝人間了不似癡僊醉夢中用西岡老人留别詩韻以贐其行二首健羡男兒得志秋錦衣歸去躍驊騮斷腸南陌人何在迴首夕陽水自流故里得歸真樂土浮生無處不天遊疲民正頼君侯手莫把功名讓黒頭昔年冷坐渭河濵獨釣寒波絶路塵流水高山千古事淡雲㣲月一閑身祗知門巷無俗客唯有琴書是故人今日聖朝方大用江山應助老精神和子文留别詩韻以贐行天涯牢落故人稀與子論文真所依萬里有行君有志雙親無恙我無違愁如流水何時盡身似楊花到處飛明日不堪離别處高吟新句贈元暉西行留别諸人緑楊飛絮草鋪茵到處春光隨意新幾箇道傍留别客萬重山外逺行人凄凉幽鳥喚殘夢狼藉野花傷暮春酒薄無由求一醉更堪歸鴈過來頻留别諸友環池亭上醉飛觴春暖波閑怕夕陽高掛無絃雲滿地一噴横玉水平塘檻依蘭影香猶濕簾隔泉聲意自凉後㑹不知何處是對床休避細商量讀甲子改元詔因叙懐留别諸相憶昔東征去國門黯然為别更銷魂若圖白首妻孥計是負皇家父子恩中統始開新甲子至元重整舊乾坤九州四海昇平望要竭丹誠翊至尊早行窻外寒鷄唱五更一作曉聲翩翩征斾掛疎星百年身世情如夢半紙功名醉不醒一作斷知名是誰家物不記人曽醉得醒欲吐半吞殘月淡似連還斷逺山青莫教草草生華髪消得幾回長短亭發凉陘偏嶺南過横山回寄淑仁浮游汗漫和南陔淑仁母在燕南故有南陔之語直指凉陘是九垓吾與汗漫遊於九垓之上淮南子偏嶺最饒秋色處横山不出冷雲來未須白鴈傳霜信巳早去聲黄花帶雪開中秋夜雪可盈尺北中菊花毎嵗必期八月開徹想得玉灤河北畔有人獨上李陵臺土俗呼為李陵臺者在偏嶺東北百里李陵失利在無定河外意其好事者名其山為李陵臺也古有李陵臺在唐單于都護府金河縣界近因北事和林親故離絶途次雲中先寄燕南一二知己棲遲徙倚賦登樓休想情懐似去秋著意不來㸔鬢脚豈知何事在心頭莫驚歌鳯狂猶在見說屠龍老更羞誰料一雙癡醉眼戰塵西北望神州寄西平鼠偷狗竊敢炰烋争信貔貅已締交将疊連珠調鵲角擬追逐日試蒲捎序移玉律隂風急氣應金商太白高惜别折衝罇爼地莫容南牧越臨洮春寒代人有寄睡鴨香消寳篆殘瀟瀟松竹雨聲寒水空流去鴈将盡花未放來春巳闌斜日多情送歸鳥碧雲無跡問飛鸞不應鳯女祠前月只許吹簫獨自㸔春日和林寄趙虎巖吕龍山年年芳草怨王孫日日幽人獨倚門蹤跡飄零又寒食别離滋味奈黄昏一樓風雨欺歸夢萬里雲山動客魂欲冩相思寄雙鯉亂離春水雪消渾春日寄懐魏隐居邦彦滿眼春風捲暮隂五噫歌罷更沉吟十年萬事沒孤鳥百念一時生寸心芳草不隨鶯燕老好山依舊水雲深遥憐野鶴高飛去夜夜投棲何處林登疊巘樓寄本庵粹中江山不盡古今情空冩相思遍鳯城滿眼氛埃昏落日一天寒色淡長庚近日長庚星見吟魂豈為閒愁斷别夢徒因往事驚早晚重将風雨夜細傾肝膽話平生寄岩翁游子不來春草碧忍聞啼鳥怨殘紅河聲忽與迴風斷山色還隨落日融華屋煙霞簫管歇鳯樓塵土酒杯空多應雲鶴相将去又在蓬邱第幾宫時巖翁復避事東遊寄李徴君豈當容易慕陶潜莫枉明時振廢淹薄宦情懐雖自減竦人聲價為誰添雷霆威重休輕忤雨露恩饒可共霑縱是世無顔叔子更宜學避魯人嫌寄國範昌齡總道綢繆恩好去聲在斷無人跡繼芳蹤情親便合稱三鳯友愛何妨號二龍莫為鬢絲抽思緒不将學海淬辭鋒緑波煙草灤陽渡獨倚危樓到下舂寄尹仲明兼簡盧進之别後相思撥未平登高西望轉闗情林邊殘日沒歸鳥天際斷雲飄晚晴乆把功名為外物擬将詩酒暢平生自從身世相忘後一作曉風吹破槐根夢萬事人間一唾輕寄李道隐之和竦誚馳聲牧九州覈元心事蔑王侯風情張日排巢父霜氣横秋拉許由騰笑務光何足比獻嘲涓子不能儔北山逋客幽棲地可是英靈許再遊余時自號北山逋客寄隐者投老嘗期謝草萊有人懐抱待君開叩元要給談天口虚白元宜養聖胎鳯尾諾雖徴不起鶴頭書合召将來莫驚此㑹知何地認取黄金是舊臺太宗第五皇子嘗召隐居故有鳯尾諾之語諾是應之諾或作識音志非壬子秋日客舍紀事因寄家兄判花歌鼓殷晴雷露葉風枝漾酒杯金水浄穿深巷陌玉泉浮動逺樓臺可堪白鴈将秋去又著青雲入夢來原上眷令何處所不聴游子詠南陔責友人不寄書堆積離愁無奈何年來俗態可堪嗟人情箇箇薄如紙世事紛紛亂似麻燕子不來書謾草鴈行飛盡眼昏花而今試問風蓬跡海角天涯到處家贈盧隐君放情丘壑謝囂氛逸氣翛然自不羣㨗徑豈容留隐士駕鴻方可是徴君獨輪車輾岩邊月十角牛耕隴上雲曽約華山分一半如何猶不許同分山谷詩不知繡鞍萬人立何如盧郎駕飛鴻注云盧徴君駕飛鴻歸隐也贈酒鄉道隐李君之和一自琳宫見錦囊幾回先爇玉𬎼香醉郷更比乾坤大仙境元饒日月長五栁先生陶靖節四明狂客賀知章無為未必無遺恨不列三千弟子行春晚懐吕龍山洞簫吹斷栁花風恨别蒼苔滿徑蹤幽夢已慿春領略凝愁惟藉酒彌縫千山落景沈殘角萬壑歸雲入暮鐘近説鬢毛渾白盡可堪空憶舊音容呈鵬南學士妙齡特逹冠羣英家世燈傳白與清氣壓西山正開爽學尊東魯獨精誠棠隂政簡琴心静瓜熟歸來句眼明他日宴堂香一瓣潜通玉照兩忘情復次趙虎巖元韻道直如弦氣吐虹幾人臭味與君同西湖處士林和靖一作君復東里先生吕本中舉世是皆驚炙駮有人應更憚乗騘阿誰狂直今如此不是癡仙即醉翁和光祖詩韻一首西風望斷碧雲深萬里關河入俯臨客思暗隨愁共逺髯氷疑是老相侵霜鴻傍月傳佳信寒雪漫天擁衲吟十載因循歸未得飄零蹤跡到如今寄題一枝庵主人消息盈虚莫費辭徳人何慮復何思窮通不信無非命貴賤由來定有時方欲自専齊物論未知誰任大宗師擊搏九萬三千里何異巢林在一枝送張夀甫尚書出尹河南滿路黄花照暮秋旌旄綽約促行輈名卿均逸膺宸算方牧分符聳士流翰苑文章饒雅趣伊川風物冠中州明朝黄閤求元老却恐綸恩妨勝遊燕市送客歸長安故居黄金臺上望長安何處青山是故山虹斷橋梁分雨脚露摇珠顆偃荷盤歸心暗逐飛鴻盡病眼空将倦鳥還芳草不隨遊子去日斜煙淡倚欄干送米君周還鎮陽驅馳萬里赴龍庭今日還歸出帝京一夜雪寒添客恨三秋風物動離情臨岐把酒君留别信筆成詩我送行賤子一言君記取得無青眼顧書生枕流亭振濯塵纓奠枕流桃花源上玉溪頭春風來領長歡伯和氣追陪獨醉侯童子只知除害馬庖丁元不見全牛癡仙事業依然拙甚識人間有棘猴題枕流亭竊期摛藻掞天庭閒作篇章抒下情殊喜濓溪愛蓮説未甘桑苧著茶經逍遥方外無為業整頓人間不朽名緣洗塵囂耳中事舉家移住枕流亭池亭用前韻推窮理窟叩真庭探索天心見物情憶昨㝠心捕蛇説笑今凝思相牛經未妨招隐教投跡不信潜夫肯著名愛煞清風與明月肯隨人意到池亭秋日避暑塵外亭軟紅塵外水雲鄉隐映雙溪避暑荘雌霓入聲連蜷應計雨雄風迴穴為輸凉年光變弄蒲萄色天氣經營菡蓞香只就北窻花栁下豈妨高卧傲羲皇泊白鱮江塵外亭高道士携琴相訪引迴柔櫓欵亭臯宛駐靈槎泛雪濤塵外水沈薰􅔽蓞甕頭春緑漲蒲萄紅螺山色秋尤健白鱮江聲曉更豪安得投簮招隐士就携寒玉從琴高寒玉寳琴名見國史補弊家有琴亦名寒玉飲方湖菊洲塵外亭三徑雖然已就荒菊洲猶在水中央不愁塵外仙無路切喜花前醉有鄉倦鳥也知人去就狎鷗元識我行蔵浮遊種種真滋味更索教誰子細嘗題四娯齋門掩壺春安樂窩紛紛俗事奈人何須慿歡伯攻愁陣自有桐孫伏鬼魔遣興色絲何擺落塵懐黄嬭觧消磨拍欄一笑遥山碧付與兒童學揣摩雲滿蘭窻霧滿階恍疑身世在瑶臺琴餘細嚼陶潜句書罷深傾李白杯流水浄拖飛練去好山晴與翠屏開百年樂事能多少何必更歌歸去來細細清風染緑槐絲絲踈雨洗黄梅山圍樓閤週遭碧花遶欄干次第開日落青天見螢火雲歸滄海聴蚊雷知音不是王夫子誰為陶潜送酒來縱遊壺天園水摇晴影漾樓臺臺上花前載酒來楊栁不勝金縷瘦海棠空自錦雲堆夢隨蜂蝶尋春去興入煙雲盡處回欲紀所思吟不得却誰先篆滿蒼苔夜宴壺天園門掩僊居不記重紫霞容與貯春風玉簫赴節徴雙鳯蘭燭飄香擁六龍織女下時星自落姮娥來後月長空始知不死瓊田草唯在壺中罨畫峰春旱郊園諸花猶盛醉歸憇槐盖隂下渴雨苗雖未發榮可無芳意慰坤靈草緣近水堤邊緑栁繞新池岸上青花匠鬭供春制度麴生專與我調停且傾翠盖誰如故依舊槐隂滿後庭題縉雲山五湖别業為愛煙光可掛懐併供幽思上靈臺縉雲直㧞空青起落水横吞野翠來欲界曲隨仙境變好花争映畫屏開終期盡把閑桃李就此名園勝地栽陶𢎞景有言山林竒處乃欲界之仙都也五湖别業新園除了五湖煙月外只容春色入重闗可憐東郭㕙三窟不見南山豹一斑獨醉軒昻花栁下無塵亭立水雲間誰期造物輸元力更許清風恣往還小隐園擬樂天吏隐廰西小隐園小池塘在卧房前指垂楊栁為煙客認白蓮花是水仙歌接栁枝翻折栁醉斟蓮葉倒垂蓮不煩馳譽丹青筆勝醉仙圖是處傳蘭畹見和鄙語無塵亭復用元韻苔色連堦草滿庭且圖榮恱野人情任呼醉隐為書簏要識書滛已醉經高卧莫疑将索價浮遊須不近沽名秪消卷跡囂塵外寄傲空凉水上亭春晴極寒登池樓書事晴影深涵碧玉流欝香蘭芷暗芳洲凍侵鶯舌聲全澁風戀花枝顫未休目斷野煙横極浦心懸江月入高樓應須買盡人間酒更不令寒畫一籌和林春舍叙西園前宴招一二友生重飲樓閣參差翳紫煙佳人情重惜留連月明楊栁春風夜寒食梨花暮雨天将謂浮雲寄浮世豈知流水是流年慇懃一作人生不醉花時酒强作守錢奴可憐清明前一日月夜對酒招季淵飲醉鄉吟社雨厭厭寒食清明事已兼春計政侵雲子酒月華不隔水精簾幽蘭香結成凝陣寳篆煙空儘未添連璧勝遊心賞在莫輕傾盖一掀髯憶雙溪蘭洲懐抱玉溪分龍自深蟠草自茵樓觀幾經浮世換河山依舊主人新鶯花有意長留我桃李無言自好春想得多情怨遲暮不應終老馬牛塵春日西園招雪庭暇日浮雲漾緑波晝閒風静好經過護花飛蝶來逞舞戀栁啼鶯自獻歌妨物性踈輕物議惜春情重奈春何流年不為朱顔息莫一作誰厭罇前語笑多匏𤓰亭二首一壺天地備莵裘應結壺翁物外遊田仲儘當多屈轂惠施何得應荘周豈容五石為無用好辦千金預與酬瓠落縱甘成棄物世途元一作須更有中流擬挹清風潁水濵坐忘顔陋謝囂塵素知居士非田仲只識幽人是卞彬儘辦仙家方外地徑輸花塢甕頭春豈為無口辭供濟好慮為樽與問津縉雲五湖别業書事縱恬高蹇狥真愚元也中心怯畏途共命不能同好惡寄生那有異榮枯為管獨醉成三窟方引雙溪入五湖就著鶴頭書背上已私𢎞景兩牛圖余先居和林後寓隗臺今卜築縉雲五湖别業皆營園亭榜曰獨醉司空表聖有共命鳥賦其序云西方有鳥名曰共命連腹異首而愛憎不同一伺其寤得毒卉乃餌之既而藥作俱斃西園席上招雪庭裕上人山光摇蕩入簾櫳酒漾歌雲暖玉融煙栁翠涵深院雨露花香濕滿樓風自從愁陣持降節擬與詩兵紀戰功借問飄零斷腸客為誰幽獨卧蓮宫讌臺萬象森羅動翠華謫仙名擅地仙家忽疑羽化隨青鳥空記嵩呼隔彩霞休計露盤承玉屑枉徴雲液就丹砂兩龍勝迹空流水流盡臨風野薺花蒼官臺誰賛君侯締搆功盡收形勝壓天東洪流下瞰朝宗逺疊嶂横陳保塞雄鳯闕凝眸雲晻靄鷄林指掌樹㝠䝉髯龍似識登臨意時擺寒梢弄晚風郝侍中釣臺槎杌荆榛薙草萊欲令無一㸃塵埃行歌正則行吟澤坐嘯狂奴坐釣臺鳥道不衝天宇斷鴈行横過海門來黄華已為西風瘦更對凝霜鬢影開獨醉亭澡雪精神住福庭放言須不逆時情推移殿最修花史分别賢愚著酒經愛酒愛花俱有趣獨醒獨醉兩一本作總虚名秪知髙挹清風處萬古心期是此亭麗珍花品序云花以優劣為殿最醉鄉日月云凢酒色如金而醇苦者為賢黒色酸者為愚書三樂軒壁雖任無為定是非更須教勒北山移筆驅造化天何補身負聲名道不知見説丹心明奪鏡忍将青鬢照成絲深根寧極如無待越世含華却是誰醉書雙溪書院醉經堂壁自從天隐自然庭愈覺囂塵噴鼻腥可要洞研齊物論唐子西號酒為齊物論更須深味洗心經余號家釀為洗心經獨醒終了醒如醉獨醉那辭醉不醒别有聖賢真趣在古人糟粕是螟蛉宴玉津園碧玉池塘翡翠堤露軒飛榭擁璇題蝶迷芳逕有時見鸎就綠隂深處啼不覺徑來穿月窟可能須待躡雲梯一壺春色長留在盡夀吟仙取醉泥和林西園月臺懐吕龍山日薰花氣暖徘徊花影横斜入酒杯不見海棠春睡足可憐江燕晚歸來煙迷野色自芳草水落石根空翠苔誰勸流鶯聲且住有人凝絶在高臺暮春登凌雲臺水自長流鶯自啼雀來巢壁燕來飛紅銷歌殿野棠瘦緑暗粧臺春草肥今日不知明日事今人休笑昔人非寥寥千古登臨思分付東風與落暉鳯凰山别業寄潤甫儒醫尤嫺於攝生湫隘囂塵不可居鳯凰山豈厭潜夫無花不欲教為主有草須堪便結廬元化唯珍五禽戯通明殊玩兩牛圖莫驚獨醉居無事心醉鎔經與鑄書春園勝事分明日月多金蓮川上愛涼蝸珍珠栁裊垂珠樹翡翠茵舒展翠莎虚白室常安樂土軟紅塵不到行窩魏焦孝然目其草廬曰蝸牛廬愚以行帳為行窩尋亦號為蝸牛舍云索教粧㸃新春色分剩山花四五窠金蓮川境有樷栁葉上皆有緑珠十數顆獨醉園對酒獨醉園中獨醉翁醒時還與醉時同秪因矯思元如矢切是修身更似弓無可奈何依玉友有何不可任崖公酒鄉縱裂封侯地且就擒姦莫論功贈漁者蜃樓鰲殿對柴扉旋挽新荷補舊衣短笛有時渾落調曲鈎何計可忘機滄波萬頃淡煙合白鴈一聲黄葉稀回想渭濵人去後夕陽空滿釣魚磯贈僊音院樂籍侍兒著名僊籍擅芳春料理霓裳紀見聞欬唾隨風落珠玉笑談傾座播蘭薰龍酣醉笛吟秋水鳯咽歌樓遏暮雲喚起沉香亭上夢海棠花睡月紛紛聴歌恰弄歌珠引玉清梁間已早暗塵驚流風迴結行雲住激水延緣潄霧生只道緜駒殊茹噎豈知王豹竟吞聲若為更得形容盡曲折浮沉怨慕情戯詠花鳥名緑窻鶯喚起来時一作遲不分香名屬玉兒長夀樓中曽鬬酒合歡帳裏更聨詩音生曉月鳴批頰晴浸秋波浴畵眉蝶粉團香凝白雪背人含笑擁烏絲呼盧争戴勝籌時轉覺輕盈屬玉兒長夀樓空留鬬酒合歡牀窄更聫詩從他有怨教批頰却自無言也畵眉蝶粉團香凝白雪背人含笑飾胭脂春懐碎擘桃花泛酒巵對春還詠惜春詩鶯能承意歌楊栁蝶觧含情舞柘枝世事儘它無定論醉懐却自有開時嵗寒亭下青松樹春去春來總不知病起書事性恬乖刺與麄踈誰説清狂痼疾除可要更須教失馬時失羣馬秪應元也示懸車勝遊索辦煙霞屐緒業非攻種樹書多幸老民殊有趣醉鄉日月是華胥病中述懐雨聲一夜到床頭一洗胷中萬斛愁世態低昻付蠻觸宦途消息寄蜉蝣暑天卧病獨癡較少日勤行半素休頻夢江湖豈無意此身栩栩是沙鷗即事可人天氣不寒温詩滿花牋酒滿罇亂列曉山煙淡碧謾流春水雪消渾四時風月無佳客一榻琴書静掩門吟罷新詩須酌酒别離情緒易黄昬馬上偶得十年南北復西東萬里乾坤走斷蓬燕子不來春一作天淡淡鴈行空過雨濛濛故園花栁依然好瀚海風光却不同寂寞清明寒食節幾聲啼鳥怨東風石梁飛梁横絶浪花中寒壓驪龍第㡬宫却月暈光圍倒景渇虹垂影跨長空凌波自接㫒仙路煉石應勞併鬼工好歩青雲天上去未應入世限西柬飲鳯凰山醉仙洞有歌稼軒鄭國正應求死鼠葉公元不好真龍瑞鷓鴣者因為賦此鳯凰山色媚芳塵不著詩仙寫不真靈境愛饒花氣味老懐欣辨酒精神煙霞裏靣長春洞天地中間獨醉人未讀離騷唯痛飲可慿誰説與靈均閱舊藁有出六盤時干戈旁午驚塵日書劔零丁去國時之句因足成之㸃檢唫懐課所思最闗情是舊題詩干戈旁午驚塵日書劔零丁去國時陳事上心空擾攘當杯入手莫推辭春風信染千紅紫合染幽人兩鬢絲桃花源别業重理舊藳戯題無憂樹下無懐氏獨樂園中獨醉仙八斗待量珠玉價等閑不若一囊錢辭鋒幾挫毛元鋭心印都傳楮守𤣥未礙劉郎長占斷桃花流水洞中天自題擬樂天有客清談如妙𤣥笑愚聲跡不虚傳風花煙月三千詠拙直聾盲二十年翫世遨頭狂醉隐采真稱首浪遊仙不知樂聖軒窻下觧到南華第幾篇庚申嵗夏囙六盤之變嘗與巴特瑪其名者質諸天日約分二道邀擊西師頃聞其人為敵謀将遂賦此為食言者之戒定交情分一何深許論傳烽過燭隂燭隂即燭龍也約雪神羞同脱口誓清天歩共銘心我平高闕旋龍勒君取花門出鳯林須是有盟如皦日豈宜相與世浮沉獵北平射虎飛控遺風獵北平澹隂平野草青青南山白額威何振東海黄公厭不行徑㨗鳴髇延滿月奄驚繁弱激流星由來一片斕斑錦别在神幾霹靂聲閬州海棠溪擬樂天閬苑仙從閬苑西縱遊還過海棠溪徑隨翠碧穿花去却聴黧黄繞樹啼迴玉花驄鏘玉勒約金絲栁上金堤五城勝概歌詩草醉墨淋漓盡赫蹏臨潼九龍玉蓮二湯今為道院九龍湯湧玉蓮香龍去蓮枯堕𣺌茫夢雨已迷三里霧悲風空泛五雲漿長生殿圮金沙冷王母祠傾玉蘂荒終古曲江江上月恨和煙草怨霓裳遊奉聖州龍巖寺卧龍高卧幾晨昏依約靈巖隐卧根雲磴屈蟠侵鳥道翠屏環合掩山門浄名花界開中葉其方丈茶榜云萬松中興興聖蓮宫庇上根龍巖寺本舊興聖寺不就卜居殊勝地忍衝煙靄下孤村余時客宿趙家堡北村次韻舟行次蓬州遊歴州境憇蓬萊堂共傳靈境可攄懐指示龍章與鳯臺白鼻騧騰横吹去黄頭郎逓棹歌來青山緑水紆迴處萬紫千紅次第開非獨醉仙無所定素知元只在蓬萊岳臺懐古萬古神州就一作竟陸沉戰塵猶自結閒隂日邊簫鼓衣冠盡天外樓臺草木深江月和愁傳桂燭野棠無語寄春心如何黄鳥年年在不説東風怨上林三月到旺結河有感楊栁盈堤凍未蘇年年王吉舊程途經春積雪隨山在慰眼幽花到處無簾外月明人影寂枕邊燈暗鴈聲孤又還虚度清明節獨倚東風酒一壺中統庚申詣闕寓居宫東寺口號日華浮動卧龍邱便覺妖氛散不收佳氣鬰葱形勝地霏煙紛郁帝王州碧蓮花擁三千界白玉城駢十二樓可要翠灤環寳勢不容滄海更横流鄂諾道中自西宫發程至鄂諾河山重水複風雨相繼日復一日偶失羊馬所在因記其事而賦云嵗月峥嶸老思荒句中無盡寫荒凉山山水水三千里雨雨風風一萬塲致福不應須失馬耽書堪笑竟亡羊百花留得芳葵在傾盡丹心捧太陽遊大翮山路盤空翠上青天下望皇州一㸃煙雲葉去堆人脚底日華垂在馬頭前露花煙草芬蘭麝百籟羣鳴播管絃可誚舊遊王次仲不來尋謁酒中仙山海經云其山在居庸北登陟其巔下視燕都城郭郊原煙靄間如圃畦隄塍

body:
  text: 原跋雙溪一代佳公子也早嵗作詩有聲每一篇出輒誦人口遇得意處不下古手此蓋天機頴脫有不可掩者使然也是嵗秋八月以詩近百篇寄虎岩趙君虎岩詩人也見之擊節歎賞以謂天下竒才而欲版行一新衆目焉而屬豫題於後或者曰乃公之少作其可乎余曰不然昔唐元微之有代曲江老人百韻及清都夜境等篇至於元和中李長吉髙軒過二公之作皆年未及冠今在集中數百年間孰能以少壯為辨而少之耶言詩者不當以區區嵗月計其工拙矣嵗次甲寅季冬二十有五日木庵老衲性英題嘗觀雙溪詩氣韻髙逺清新絶俗道前人之所不道到前人之所不到情思飄如馭風騎氣真仙語也彼騷奴詩偷安識所謂神者每以不多得為恨今年秋八月承寄僅百篇於趙虎岩光祖不敢珍藏祕惜乃復刋行之以新世欲見而不可得者此可與奪標掣鯨手道難為餘子言也王萬慶跋

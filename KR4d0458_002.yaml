body:
  text: 雙溪醉隱集卷二元耶律鑄撰樂府凱歌凱樂詞九首并序列聖尤宋食言棄好皇帝命將出師問罪奏捷獻凱乃作南征捷等曲云昔我太祖皇帝出師問罪西域辛已嵗夏駐蹕鐡門關宋主寧宗遣國信使苟夢玉通好乞和太祖皇帝許之敕宣差噶哈護送苟夢玉還其國辛卯冬我太祖皇帝南征女真詔睿宗皇帝遣信使綽布干等使宋宋人殺之睿宗皇帝謂諸王大臣曰彼自食言棄好輒害我使今日之事曲直有歸可下令諸軍分攻城堡關隘由是長驅入漢中此其伐宋之端也寧宗實録第四百六十一都幹苟夢玉銜命使彼宋四朝國史列傳第七十七賈陟傳苟夢玉使北還宋閬州譙慶茂所編蜀邊事略紹定元年戊子制置使鄭損與所代官四川制置使桂如淵會于順慶使以時相所喻和議密指告之且畀以朝廷所授苟夢玉使北録二册理宗實録第八十三紹定四年辛卯北使蘇巴爾罕來以假道合兵為辭青野原沔州統制張宣誘蘇巴爾罕殺之理宗日厯第三百九十五十月二十一日沔日州統制張宣誘蘇巴爾罕使曹萬户𠞰殺理宗厯第百五十一寶慶三年丁亥正月十一日辛酉姚翀朝辭進對次奏通好北朝事上曰以我朝與北朝本旡纎隙不必言和只去通好足矣尋食其言敢殺信使孰曲孰直明矣故詳而疏之南征捷食言自是是誣天遊鼎魚疑戲洞淵爭信有從天北極目無江表已多年拾遺録瀛洲有洞淵廣千里有魚身長千丈鼓舞戲其中拔武昌設竒包敵縱蒙衝絶似飄風捲斷蓬填得大江流不得先聲已不見江東戰蕪湖一曰戰丁洲舳艫千里蔽江湖擲挑樓船為騷音掃除先直前鋒三十萬一通嚴鼓盡為魚下江東舉國全兵失要衝可無一策抗元戎細推餘百年來事合册江神拜上公定三吳奮威驍騎下三吳神將飛馳一丈烏視彼衆雖百千萬黍民逰動跨玄駒克臨安擬歌陌上行人去猶自傳歌陌上花花解語時應也問即今春色媚誰家坡仙有陌上花其序云逰九仙山聞里中兒歌陌上花父老云吳越王妃每嵗春必歸臨安王以書遺妃曰陌上花開可緩緩歸矣吳人用其語為歌含思宛轉聽之凄然而詞鄙野為易之云陌上花開蝴蝶飛江山猶是昔人非遺民幾度垂垂老逰女還歌緩緩歸陌上山花無數開路人爭看翠軿來若為留得堂堂去且更從教緩緩回江南平橫野萬艘金趐艦總戎一册玉鈴篇長江豈限天南北萬劫坤靈戴一天橫野大將軍位次與諸將絶席制勝樂辭燀音闡耀威靈結陳鋒信爭敵愾獻殊功全師保勝清時策元在天聲震蕩中聖統樂辭幸值聖明臨御日更逢文軌混同時聲熏天地神功頌潤色光天統業辭後凱歌詞九首至元丙子冬西北藩王弄邊明年春詔大將征之竒兵一旅竒兵出禁宸略時彈壓定驚塵蕭條萬里無遺冦信道天家又得人沙幕金節煌煌下玉京魚麗三十六屯兵一軍電激穿沙幕萬燧雲繁戰野營時大將北討偏師雲繁敵於大漠集將張良傳諸將皆與上定天下梟將也漢髙紀燕人來致梟騎助漢應劭曰梟健也張勇曰梟勇也若六博之梟也愚意六博得梟者勝故以梟將命篇梟騎雲騰自北征領軍梟將最馳聲橫穿外壁風前陳直搗中堅月下營翁科蜂屯蠶簇亂山􅢩蟻動鶉居亂草坡露體露形千萬指懇祈天語許降和崲峹畔敵休矜戰騎多紛羅區落遍山坡那知未鼓投戈地待閲前徒競倒戈我軍與敵陳於崲峹未鼓敵潰投降者什五六馮奉世傳將軍有叛敵之名注曰不敢當敵攻戰為畔敵也崲峹地名在和林西南降王控黃龍戍爭雄地登白龍堆摶戰場竒正相生神算在糞除勍敵獻降王科爾結初若疾雷威似虎復如脫兔速於神想當持節為飛將秪是如今著翅人我軍輕騎取敵輺重于科爾結蓋河南地也後周韓果北征敵人憚其徑勇趫捷號為著翅人露布露布突馳爭逐日雷鞭攙遞鬪追風只自向時龍尾道競來雲集萬寧宮燭龍封略誰容限燭龍終將天地入牢籠雲興飈起威名將也好先收第一功遺敵出奔西北大荒唐燭龍軍之邊地也凱樂歌詞曲并序周禮大司樂曰王師大獻則令奏凱樂大司馬曰師有功則凱樂獻于社司馬法曰得意則凱樂凱歌以示喜也崔豹古今注引周禮王大捷則令凱樂軍大捷則令凱歌與其所引不同周禮旡凱樂凱歌之别然則豹之辨君臣尊卑之説于理為得不旡所據郭茂倩編次樂府詩集有晉凱歌二首隋凱樂歌辭三首唐凱樂歌辭四首凱歌六首詠其君臣殊勳異績聖上恭行天討北服不庭命將問罪南舉江表國家盛事不可不述擬唐凱歌體敢作凱樂凱歌云征不庭大駕北征也天下英雄入彀中得旡威震折遐衝會須六幕氛霾了化日長明照九重取和林恢復皇居也飛天府玉灤春德水清流復舊痕金大安元年河清上下數百里次年庚午我太祖皇帝經略中原易乾鑿度曰聖人受命瑞應先見於河河水清坤靈圗曰聖人受命瑞必先於河河清之徴太祖皇帝受命之符也德水見史記唐凱樂歌辭千年德水清自非電斷光前烈誰得重霑雨露恩和林城苾伽可汗之故地也嵗乙未聖朝太宗皇帝城此起萬安宫城西北七十里有苾伽可汗宫城遺址城東北七十里有唐明皇開元壬申御製御書闕特勤碑按唐史突厥傳闕特勒骨咄祿可汗之子苾伽可汗之弟也名闕可汗之子弟謂之特勒開元十九年闕特勒卒詔金吾將軍張去逸都官郎中吕向齎璽書使北弔祭并為立碑上自為文别立祠廟刻石為像其像迄今存焉其碑額及碑文特勤皆是殷勤之勤字唐新舊史几書特勤皆作銜勒之勒字誤也諸突厥部之遺俗猶呼其可汗之子弟為特勤勤謹字也則與碑文符矣碑云特勤苾伽可汗之令弟也可汗猶朕之子也唐新舊史並作毗伽可汗勤毖二字當以碑文為正下龍庭戡定北方也翠華一動下龍庭生意還從一氣生樂國得非為夀域聖人須自有金城東漢書燕然銘凌髙闕下雞鹿經磧鹵絶大漢踰涿邪跨安候乘燕然至龍庭以前後諸傳事迹考之又以出塞三千餘里校之龍庭和林西北地也金蓮川駕還幸所也金蓮川上水雲間營衛清沈探騎間鎮西虎旅臨青海追北龍驤過黑山子史所載黑山不一北中黑山又多皆非子史中所見者折木臺弄兵取敗之戰所也辟易天威與勝風一場摧折盡竒鋒西北龍荒三萬里併隨驅策入提封上親擊敗西北弄兵藩王于上都之北地折木臺之西駐蹕山駐蹕所也轅門鼓角揚邊雪營幕旌旗掣朔風相與河山雄帝宅威稜尤壯受降宮益屯戍詔諸王益戌兵也睿算籌邊勢萬全益屯貔虎在雄邊東連王塞西通海南接金山北到天恤降附優詔存恤降附也一新汗俗浴恩波天地間人感慨多我澤如春民似草聖元天子布陽和著國華西北諸王稱藩繼有平南之捷也四海承風著國華更旡龍虎龍虎二陳名也漫紛拏際天所覆人問地今日都須是一家後凱歌詞九首詔發諸軍有事於朔方也戰盧朐神策霆聲振九區縱兵雷合戰盧朐競將蔽野衝雲陳只片時間掃地旡區脫雲屯區脫會天兵雷動龍趍從北平馳驅日逐飛龍陳夜薄花門偃月營國朝以出征逰獵帳幕之無輕重者皆謂之區脫凡軍一甲一竈亦皆謂之區脫史傳所載區脫即此史記中間棄地各居其邉為甌脫韋昭曰界上屯守處索隱曰纂文云甌脫土穴也又云是地名前漢書漢得甌脫王發人民屯甌脫以備漢晉灼曰甌脫王因邊境以為官蘇武傳區脫捕得生口服虔曰區脫土室北人所作以候漢者也李竒曰北人邊境羅落守衛官也師古曰區輿甌同區脫本非官號北人邊境為候望之室若今之伏宿舍也因其所解不同故備録之以各居其邊及備漢捕生口之説明之是邏偵者之營幕也審矣克夷門蟻擾蜂喧笈騎過鼓儳爭自落長河人人鬪説空鞍馬不似今畨數最多高闕駢馳追鋭翼摧鋒梟獍窠巢一夜空光射鐡衣寒透徹冷風如箭月如弓我軍掩遺敵于高闕塞境史記趙武靈王築長城白代傍隂山下至髙闕青將六將軍軍出朔方髙闕漢書衛青李息出雲中至高闕後漢祭彤出高闕塞吳棠出朔方高闕則其地也通典高闕唐屬九原郡九原縣西北到受降城八十里唐書今之西城即漢之髙闕塞也北去磧石三百里追鋭摧録皆軍名也戰焉支羽檄交馳召虎賁期門受戰已黃昏信剪鯨鯢知有處山川爭震蕩乾坤馬支山在張掖右軍殄敵二大憝于此霍去病涉狐奴轉戰過燕支山即此也涿邪山鼓譟歡山撼涿邪飛龍㢋音侈翼掩螣蛇露營罷繚神鋒弩雲陳猶轟霹靂車我軍敗敵于涿邪余嘗有處月説稡載其略於此云云南鄰處月之郊和林城唐碑文也未曉處月之為言有問及余者因為之説云云處月之言磧鹵地也史記漢復使因杅將軍公孫敖出西河與強弩都尉路博德會涿塗山注音邪前書因杅將軍出西河與強弩都尉會涿邪山後書祭彤傳出高闕塞九百餘里得小山妄言以為涿邪山竇憲傳鄧鴻與後諸軍會涿邪山皋林溫禺犢王於涿邪山聞漢兵來悉度漠去班固燕然山銘經磧鹵絶大漠踰涿邪涿邪山者其山在涿邪中也涿邪後聲轉為朱邪又聲轉為處月按唐史沙陀處月種也莊宗紀其先本號朱邪後自號沙陀而以朱邪為姓者是也南部新書北人三十輩於大山中見一小兒遂收而遞飬之長求姓衆云人共育得大遂以諸耶為姓朱邪者訛也此説可笑朱邪即涿邪也諸耶二字俱是華言遐荒殊俗隔絶中華焉如華言以為族望處月部居金娑山之陽蒲類海之東皆沙漠磧鹵地也西漢書注薛瓉曰沙土曰漢其説得之即今華夏猶呼沙漢為沙陀突厥諸部遺俗至今亦呼其磧鹵為朱邪豈可謂以諸人為父耶朱邪初曰涿邪後聲轉為朱邪又聲轉為處月今又語訛聲轉為川如天竺初曰身毒後轉為捐毒又轉為天篤篤省文作竺竺又轉為竹音蠕蠕初曰柔然後曰蠕蠕又曰芮芮狄歷訛為敕勒又訛鐡革步搖訛為慕容秃髮訛為吐蕃若此之類不可勝記是皆從其鞮譯及所書之人鄉音輕重緩急而致然爾且諸夏方言尚不能同况中國事記外國語元無本字但取其音聲之近似不可取其訓詁訓者釋所言之理祐者通其指義所記之語既無本字豈有所言之理所通指義者哉云云曹孟德攻袁紹為發石車紹衆號曰霹靂車螣蛇陳名見後魏書飛龍亦陳名金滿城元取北庭都護府府境都鄙有城曰金滿城後漢書云金滿城此其西域之門户也寄重旌分閫外憂順時驅率萬貔貅回臨金滿城邊日奄奪蒲昌海氣秋金水道旁張虎翼攙風陳直突龍城襲雪山逴夜可偵金水道防秋豈在玉門關京華橫車組練似春花來自天涯與海涯説道掃除祲氛了凱還歌奏到京華德勝樂二首揖讓躋龍厯謳歌適鳯符鑿空十萬里攘地幾千都神斷光宏業天威震八區控弦三百萬自號感恩都騎吹曲辭九首金奏大夏王庭前納欵大秦歸義繼來降舞鸞歌鳯音相和未許天山數帝江大夏國大秦國皆見漢書王庭歸義州見唐書羈縻州府玉音燕巢飛幕負恩私逺近囂然共一辭列聖玉音明在耳敢忘龍道請降時白霞前騎傳聲掩白霞後軍猶未過烏沙勢須貴合為猿臂相制尤當似犬牙白霞在和林西昡靁毳幕雲羅寒露野羽旄星屬昡靁鄉悔將峴望風塵眼不為長觀日月光塞門邏騎紛紛與冠軍遞相窺隙伺攙昏倚曽延敵臨高闕示斂疑兵突塞門受降山望風降附祈為地披露精城示所天若非上將龍旗下會是中軍虎帳前自高闕之捷敵稍稍來附我軍遂屯古受降城山下其土俗曰拂雲堆者此也由是知其非漢公孫敖所築受降城是唐張仁願所築三受降城中之受降城也因以受降名其山即述其事云鳯林關祇須盡敵巡烏水未可移屯過鳯林切索更虞蜂蠆毒恐還爭縱虎狼心司約留犂可要教撓酒徑路何為更契金事豈出人明算外慕容虛美漫熏心北中諸國風俗凡大盟約必以金屑和飲其所從來逺矣漢車騎都尉韓昌光祿大夫張猛與呼韓邪單于為盟約呼韓邪單于徑路契金留犂撓酒應劭曰徑路北人寶刀也留犂飯匕也撓和也契金著酒中撓攪飲之顔師古曰契刻撓攪也撓呼高反軍容雖許侯王復正封飬威尤可耀軍容漁陽馬厭銀山草雞鹿屯營鐡堠峯銀山在北都護府境土人今尚有此稱銀山外有大磧曰銀山磧世俗所謂鐡堠者在金山下後騎吹曲詞九首吉語交鋒接矢無虛月按甲休兵定幾時計日必須聞吉語敢先期獻凱歌辭金山黃花堆上冷雲間彍騎雷奔去又還説敵自相爭粉潰回戈霆鬪過金山天山曜我皇威下帝臺靈旗真傃北庭開定應六出竒寒雪瀚海隂風結陳來處月陳兵濶里黃蘆淀轉戰斜車尺遮切白草􅢩飛騎星馳穿處月追亡逐北入沙陀我軍敗敵右部于處月濶里嶺名臨處月黃蘆淀斜車山名在濶里南大漠又去斜車西南數百里獨樂河貝胄星離爭射日蜂旗雲合逈生風雷馳霆擊相紛薄獨樂河邊水草中唐史獨樂河又曰獨邏河不周熊羆此去從無定梟獍當來自不周清一八紘天意在已教剋復了神州遝綈絲長驅席卷盡連營震攝黔雷撼北溟虎豹騎從雲騎隊幾臨西極到殊庭邏逤磨崖金字昆崘頌勒石銀書邏逤銘且述要知方略在聖人不戰屈人兵柔服柔服禺強總四溟神開寶厯見時情夜陪萬國升平望蹈詠清風播頌聲後畫崔駰傳詠太平之清風古戰城南結陳背南河指顧望城北冠軍申號令謂彼是勍敵今朝一戰在有國與無國但得社稷存此命不足惜風雲為動色士卒為感激竒正遽雷合橫衝奮霆擊雌雄勢未決忽忽日將匿以劔指羲和揮戈呼上聲天日天地有情時敢乞饒一擲貔虎張空拳搏戰到昏黑忽焉如海泄聲震裂區域對靣不辨人何許可追襲平明按戰所澗壑盡平積畢賀雪前恥有力于王室拜詔未央宮哀懇辭封邑五湖舊煙景先師有遺迹戰城南自來古戰場多在長城南少在長城北茫茫白骨甸如何直接黃龍磧或云是從漢武開西域耗折十萬衆博得善馬數十匹奮軍勢務鏖擊往來誰洗兵赤河水猶赤終棄輪臺地其地於中國失之且何損得之本無益歷計其所得皆不償所失雖下哀痛詔追悔將何及此是萬萬古華夏覆車轍底事夤緣其軌迄李唐競喜邊功好大矜英哲明皇不慮漁陽厄萬里孤軍征碎葉通鑑天寶十年安祿山兼領三鎮是嵗高仙芝及大食戰于怛羅斯城敗績隻輪曽不返得無五情熱暴殄生靈塗草莾忍徇虗名為盛烈君不見世間人心固結是謂帝王真統業君不聞四海內有美談至元天子平江南何曾漂杵與溺驂聖人有金城貴謀賤戰不戰屈人兵白骨甸在唐燭龍軍地有西僧智全者該通漢字云古老相傳白骨甸從漢時有此名結襪子二首并序帝王世紀曰文王伐崇侯虎至五鳯墟襪係解顧左右無可使者乃俯而結之武王至商郊牧野誓衆左仗黃鉞右秉白旄王襪解莫肯與王結王乃釋旄鉞俯而結之漢書王生襪解張釋之跪而結之唐李白結襪子辭大抵言感恩之重而以命相許也郭茂倩編次樂府詩集所序如此燕南壯士吳門豪築中置鉛魚隱刀感君恩重許君命泰山一擲輕鴻毛太白結襪子辭也可謂絶唱然則高漸離專諸之任君子不取詳味題意紬繹史氏感恩許命則太公其人也太公八十孔叢子太公八十而遇文王諸書所載皆不同而遇文王武王十三年史記作十一年牧野之戰太公年近九十時諸侯兵會者車四千乘紂之兵七十萬太公與百夫致師武王馳之紂衆崩畔是其感恩許命之效也故作前結襪子壬子嵗夏聖上在潛僕受再生之恩自上即真西北諸藩弄兵不已因作後結襪子以寫愚懇非敢傳諸作者庶可示之子姪而已前結襪子五鳯聲騰白日光牧野昏荒慘無色精誠一作風雲感激致師人叱吒雷霆覺天窄後結襪子未應一吐一作只明月珠便欲延光萬千一作千萬載請吞梟獍剪鯨鯢直蹴崑崙過西海前突厥三臺􅀈騎生馬射雕兒恰似征西小月氐笑説漢家將野戰得非是我受降時鴈門關北分降地馬邑山南已拜一作拜戰旗盡道漢家無顧籍錦帆終不有回期後突厥三臺陳雲寒壓渭橋低四野驚雷殷鼓􅎏約定引還雲騎去一時爭噴北風嘶突厥凡征戰惡馬噴馬嘶以為將敗之徴貔虎楊威指顧間先聲已碎玉門關向來香火情何在已説元戎逼鐡山婆羅門六首有索賦婆羅門辭者時西北諸王弄邊余方閲西域傳因為賦此回樂峰前沙似雪受降城外月如霜不知何處吹蘆管一夜征人盡望鄉唐婆羅門辭也樂苑曰婆羅門商調曲開元中西涼府節度楊敬述進會要曰天寶十三載改婆羅門為霓裳羽衣熱海氣蒸為喜雨凍城寒結就愁隂中心甚欲期真宰教使人知造物心安西都護境內有熱海去熱海四十里有凍城唐新史同青嶺亘如頺碧落赤河長似浸紅霞是天柱折天傾處龍戰重淵尚攫拿安西都護境內有青嶺與赤河唐新史同雪海迤延窮地界雪山迢遞際天涯但為日月光臨處終一曾偏照一家雪海在安西都護境唐新史同雪山在其東鄙黃草泊圍青草甸白楊河繞緑楊堤依然名是參天道誰使唯聞戰馬嘶北庭都護境內有白楊及黃草泊唐新史同國朝所設驛傳東臨三韓西抵濛汜黃草泊白楊河皆正驛路也弓月山風長似箭燭龍軍火亂如星秪除盡挽天河水可洗兵塵戰地腥北庭都護府有瀚海軍本燭龍軍也府境有弓月城弓月山是謂弓月道出兵路也唐梁建方嘗為弓月道總管黑水且誰為翠水白山原自是氷山得非煙客乘龍火為煽洪爐到世間天山軍在西州交河郡夏絶無雨其熱甚于炎方唐舊史北庭都護府自永嶶至天寶管瀚海天山伊吾三軍天山一名白山以其四時氷雪不消因以名之唐新史北庭都護府境內有黑水及黑水守捉上雲樂金天老文康平居隘神州金丹清真仙相將汗漫遊同流六合棲遲七邱涉歷八表盤桓十洲鵬其化龍其變地軸為之回其運天輪為之平其轉日城為其上陽宮月窟為其清涼殿鸞鷟是家雞狻猊是家犬真樂萬春為局促待把三光更舒展非聖不足知天長將地逺扶桑有時枯濛汜有時竭南山有時摧鈞天有時闋殊度仙曲擬進帝闕九成玄雲六變絳雪五色成文而不亂庶可播振芳聲騰浩劫上天下地微康老畢竟孰能知嵗月玄都仙伯太山老叟延致異鳥名曰希有一翼左覆東王公一翼右覆西王母得人備羽駕故能出入逰造化逍遙巡宇宙感麟鳯在郊藪至道之國常為稱首驟來輒敢戀明時表其老耄知去就擁仙仗携仙友褒拜聖君奉神貺鳯簫在前鼉鼓在後玉笙在左錦瑟在右作天樂獻天授天授樂若鸞自歌鳯自舞焚返魂香頂玉斗健舞起自補天手浩歌發自談天口仍倚鳯臺曲鳯凰和九奏南極老人稱觴北斗挹酌天酒願與九州四海同上千萬嵗夀古今樂録上雲樂有鳯凰曲又有鳯凰臺曲和云真樂萬春太山老叟見容齋五筆載五方老人祝聖夀文門有車馬客烏鵲繞屋鳴有客停征騑問客何自來君家寄家書攝衣起迎客開書多苦辭蕣花不長好玉顔亦易衰水行有却流人行無反期置書拜謝客豈不心懷歸事君有明義不得顧所私作書附客返路逺幸勿遺上言重自愛下言長相思相思勿相怨自古多别離起夜來是處笙歌席一一凝塵埃羞掩合歡帳獨燭夜明苔徙倚步中庭候蟲一何哀滿天秋色裏鴈過黃金臺所願隨清風明月入君懷中心有勞結期以向時開頽想就珍簟還出繞蘭階美人來幾時知人起夜來採荷調并序泛舟方湖見其荷盤布濩露珠凌亂有歌蔡蕭間翡翠盤高走夜光詠蓮樂府催酒遂以荷杯相屬偶憶江從簡採荷調擬賦此樂府廣題曰梁太尉從事中郎江從簡為採荷調曰欲持荷作柱荷弱不勝梁欲持荷作鏡荷暗本無光以刺何敬容敬容時為宰相覽之不覺嗟賞愛其巧麗荷盤承露珠何時成夜光荷蓋承日華何地得清涼雖曰是荷衣且難作霓裳雖曰是荷杯長難酌酒漿欲以荷為鈿不可飾時粧欲以荷為錢不可博明璫擬荷如寶鏡不能照膽知肝腸擬荷如紈扇不能鮮潔如雪霜其莖有輕絲難織錦流黃其氣有微馨難劑水沉香有名無實不足取似是而非良可傷流螢將擬流火烏亦與姬發呈休祥大道曲春風吹繡陌花滿帝鄉樹絲栁裊芳煙細用黃金縷分明須盡是引蕩人心處車馬往來塵儘結成紅霧樓上琵琶聲倚歌臨大路鄭重且一作只休教放得春回去玉華鹽三首并序樂府雜記載隋薛道衡昔昔鹽一首又曰折折鹽唐趙嘏廣昔昔鹽為二十章樂苑以為羽調曲樂府詩集又有無名氏昔昔鹽一首朝野僉載龍朔已來人唱歌名突厥鹽容齋載元怪録籧篠三娘工唱阿鵲鹽又黃帝鹽白鴿鹽神雀鹽滿座鹽歸國鹽唐詩媚賴吳娘唱是鹽更奏新聲刮骨鹽然則歌詩謂之鹽者如吟行曲引之類也因獨醉園對雪作玉華鹽三曲云玉華仙詠玉華鹽愛玉華鹽分外甜但是梨花春在處不消重設却寒簾梨花春見吉甫詩長恆沽此酒樂天詩青旗沽酒趂梨花時俗號為梨花春吉甫詩中所載非樂天所詠梨花春也玉妃隱映水精簾相與天花舞畫簷玉潔氷清誠可愛不因仍更有人嫌韓昌黎雪詩白帝盛羽衛從以萬玉妃瑞雪香融注玉蟾羡誰家醉捲珠簾風流栁絮因風起只謝娘宜唱是鹽白霫有雪香酒玉蟾盞名見逢原記沐浴子濯纓與濯足應欲任其真沐芳及浴蘭應務潔其身難洗耳中事易洗心上塵世間原自有常是洗心人一作秪當憐洗耳不似洗心人築城曲一行杵後一行錐只是嫌虗恨役遲誰謂築城堅不得堅城豈在隱去聲金椎五言古詩古意黃鵠一作鴻鵠巢高林黿鼉穴深淵且各得栖宿人獨胡不然釋耕於壠上妻子耘其前人笑苦畎畝何以遺子孫聊以一二答不可求備論人皆遺以危我獨遺以安春風吹布袖雲滿鹿門山逰仙絳節擁紅雲鳯吹隨鸞扇遊歷萬華宫轉宴諸仙殿金母願接歡玊真求識靣為我問一作謝時人誰曽是媒援高蹈步天衢真遊不知倦又遇西王母屢會瑶池宴仙傳王母瑶池宴宴蟠桃也前後三千年蟠桃開一遍為我問羣仙幾見春風靣真遊挾飛仙真遊挾飛仙懸居何縹眇琪樹不知秋玊庭長似曉碧落無纎翳天衢淨如掃底許吟真聲仙韶動雲表容與太素域時復隨青鳥朝遊閬風苑夕宴蓬萊島昌城玊蘂花崑墟玊紅草可醉亦可玩堪期後天老問真宰九色夜明珠豈不有光彩終惜暗投人含情欲誰待不惜珊瑚鞭為君策駑駘此意竟何如將何問真宰小垂虹虹光逈回繞似令殊有待延留五色節俄軫九華蓋泰山是􅏀垤黃河細於帶且昔欲誰知遊心在天外村行一篇未第時在大坂作青山護村落暗水通溝渠人行禾黍間漫漫迷所之里社壓新醪擊鮮賽叢祠田父相勞苦雨暘無失時龍骨挂屋敖秋熟可預期行行度岡澗泉石多幽竒微風發清籟好鳥吟高枝此中有佳趣豈無幽人知去住兩不可空吟招隱詩隋堤田家行日月會龍􅔀三農能事休犁杖倚空室霜林臥羸牛十二三年間不如今嵗秋田翁復何事終不信眉頭云以縣官令稅租俱見收赤窮固有命白著非自由又云有飛詔少壯不一留半鑿通濟渠半搆迷藏樓言罷長嘆息涕淚交橫流出門竟無語回首漫夷猶送胡夀卿南歸雲山千萬里馳馹來帝闕君自到和林寓居四踰月客中太寂寞韲鹽事孤潔錦衣歸故里薄官試鹽鐡匹馬送君歸關山正黃葉征鴈聲凄凄悲笳鳴咽咽回首南州道行人愁欲絶龍庭八月初西風吹寒雪之子到甘棠黃菊重陽節信筆作此詩贈子以為别送潤甫行得水字拊節遏行雲浩歌山色裏落絮積晴雪東風吹不起逺道趨鵬程相思若為已攬轡入長煙孤吟送春水送
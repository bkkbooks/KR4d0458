桑乾絢野如花陳組練移圍布陳密谷口吞敵出竒將伺便前拒避賈勇中堅已受戰天兵震天威不異弄雷電先驅遊擊隊勢若風雲變兵有風陳雲陳雕鶚橫秋空奮翼鷙雞犬斯須跆音台籍盡八九終了不會還一箭永安宫大安殿方待凱旋回賜宴惟有孤臣鬢成雪緣底眉頭殊不展智謀士見未然事竊嘆衆皆非所辨參政孟鑄數上書言北方必稱兵胡沙虎必變堪憐當日金源氏誰編良將忠臣傳金源氏實録孟參政鑄無傳添夀榮祿有傳蜀道有難易并序李白作蜀道難以罪嚴武後陸暢感韋臯之遇作蜀道易云蜀道易易於踐平地戊午秋余入蜀漫天嶺阻雨次秋回至此嶺帶雨因二公之作為賦蜀道有難易云有言蜀道難有説蜀道易難於上青天易於踐平地説易有所媚説難有所激君曾不見與前修折𠂻誰秉江山筆我來髙蹈仙人蹤控御遺風縱遊歷連雲氣象霸圖中世俗總號蜀道為連雲棧道險阻形勝限疆域黑龍衝斷萬層山駭浪轟雷恣奔擊攢峰疊嶂冷雲間綿亘倚天駢翠壁飛梁架雲棧勢欲跨南北虹橋絡河漢鳥道挂空碧歷其天險臨其峻極望舒按節陽烏斂一作側翼擬循雲路趨鵬程仰天直上青雲梯躡虛且何異登仙但覺日月行寖低終踰絶險得馳驟驟步媧皇補天石微茫一徑通煙霄攀緣更上蒼龍脊彌旬霖雨秋行潦迷原隰豈不慮蹉跌路岐多墊溺一聞漫天名心寒巳如失况復壅大道與道為通塞無慮千籌將萬計智推力引方行得請設漫天前後論蜀道一言或可畢未應難於上青天飛閣遞連通利走去聲名趨日夜往來何絡繹不應易於踐平地棧蹬缺尋引天荒地老蕭條斷絶人聲迹致令振古豺狼心會不祈天賭一擲自蠶叢且稽代謝幾人一作家恃險會終吉適足笑王公設險以守國在德不在險昭然如白日上青天踐平地始可與之言其道難與易行路之難難於上青天蜀道之難若比行路是平地出處雖然全在人世路不能無險易長途豈可比青天誓鏟漫天作平地送楊子陽南還鞭催瘦馬出龍庭白酒一杯送子行山頭積雪寒皎潔風物凄凄傷别情窮廬冰澌結吟硯行人欲去愁展轉功名入手頭未白世態浮雲幾千變何如有酒且髙歌百歲風光如過電如過電人生幾度春風靣送玄之東風二月吹和林緑楊庭院空深沉整襟危坐罷舜琴時聽百鳥自在吟冷冷流水潄寒玉半天蕭颯松風音呼童為我金波斟悠然一笑忘古今書齋盡日無人到門掩落花春自老裴􅏆杖履夕陽間回首春風又衰草長安逺客來紫宸紅塵滿靣初相親挑燈風雨秋夜永詩成落筆愁鬼神縱橫議論小天下當時誰謂秦無人一朝别我出祁連黑山風雪十月天分襟執手小溪邊何時客牀相對眠他年乘興遊京洛詩酒無寒金谷約送趙敬叔去年見君瀚海東蒼松鬱鬱山重重今日送君之鎮陽寒煙漠漠天蒼蒼休嘆蕭蕭行路難兩袖春風衣錦還二年兩度客天涯離合都無咫尺間一樽白酒羡君侯入手功名正黑頭今年蝗旱民切痛賦稅須知有輕重一生富貴將幾何西風吹破邯鄲夢自愧趨鳯池空有别離詩紅塵無處避擾擾心如醉何時髙隱舊林泉臥看人間等兒戲送人還鎮陽雲黯慘風浩蕩故里風光空想像寒餘三月索貂裘凍崖冰雪三千丈天淡淡路茫茫送君萬里還鎮陽楊花點點山城雪啼鳥一聲春晝長多離别少歌笑功名摧促行人老玉簫吹斷碧雲寒梨花寒食空過了君不見洛陽樓觀今蕪荒梧桐葉落秋風涼寒波寂寂山蒼蒼次韻趙德載大監餞行君不見畢毛召芮強宗周亮天不朽言行功間平歆向漢人望道宗孝恭唐治戎一時入相九才傑白賀胸中五色茸聖朝舉親加東擢封植教誘從元豐蕪臯卑飛華嶽隼鼓車暫屈翔麟驄召還喻蜀監王國三雍入對文清雄昨者臨分勤造請是時暑退火星中公瑾之交似醇酎吉甫之頌如清風博山麝注玉鎮席翠壁雪乳金釡龍小人自分悠悠者禆諶謀野淵明窮急觴髙詠鼓英氣颯然危冠髮上衝端敏髙明必貴逹果信頑鄙根中庸摘阮行呈吕西岡西岡老子古鄭客灑落心胸如一作唐李白或歌或嘯或吟臥一作吟哦散髮披襟坐萬壑清風松下座呼童取得古錦囊月魄囊中暗驚墮制度風流特竒絶韻髙不許俗人别試問先生是何物云是阿咸葬時物英雄無限俱為土如何此物傳今古寥寥千載阿咸志憑誰寫出阿咸意悠然抱此明月腹林下溪邊時一曲十三玉柱秋蟾淨指底松風四絃冷大絃嗚嗚純且雅小絃切切清且徑秋髙千丈寒泉瀑露滴銅盤碎金玉千巖夜雨猿鶴悲半夜西風鬼神哭物竒不肯人間住變作孤鶴上天去長笛續短笛引并序戊午歲秋有自長安特遺余名笛數管短長大小不一余素蓄玉笛因戲作長笛續短笛引為贈長笛短笛有指的清濁有氣亦有質李謨吹笛動長安宇內競推為第一笛聲斷絶續者誰得許雲封繼其迹落梅宛轉折栁聲許雲封説笛有落梅折栁二曲雲封李謨之外孫也不止飛砂將走石石裂雲穿天亦驚吟龍許雲封怨笛雲封煙鎖不可開直至如今吹不得有客手把昭華琯未應曠代無人識什襲天然希世珍尤當秪自私珍惜會須竒寶吐竒聲宋玉笛賦芳林皓簳有竒寶邪穢氣隨聲蕩滌靜尋白雪引流風開元傳信記云余慮遺忘上清之樂故懷玉笛以手指上下尋之馬融長笛賦中取度於白雪緑水擬寫幽情聊自適遂據胡牀弄秋月蕭條萬籟沉凝寂凡奏一疊十二節每發一聲纍九息流韻寥亮入太清嫋嫋餘音遊八極但聞天外鸞鳯鳴豈知海底魚龍泣髙遷亭化為灰燼平陽塢久生荆棘揄揚天下之至音非為俗聾矜結習伶倫嗟味願從事列和悵然尋屈膝武昌老人請易業洞庭老人還自失欲儷清歌妙入神惜無李白生花筆孰知時尚紫雲回屢變新聲延化日天祐行魏創紀勳觀齊崇嘉德樓忍名天祐旌功閣圖寫朱三在上頭戰扼狐我太祖皇帝未始輕出無名之師太祖皇帝伯父錫巴哈汗為女真之所害南伐中原此其辭也前戰扼狐嶺下敵之精鋭盡於是役龍旗天上來神兵落天闕問罪下中原先有扼狐捷勍敵四十萬一何爭勇決衝鋒競突創奮不待成列矢雨注鼓雷疊長兵盡短兵接勢霆擊天柱折聲海振地維絶烈日照雪霜幾何不殄滅若是數百陳然後成帝業信道守文元不易聖統在垂千萬葉敢忘開國緬良難太祖新征戰時節説苑武王伐紂云云武王曰天落兵也五禽言大麥熟簸箕漏麥飯熟即快活提葫蘆沽美酒燒香撥火不如歸去五禽也我愛五禽言味之殊有味不惟由此知物情更是分明見天意大麥熟簸箕漏傷時節感農叟麥飯熟即快活祛顑頷略契濶提葫蘆沽美酒繞溪山占花栁燒香撥火願言康且夀不如歸去莫饒舌只合吞聲牢閉口放鴈詞銜蘆逺避駕鵝聲人間多避海東青冥飛休近雙鳬遊恐因誤引到天明稻梁足網羅輕湖海多洲汀太虛無閡且何慕鸚鵡玉籠籠下生與爾全六翮好去恣騰騰若期寥廓求希有必欲翺翔從大鵬宜審遙弓鳴勿為虛弦驚古來惟有一更嬴司隼聆駕鵝聲其目可擊者即縱海青或失駕鵝必及他禽採蓮曲錦雲承露珠盤冷玉女珮環鳴玉井凝歌聲入天鏡來蘭橈攪碎蓬壺影弄香浮葉一何繁翠蓋霞幢不齊整可是芳心空自苦凌波無夢唯煙景長相思燕子不來花著雨鶯聲巧作煙花主滿庭重疊緑苔斑斜倚欄干臂鸚鵡清渭東流劔閣深不知消息到如今相思前路幾回首一夜月明千里心壺天園歌三十六洞天七十二福地共春長在一壺中儘可浮遊與一作取沈醉乾海子余因六盤之變經西夏信都府過乾海子是夏其地無雨草萎水涸北中凡陂濼皆謂之海子沙蔥焦枯沙蓬乾海子乾枯龍子殫顧非海變桑田日如何一旦無涓滴琴髙控鯉遊何許好探麻姑問消息龍子馬名也紀夢衰草淡煙迷故壘情思迢迢似流水關山目斷鴈聲沉幾曲欄干悶獨倚倚欄還憶早春時軟軟東風綻桃李青春如昨歲云暮大抵人生如寄耳如何攜酒對明月一笑紅塵等白蟻歸來夢蝶惱莊周蝶去悠悠幾千里吟哦猶在月明下詩就清歡未能已舉手欲折桂枝去行入青天廣寒裏松聲行水淙淙山重重前溪後嶺萬蒼松我來秋雨霽夜宿深山中霜寒千里龍蛇怒巖谷蕭條嘯貔虎波濤漾漾生秋寒碧落無雲自飛雨瓏瓏兀兀驚俗聾餘韻飄翛散碧空悠然策杖出門去方知萬壑生清風清歡一夕無今古勾引幽人風雅句那堪更被山頭月團圓挂在青松樹和漢臣秋日海棠魂黯馬嵬西去路當時生被春風誤嫣然猶自帶餘酲貪睡那能慰遲暮難寫花仙舊所思褪香愁雪淡胭脂黃昏庭院瀟瀟雨更是梧桐葉落時大水行屯雲墨色日將暮晦明揮霍雨如注水聲夜半搖匡牀平旦出門吁可畏盤渦溔漾吞邊旁悍流洶湧行中央日中雨復綆縻下溝塍水躍皆渾黃黑風拗怒雷擊地浪頭起立三丈強權丫老木根株拔崚嶒古屋椽桷裂快馬萬蹄迸突而憑陵靈龜百靣澒洞而砯砰鋭兵鏖戰城柵倒猛虎嘷吼崖谷崩旁觀氣奪目力眩瀕流上下俱不寧升髙避害呌舟楫篙工倚柂不敢行寂寥向晚頗衰落斷霞返照回新晴鳥飛不盡天界濶蒼煙淡淡山青青銜杯引滿幸無恙收召魂魄猶屏營往年秋水沈半壁閣門九死得一生今日思之痛方定一見洪波心震驚吾聞山挾河回衝底柱東峽江束盤投灔澦魚龍百怪家其中風濤暴橫無終窮小溪常時清且淺漪漣不動平於板淺津可涉涉可梁一旦沸騰能漭茫傳聞潰渱山裂破黑蛟夜出作竒禍抉崖走石勢力粗十家六七無空廬百年古塜尚漂泊變生倉卒人為魚君不見去年四月不雨至七月澗溪一線皆斷絶川居人昔死於暍山居人今死於溺下田黃塵昔蓬勃髙田白沙今障沒嗚呼災變何其頻勦民之命誰肯任勦民之命誰肯任蒼天蒼天實照臨十四夜月秋風滚地來雲捲河漢淨遙觀東海底飛出黃金鏡雖未十分圓桂魄明且瑩停杯對清輝信筆成新詠殷勤舉酒囑姮娥休阻南樓來夜興夏夜對月斜陽樓閣西風裏暑氣著人難睡起覺來厭暑登東樓月明如晝天如水金波漾漾流無聲中秋月好常人情青天休使浮雲蔽不是中秋月也明謹上尊大人領省壽驅馳半世誰能曉一點丹衷天可表中原不忍萬民疾肯羡蝸蠅利名好桑田晚見白蘋洲天上人間無限秋筆頭橫掃千人軍詞源倒捲銀河流間來髙卧煙霞裏笑看浮生等白蟻髙歌一笑回東風春滿漫山桃與李華堂壽筵張再拜獻壽觴試看南山松柏姿一作樹嵗寒依舊色蒼蒼仰祝尊大人領省壽三首帳前驚報天子來臨車下馬無疑猜攀車引袂呼不起齁齁酣寢聲如雷風雲千載際會秋堂上嚴君正黑頭君王一顧聞天下春滿中原四百州蒼蒼松柏貫四時造物兒童元是私戲綵髙歌獻壽巵壽巵願約乾坤期哭尊大人領省尊大人領省卧疾日忽謂人曰天帝釋新起寶輪請吾為記記已成吾為汝輩誦之誦數過左右無曉書者即忘之又云天上寶剎亦成鐘聲甚佳謂侍疾者曰汝聽此否乎後數日有白雲突出帳中如虹霓然上徹霄漢終日不絶人皆哭曰公行矣尋薨孤兒淚眼空血流一夜不知渾白髮寶燈輪畢新記成夢斷疏鐘吼殘月白雲隱隱入青冥生死悠悠兩長訣人間天上父子情遺憤有身終盡雪瑞井行赤子半入井寧無惻隱心亟走掣其足啼號嗄以喑其親即偕來翕然集四鄰將謂相謝不世恩忿呼恚詰渠何人令我兒聲哭酸辛中心自誓救顛墜孰顧若輩怨且嗔君子謀道不謀身去婦怨最苦人生生别離匆匆輕别幾時歸紫簫吹落燕南月麗澤門開馬似飛雨情不定雲來去老鴈呌雲雲不住琵琶撥盡斷腸聲斷絃聲斷秋風暮

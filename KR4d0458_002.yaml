body:
  text: 雙溪醉隠集卷二元耶律鑄撰樂府凱歌凱樂詞九首并序列聖尤宋食言棄好皇帝命將出師問罪奏㨗獻凱乃作南征㨗等曲云昔我太祖皇帝出師問罪西域辛已嵗夏駐蹕鐡門闗宋主寧宗遣國信使苟夢玉通好乞和太祖皇帝許之敕宣差噶哈䕶送苟夢玉還其國辛卯冬我太祖皇帝南征女真詔睿宗皇帝遣信使綽布干等使宋宋人殺之睿宗皇帝謂諸王大臣曰彼自食言棄好輙害我使今日之事曲直有歸可下令諸軍分攻城堡闗隘由是長驅入漢中此其伐宋之端也寧宗實録第四百六十一都幹苟夢玉銜命使彼宋四朝國史列傳第七十七賈陟傳苟夢玉使北還宋閬州譙慶茂所編蜀邊事畧紹定元年戊子制置使鄭損與所代官四川制置使桂如淵㑹于順慶使以時相所喻和議宻指告之且畀以朝廷所授苟夢玉使北録二冊理宗實録第八十三紹定四年辛卯北使蘇巴爾罕來以假道合兵為辭青野原沔州統制張宣誘蘇巴爾罕殺之理宗日厯第三百九十五十月二十一日沔日州統制張宣誘蘇巴爾罕使曹萬户𠞰殺理宗厯第百五十一寳慶三年丁亥正月十一日辛酉姚翀朝辭進對次奏通好北朝事上曰以我朝與北朝本旡纎隙不必言和只去通好足矣尋食其言敢殺信使孰曲孰直明矣故詳而䟽之南征㨗食言自是是誣天遊鼎魚疑戱洞淵爭信有從天北極目無江表已多年拾遺録瀛洲有洞淵廣千里有魚身長千丈鼓舞戯其中㧞武昌設竒包敵縱蒙衝絶似飄風捲斷蓬填得大江流不得先聲已不見江東戰蕪湖一曰戰丁洲舳艫千里蔽江湖擿挑樓船為騷音掃除先直前鋒三十萬一通嚴皷盡為魚下江東舉國全兵失要衝可無一策抗元戎細推餘百年來事合冊江神拜上公定三呉奮威驍騎下三呉神將飛馳一丈烏視彼衆雖百千萬黍民逰動跨𤣥駒克臨安擬歌陌上行人去猶自傳歌陌上花花解語時應也問即今春色媚誰家坡仙有陌上花其序云逰九仙山聞里中兒歌陌上花父老云呉越王妃每嵗春必歸臨安王以書遺妃曰陌上花開可緩緩歸矣呉人用其語為歌含思宛轉聽之凄然而詞鄙野為易之云陌上花開蝴蝶飛江山猶是昔人非遺民幾度垂垂老逰女還歌緩緩歸陌上山花無數開路人爭㸔翠軿來若為留得堂堂去且更從教緩緩廻江南平横野萬艘金趐艦總戎一冊玉鈴篇長江豈限天南北萬刼坤靈戴一天横野大將軍位次與諸將絶席制勝樂辭燀音闡燿威靈結陣鋒信爭敵愾獻殊功全師保勝清時策元在天聲震蕩中聖統樂辭幸值聖明臨御日更逢文軌混同時聲熏天地神功頌潤色光天統業辭後凱歌詞九首至元丙子冬西北藩王弄邊明年春詔大將征之竒兵一旅竒兵出禁宸略時彈壓定驚塵蕭條萬里無遺冦信道天家又得人沙幕金節煌煌下玉京魚麗三十六屯兵一軍電激穿沙幕萬燧雲繁戰野營時大將北討偏師雲繁敵於大漠集將張良傳諸將皆與上定天下梟將也漢髙紀燕人來致梟騎助漢應劭曰梟健也張勇曰梟勇也若六博之梟也愚意六博得梟者勝故以梟將命篇梟騎雲騰自北征領軍梟將最馳聲横穿外壁風前陣直擣中堅月下營翁科蜂屯蠶簇亂山􅢩螘動鶉居亂草坡露體露形千萬指懇祈天語許降和崲峹畔敵休矜戰騎多紛羅區落遍山坡那知未皷投戈地待閱前徒競倒戈我軍與敵陣於崲峹未皷敵潰投降者什五六馮奉世傳將軍有叛敵之名注曰不敢當敵攻戰為畔敵也崲峹地名在和林西南降王控黄龍戍爭雄地登白龍堆摶戰場竒正相生神算在糞除勍敵獻降王科爾結初若疾雷威似虎復如脫兎速於神想當持節為飛將秪是如今着翅人我軍輕騎取敵輺重于科爾結盖河南地也後周韓果北征敵人憚其勁勇趫㨗號為著翅人露布露布突馳爭逐日雷鞭攙逓闘追風只自向時龍尾道競來雲集萬寧宮燭龍封略誰容限燭龍終將天地入牢籠雲興飈起威名將也好先收第一功遺敵出奔西北大荒唐燭龍軍之邊地也凱樂歌詞曲并序周禮大司樂曰王師大獻則令奏凱樂大司馬曰師有功則凱樂獻于社司馬法曰得意則凱樂凱歌以示喜也崔豹古今注引周禮王大㨗則令凱樂軍大㨗則令凱歌與其所引不同周禮旡凱樂凱歌之别然則豹之辯君臣尊卑之說于理為得不旡所據郭茂倩編次樂府詩集有晉凱歌二首隋凱樂歌辭三首唐凱樂歌辭四首凱歌六首詠其君臣殊勲異績聖上恭行天討北服不庭命將問罪南舉江表國家盛事不可不述擬唐凱歌體敢作凱樂凱歌云征不庭大駕北征也天下英雄入彀中得旡威震折遐衝㑹須六幕氛霾了化日長明照九重取和林恢復皇居也飛天府玉灤春徳水清流復舊痕金大安元年河清上下數百里次年庚午我太祖皇帝經略中原易乾鑿度曰聖人受命瑞應先見於河河水清坤靈圗曰聖人受命瑞必先於河河清之徴太祖皇帝受命之符也徳水見史記唐凱樂歌辭千年徳水清自非電㫁光前烈誰得重霑雨露恩和林城苾伽可汗之故地也嵗乙未聖朝太宗皇帝城此起萬安宫城西北七十里有苾伽可汗宫城遺址城東北七十里有唐明皇開元壬申御製御書闕特勤碑按唐史突厥傳闕特勒骨咄禄可汗之子苾伽可汗之弟也名闕可汗之子弟謂之特勒開元十九年闕特勒卒詔金吾將軍張去逸都官郎中吕向齎璽書使北弔祭并為立碑上自為文别立祠廟刻石為像其像迄今存焉其碑額及碑文特勤皆是殷勤之勤字唐新舊史几書特勤皆作銜勒之勒字誤也諸突厥部之遺俗猶呼其可汗之子弟為特勤勤謹字也則與碑文符矣碑云特勤苾伽可汗之令弟也可汗猶朕之子也唐新舊史並作毗伽可汗勤毖二字當以碑文為正下龍庭戡定北方也翠華一動下龍庭生意還從一氣生樂國得非為夀域聖人須自有金城東漢書燕然銘凌髙闕下鷄鹿經磧鹵絶大漢踰涿邪跨安候乘燕然至龍庭以前後諸傳事跡考之又以出塞三千餘里校之龍庭和林西北地也金蓮川駕還幸所也金蓮川上水雲間營衛清沈探騎閑鎮西虎旅臨青海追北龍驤過黒山子史所載黒山不一北中黒山又多皆非子史中所見者折木䑓弄兵取敗之戰所也辟易天威與勝風一場摧折盡竒鋒西北龍荒三萬里併隨驅策入提封上親擊敗西北弄兵藩王于上都之北地折木䑓之西駐蹕山駐蹕所也轅門皷角揚邊雪營幕旌旗掣朔風相與河山雄帝宅威稜尤壯受降宮益屯戍詔諸王益戌兵也睿算籌邊勢萬全益屯貔虎在雄邊東連王塞西通海南接金山北到天恤降附優詔存恤降附也一新汗俗浴恩波天地間人感慨多我澤如春民似草聖元天子布陽和著國華西北諸王稱藩繼有平南之㨗也四海承風著國華更旡龍虎龍虎二陣名也漫紛拏際天所覆人問地今日都須是一家後凱歌詞九首詔發諸軍有事於朔方也戰盧朐神策霆聲振九區縱兵雷合戰盧朐競將蔽野衝雲陣只片時間掃地旡區脱雲屯區脱㑹天兵雷動龍趍從北平馳驅日逐飛龍陣夜薄花門偃月營國朝以出征逰獵帳幕之無輕重者皆謂之區脱凡軍一甲一竈亦皆謂之區脱史傳所載區脱即此史記中間棄地各居其邉為甌脱韋昭曰界上屯守處索隠曰纂文云甌脱土穴也又云是地名前漢書漢得甌脱王發人民屯甌脱以備漢晉灼曰甌脱王因邊境以為官蘇武傳區脱捕得生口服虔曰區脱土室北人所作以候漢者也李竒曰北人邊境羅落守衛官也師古曰區輿甌同區脱本非官號北人邊境為候望之室若今之伏宿舍也因其所解不同故備録之以各居其邊及備漢捕生口之説明之是邏遉者之營幕也審矣克夷門蟻擾蜂喧笈騎過皷儳爭自落長河人人闘説空鞍馬不似今畨數最多高闕駢馳追鋭翼摧鋒梟獍窠巢一夜空光射鐡衣寒透徹冷風如箭月如弓我軍掩遺敵于高闕塞境史記趙武靈王築長城白代傍隂山下至髙闕青將六將軍軍出朔方髙闕漢書衛青李息出雲中至高闕後漢祭彤出高闕塞吳棠出朔方高闕則其地也通典高闕唐屬九原郡九原縣西北到受降城八十里唐書今之西城即漢之髙闕塞也北去磧石三百里追鋭摧録皆軍名也戰焉支羽檄交馳召虎賁期門受戰已黄昏信剪鯨鯢知有處山川爭震蕩乾坤馬支山在張掖右軍殄敵二大憝于此霍去病涉狐奴轉戰過燕支山即此也涿邪山皷譟讙山撼涿邪飛龍㢋音侈翼掩螣蛇露營罷繚神鋒弩雲陣猶轟霹靂車我軍敗敵于涿邪余嘗有處月説稡載其畧於此云云南鄰處月之郊和林城唐碑文也未曉處月之為言有問及余者因為之説云云處月之言磧鹵地也史記漢復使因杅將軍公孫敖出西河與強弩都尉路博德㑹涿涂山注音邪前書因杅將軍出西河與強弩都尉㑹涿邪山後書祭彤傳出高闕塞九百餘里得小山妄言以為涿邪山竇憲傳鄧鴻與後諸軍會涿邪山皐林温禺犢王於涿邪山聞漢兵來悉度漠去班固燕然山銘經磧鹵絶大漠踰涿邪涿邪山者其山在涿邪中也涿邪後聲轉為朱邪又聲轉為處月按唐史沙陀處月種也莊宗紀其先本號朱邪後自號沙陀而以朱邪為姓者是也南部新書北人三十軰於大山中見一小兒遂收而遞飬之長求姓衆云人共育得大遂以諸耶為姓朱邪者訛也此説可笑朱邪即涿邪也諸耶二字俱是華言遐荒殊俗隔絶中華焉如華言以為族望處月部居金娑山之陽蒲類海之東皆沙漠磧鹵地也西漢書注薛瓉曰沙土曰漢其説得之即今華夏猶呼沙漢為沙陀突厥諸部遺俗至今亦呼其磧鹵為朱邪豈可謂以諸人為父耶朱邪初曰涿邪後聲轉為朱邪又聲轉為處月今又語訛聲轉為川如天竺初曰身毒後轉為捐毒又轉為天篤篤省文作竺竺又轉為竹音蠕蠕初曰柔然後曰蠕蠕又曰芮芮狄歴訛為敕勒又訛鐡革步摇訛為慕容秃髪訛為吐蕃若此之類不可勝記是皆從其鞮譯及所書之人鄉音輕重緩急而致然爾且諸夏方言尚不能同况中國事記外國語元無本字但取其音聲之近似不可取其訓詁訓者釋所言之理祐者通其指義所記之語既無本字豈有所言之理所通指義者哉云云曹孟徳攻袁紹為發石車紹衆號曰霹靂車螣蛇陣名見後魏書飛龍亦陣名金滿城元取北庭都䕶府府境都鄙有城曰金滿城後漢書云金滿城此其西域之門户也寄重旌分閫外憂順時驅率萬貔貅廻臨金滿城邊日奄奪蒲昌海氣秋金水道旁張虎翼攙風陣直突龍城襲雪山逴夜可遉金水道防秋豈在玉門闗京華横車組練似春花來自天涯與海涯説道掃除祲氛了凱還歌奏到京華德勝樂二首揖讓躋龍厯謳歌適鳯符鑿空十萬里攘地幾千都神斷光宏業天威震八區控弦三百萬自號感恩都騎吹曲辭九首金奏大夏王庭前納欵大秦歸義繼來降舞鸞歌鳯音相和未許天山數帝江大夏國大秦國皆見漢書王庭歸義州見唐書覊縻州府玉音燕巢飛幕負恩私逺近囂然共一辭列聖玉音明在耳敢忘龍道請降時白霞前騎傳聲掩白霞後軍猶未過烏沙勢須貴合為猿臂相制尤當似犬牙白霞在和林西昡靁毳幕雲羅寒露野羽旄星屬昡靁鄉悔將峴望風塵眼不為長觀日月光塞門邏騎紛紛與冠軍逓相窺隙伺攙昏倚曽延敵臨高闕示歛疑兵突塞門受降山望風降附祈為地披露精城示所天若非上將龍旗下會是中軍虎帳前自高闕之㨗敵稍稍來附我軍遂屯古受降城山下其土俗曰拂雲堆者此也由是知其非漢公孫敖所築受降城是唐張仁愿所築三受降城中之受降城也因以受降名其山即述其事云鳯林闗祇須盡敵廵烏水未可移屯過鳯林切索更虞蜂蠆毒恐還爭縦虎狼心司約留犂可要教撓酒徑路何為更契金事豈出人明算外慕容虚羙漫熏心北中諸國風俗凡大盟約必以金屑和飲其所從來逺矣漢車騎都尉韓昌光禄大夫張猛與呼韓邪單于為盟約呼韓邪單于徑路契金留犂撓酒應劭曰徑路北人寳刀也留犂飯匕也撓和也契金著酒中撓攪飲之顔師古曰契刻撓攪也撓呼高反軍容雖許侯王復正封飬威尤可耀軍容漁陽馬厭銀山草鷄鹿屯營鐡堠峯銀山在北都䕶府境土人今尚有此稱銀山外有大磧曰銀山磧世俗所謂鐡堠者在金山下後騎吹曲詞九首吉語交鋒接矢無虚月按甲休兵定㡬時計日必須聞吉語敢先期獻凱歌辭金山黄花堆上冷雲閒彍騎雷奔去又還說敵自相爭粉潰廻戈霆闘過金山天山曜我皇威下帝䑓靈旗真傃北庭開定應六出竒寒雪瀚海隂風結陣來處月陳兵濶里黄蘆淀轉戰斜車尺遮切白草􅢩飛騎星馳穿處月追亡逐北入沙陀我軍敗敵右部于處月濶里嶺名臨處月黄蘆淀斜車山名在濶里南大漠又去斜車西南數百里獨樂河貝胄星離爭射日蜂旗雲合逈生風雷馳霆擊相紛薄獨樂河邊水草中唐史獨樂河又曰獨邏河不周熊羆此去從無定梟獍當來自不周清一八紘天意在已教剋復了神州遝綈絲長驅席卷盡連營震攝黔雷撼北溟虎豹騎從雲騎隊幾臨西極到殊庭邏逤磨崖金字崐崘頌勒石銀書邏逤銘且述要知方略在聖人不戰屈人兵柔服柔服禺強總四溟神開寳厯見時情夜陪萬國昇平望蹈詠清風播頌聲後畫崔駰傳詠太平之清風古戰城南結陣背南河指顧望城北冠軍申號令謂彼是勍敵今朝一戰在有國與無國但得社稷存此命不足惜風雲為動色士卒為感激竒正遽雷合横衝奮霆擊雌雄勢未决忽忽日將匿以劔指羲和揮戈呼上聲天日天地有情時敢乞饒一擲貔虎張空拳搏戰到昏黒忽焉如海泄聲震裂區域對靣不辨人何許可追襲平明按戰所澗壑盡平積畢賀雪前恥有力于王室拜詔未央宮哀懇辭封邑五湖舊煙景先師有遺跡戰城南自來古戰塲多在長城南少在長城北茫茫白骨甸如何直接黄龍磧或云是從漢武開西域耗折十萬衆博得善馬數十匹奮軍勢務鏖擊徃來誰洗兵赤河水猶赤終棄輪䑓地其地於中國失之且何損得之本無益歴計其所得皆不償所失雖下哀痛詔追悔將何及此是萬萬古華夏覆車轍底事夤縁其軌迄李唐競喜邊功好大矜英哲明皇不慮漁陽厄萬里孤軍征碎葉通鑑天寳十年安禄山兼領三鎮是嵗高仙芝及大食戰于怛羅斯城敗績隻輪曽不返得無五情熱暴殄生靈塗草莾忍徇虗名為盛烈君不見世間人心固結是謂帝王真統業君不聞四海内有羙談至元天子平江南何曾漂杵與溺驂聖人有金城貴謀賤戰不戰屈人兵白骨甸在唐燭龍軍地有西僧智全者該通漢字云古老相傳白骨甸從漢時有此名結襪子二首并序帝王世紀曰文王伐崇侯虎至五鳯墟襪係解顧左右無可使者乃俯而結之武王至商郊牧野誓衆左仗黄鉞右秉白旄王襪解莫肯與王結王乃釋旄鉞俯而結之漢書王生襪解張釋之跪而結之唐李白結襪子辭大抵言感恩之重而以命相許也郭茂倩編次樂府詩集所序如此燕南壯士吳門豪筑中置鉛魚隠刀感君恩重許君命泰山一擲輕鴻毛太白結襪子辭也可謂絶唱然則高漸離專諸之任君子不取詳味題意紬繹史氏感恩許命則太公其人也太公八十孔叢子太公八十而遇文王諸書所載皆不同而遇文王武王十三年史記作十一年牧野之戰太公年近九十時諸侯兵㑹者車四千乘紂之兵七十萬太公與百夫致師武王馳之紂衆崩畔是其感恩許命之效也故作前結襪子壬子嵗夏聖上在潛僕受再生之恩自上即真西北諸藩弄兵不已因作後結襪子以寫愚懇非敢傳諸作者庶可示之子姪而已前結襪子五鳯聲騰白日光牧野昏荒慘無色精誠一作風雲感激致師人叱咤雷霆覺天窄後結襪子未應一吐一作只明月珠便欲延光萬千一作千萬載請吞梟獍剪鯨鯢直蹴崑崙過西海前突厥三䑓􅀈騎生馬射鵰兒恰似征西小月氐笑說漢家將野戰得非是我受降時鴈門闗北分降地馬邑山南已拜一作拜戰旗盡道漢家無顧籍錦㠶終不有廻期後突厥三䑓陣雲寒壓渭橋低四野驚雷殷皷􅎏約定引還雲騎去一時爭噴北風嘶突厥凡征戰惡馬噴馬嘶以為将敗之徴貔虎楊威指顧間先聲已碎玉門闗向來香火情何在已說元戎逼鐡山婆羅門六首有索賦婆羅門辭者時西北諸王弄邊余方閲西域傳因為賦此廻樂峰前沙似雪受降城外月如霜不知何處吹蘆管一夜征人盡望鄉唐婆羅門辭也樂苑曰婆羅門商調曲開元中西凉府節度楊敬述進㑹要曰天寳十三載改婆羅門為霓裳羽衣熱海氣蒸為喜雨凍城寒結就愁隂中心甚欲期真宰教使人知造物心安西都䕶境内有熱海去熱海四十里有凍城唐新史同青嶺亘如頺碧落赤河長似浸紅霞是天柱折天傾處龍戰重淵尚攫拿安西都䕶境内有青嶺與赤河唐新史同雪海迤延窮地界雪山迢逓際天涯但為日月光臨處終一曾偏照一家雪海在安西都䕶境唐新史同雪山在其東鄙黄草泊圍青草甸白楊河繞緑楊堤依然名是叅天道誰使唯聞戰馬嘶北庭都䕶境内有白楊及黄草泊唐新史同國朝所設驛傳東臨三韓西抵濛汜黄草泊白楊河皆正驛路也弓月山風長似箭燭龍軍火亂如星秪除盡挽天河水可洗兵塵戰地腥北庭都䕶府有瀚海軍本燭龍軍也府境有弓月城弓月山是謂弓月道出兵路也唐梁建方嘗為弓月道總管黒水且誰為翠水白山原自是氷山得非煙客乘龍火為煽洪爐到世間天山軍在西州交河郡夏絶無雨其熱甚于炎方唐舊史北庭都䕶府自永嶶至天寳管瀚海天山伊吾三軍天山一名白山以其四時氷雪不消因以名之唐新史北庭都䕶府境内有黒水及黒水守捉上雲樂金天老文康平居隘神州金丹清真仙相將汗漫遊同流六合棲遲七邱涉歴八表盤桓十洲鵬其化龍其變地軸為之回其運天輪為之平其轉日城為其上陽宮月窟為其清凉殿鸞鷟是家鷄狻猊是家犬真樂萬春為局促待把三光更舒展非聖不足知天長將地逺扶桑有時枯濛汜有時竭南山有時摧鈞天有時闋殊度仙曲擬進帝闕九成𤣥雲六變絳雪五色成文而不亂庶可播振芳聲騰浩刼上天下地㣲康老畢竟孰能知嵗月𤣥都仙伯太山老叟延致異鳥名曰希有一翼左覆東王公一翼右覆西王母得人備羽駕故能出入逰造化逍遥廵宇宙感麟鳯在郊藪至道之國常為稱首驟來輙敢戀明時表其老耄知去就擁仙仗携仙友褒拜聖君奉神貺鳯簫在前鼉皷在後玉笙在左錦瑟在右作天樂獻天授天授樂若鸞自歌鳯自舞焚返魂香頂玉斗健舞起自補天手浩歌發自談天口仍倚鳯臺曲鳯凰和九奏南極老人稱觴北斗挹酌天酒願與九州四海同上千萬嵗夀古今樂録上雲樂有鳯凰曲又有鳯凰臺曲和云真樂萬春太山老叟見容齋五筆載五方老人祝聖夀文門有車馬客烏鵲遶屋鳴有客停征騑問客何自來君家寄家書攝衣起迎客開書多苦辭蕣花不長好玉顔亦易衰水行有却流人行無反期置書拜謝客豈不心懐歸事君有明義不得顧所私作書附客返路逺幸勿遺上言重自愛下言長相思相思勿相怨自古多别離起夜來是處笙歌席一一凝塵埃羞掩合歡帳獨燭夜明苔徙倚歩中庭候蟲一何哀滿天秋色裏鴈過黄金臺所願隨清風明月入君懷中心有勞結期以向時開頽想就珍簟還出繞蘭階羙人來幾時知人起夜來採荷調并序汎舟方湖見其荷盤布濩露珠凌亂有歌蔡蕭閒翡翠盤高走夜光詠蓮樂府催酒遂以荷盃相屬偶憶江從簡採荷調擬賦此樂府廣題曰梁太尉從事中郎江從簡為採荷調曰欲持荷作柱荷弱不勝梁欲持荷作鏡荷暗本無光以刺何敬容敬容時為宰相覧之不覺嗟賞愛其巧麗荷盤承露珠何時成夜光荷盖承日華何地得清凉雖曰是荷衣且難作霓裳雖曰是荷杯長難酌酒漿欲以荷為鈿不可飾時粧欲以荷為錢不可博明璫擬荷如寳鏡不能照膽知肝腸擬荷如紈扇不能鮮潔如雪霜其莖有輕絲難織錦流黄其氣有微馨難劑水沉香有名無實不足取似是而非良可傷流螢將擬流火烏亦與姬發呈休祥大道曲春風吹綉陌花滿帝鄉樹絲栁裊芳煙細用黄金縷分明湏盡是引蕩人心處車馬徃來塵儘結成紅霧樓上琵琶聲倚歌臨大路鄭重且一作只休教放得春廻去玉華鹽三首并序樂府雜記載隋薛道衡昔昔鹽一首又曰折折鹽唐趙嘏廣昔昔鹽為二十章樂苑以為羽調曲樂府詩集又有無名氏昔昔鹽一首朝野僉載龍朔已來人唱歌名突厥鹽容齋載元怪録籧篠三娘工唱阿鵲鹽又黄帝鹽白鴿鹽神雀鹽滿座鹽歸國鹽唐詩媚頼呉娘唱是鹽更奏新聲刮骨鹽然則歌詩謂之鹽者如吟行曲引之類也因獨醉園對雪作玉華鹽三曲云玉華仙詠玉華鹽愛玉華鹽分外甜但是梨花春在處不消重設却寒簾梨花春見吉甫詩長恒沽此酒樂天詩青旗沽酒趂梨花時俗號為梨花春吉甫詩中所載非樂天所詠梨花春也玉妃隠映水精簾相與天花舞畫簷玉潔氷清誠可愛不因仍更有人嫌韓昌黎雪詩白帝盛羽衛從以萬玉妃瑞雪香融注玉蟾羨誰家醉捲珠簾風流栁絮因風起只謝娘宜唱是鹽白霫有雪香酒玉蟾盞名見逢原記沐浴子濯纓與濯足應欲任其真沐芳及浴蘭應務潔其身難洗耳中事易洗心上塵世間原自有常是洗心人一作秪當憐洗耳不似洗心人築城曲一行杵後一行錐只是嫌虗恨役遲誰謂築城堅不得堅城豈在隠去聲金椎五言古詩古意黄鵠一作鴻鵠巢高林黿鼉穴深淵且各得栖宿人獨胡不然釋耕於壠上妻子耘其前人笑苦畎畮何以遺子孫聊以一二答不可求備論人皆遺以危我獨遺以安春風吹布䄂雲滿鹿門山逰僊絳節擁紅雲鳯吹隨鸞扇遊歴萬華宫轉宴諸仙殿金母願接懽玊真求識靣為我問一作謝時人誰曽是媒援高蹈歩天衢真遊不知倦又遇西王母屢㑹瑶池宴僊傳王母瑶池宴宴蟠桃也前後三千年蟠桃開一遍為我問羣仙㡬見春風靣真游挾飛僊真游挾飛仙懸居何縹緲琪樹不知秋玊庭長似曉碧落無纎翳天衢凈如掃底許吟真聲仙韶動雲表容與太素域時復隨青鳥朝遊閬風苑夕宴蓬萊島昌城玊蘂花崑墟玊紅草可醉亦可玩堪期後天老問真宰九色夜明珠豈不有光彩終惜暗投人含情欲誰待不惜珊瑚鞭為君策駑駘此意竟何如將何問真宰小垂虹虹光逈回遶似令殊有待延留五色節俄軫九華葢泰山是􅏀垤黄河細於帶且昔欲誰知遊心在天外村行一篇未第時在大坂作青山護村落暗水通溝渠人行禾黍間漫漫迷所之里社壓新醪擊鮮賽叢祠田父相勞苦雨暘無失時龍骨掛屋敖秋熟可預期行行度崗澗泉石多幽竒微風發清籟好鳥吟高枝此中有佳趣豈無幽人知去住兩不可空吟招隠詩隋堤田家行日月㑹龍􅔀三農能事休犁杖倚空室霜林臥羸牛十二三年間不如今嵗秋田翁復何事終不信眉頭云以縣官令税租俱見收赤窮固有命白著非自由又云有飛詔少壯不一留半鑿通濟渠半搆迷藏樓言罷長嘆息涕淚交横流出門竟無語回首漫夷猶送胡夀卿南歸雲山千萬里馳馹來帝闕君自到和林寓居四踰月客中太寂寞韲鹽事孤潔錦衣歸故里薄官試鹽鐡匹馬送君歸闗山正黄葉征鴈聲凄凄悲笳鳴咽咽回首南州道行人愁欲絶龍庭八月初西風吹寒雪之子到甘棠黄菊重陽節信筆作此詩贈子以為别送潤甫行得水字拊節遏行雲浩歌山色裏落絮積晴雪東風吹不起逺道趨鵬程相思若為已攬轡入長煙孤吟送春水送人還燕然去年來帝闕籬落正黄菊今年還燕然春光明逺目再三挽不留歸心何太速回首落花多滿川紅蔌蔌馳驅萬里程阿誰慰幽獨寂寂寒山行寂寂寒山宿啼鳥㡬聲遲淡煙芳草緑東風千里人明月半軒竹漢苑穴狐兎姑蘓走麋鹿功名半紙薄興亡等棋局可笑百年身黄粱猶未熟不發離别嘆不唱陽闗曲桃李醉逢場夕陽倒船玉對竹引勁節凌雲漢沈沈翠如束春靜𤨏窻深驚風碎寒玊聫聲金鳯凰雙飛夜雙宿寂寞野桐花年年老空谷雲漢一作雲霄沈沈一作森森剪流水莫持金剪刀决絶剪流水莫將尺素書慇懃託雙鯉水豈似人情魚豈知人意魚水自相親肯與人為計同心結湖中已種藕湖邊還種栁栁絲與藕絲同在佳人手除是結同心同心最長久春自來日月雙飛翼天地一遺卵無天地不卑無日月不滿時序相代謝曾不偏寒暖晝夜互乗除曾不有長短因究萬物情凝神舒頓緩斷知春自來何須候灰管西天諸國厯議亦云天地之形如卵對酒漊者漊音縷沈杯杓醇醨同一味狂風偃秋草蘭艾同一悴賢愚不同調賢愚酒見醉鄉日月薰蕕不同氣如何昧去就欲令為一致安得使賢愚各分於一噐安得使薰蕕各生於一地我志誠如斯未審化工意金庭不死鄉金庭不死鄉真境延閒燕璨璨瓊瑶樹朝映朝元殿靈景一何清寂然聞鳯囀但見玊階前游蜂弄花片對月吟擬諸公體獵人設網羅不掛月中兎豈無烹兎意難求登月路月殿兔長生人間㡬今古抱杵影徘徊天狼空自苦樵者勞斧斤不斫月中桂豈無薪桂思難籌攀月計月殿桂長榮人間㡬興廢倚鏡影婆娑天風摇不碎傾影聽人歌揚輝伴人舞何事在華筵分明作賔主蹤蹤各無聊乾坤兩棲旅舉酒夀姮娥向人終不語七言古詩讀新樂府霓裳羽衣曲玉樹後庭花不知相與迷春夢綿厯人間第㡬家苦旱嘆六月亢旱田苗枯自嗟自嘆耕田夫差官咫尺徴秋税今嵗田家一粒無飢民日日望霖雨雨意欲成雲散去天公胡不用老龍年年祇被蛟螭誤觀友人所藏佛牙竺乾大士哀羣靈出示大教㧞幽沈漢明夢兆頗神異具書𣑽譯來千岑翕然風譽聳華夏寳方精像煇雲林傳聞遺骨未灰朽流散諸國磨古今朅来偶得見一齒照坐粲爛如璆琳當時左右廣長舌咀嚼風雷興潮音炯如珠珞吐光􅏜洗我曠刼塵埃襟目瞻頂禮固其事豈必窣堵埋千尋慿君韞匵善持護為絶隂怪窺窬心漆城謡漆城光蕩蕩㓂來不得上一朝變起望夷宮不及思旃曽技癢述實録四十韻修征蜀實録每以二皷為期方息中夜聞笛既覺緬想實録事跡亦如夢寐愴然無以為懷述此寫之承天聖祖開天業四海為家盡臣妾規模宏逺古無比太祖封諸親王封域束盡東海西盡西海自古未有如此規模之宏逺也統緒豈唯垂萬葉朅來海水不揚波向見靈河已清澈金大安元年河清上下數百里次年庚午我太祖皇帝經畧中原易乾鑿度曰聖人受命瑞應先見於河水清河清之徴太祖皇帝受命之符也際天所覆樂心戴愈見人情皆感切折衝猛銳競陳力骨鯁貞良咸就列龔行天罸攘攙槍著處鯨鯢殊前截列聖未出無名師歴世彌光光聖烈推亡固存非一國迷不知時非儁傑世評青野食前言辛已年宋主寧宗遣國信使苟夢玉通好乞和太祖皇帝許之敕宣差噶哈護送還其國辛夘冬太祖皇帝南征女真遣信使綽布干等使宋青野原宋沔州統制張宣誘蘇巴爾罕殺之此其伐宋之端也不若犬偷及鼠竊誣天復敢拘行人後戊戌年七月哩宻什等百人使宋竟拘留不遣妄專狙詐誇明哲國猶攝生貴處順水背流時源易竭即今日削盡疆場其勢得無憂廹脅若然仍不畏天威曷異螳螂怒當轍未知其可將蠻觸相與區區較優劣武皇問罪揮天戈徴發諸軍自崑碣翠華遥下五雲來輙報錦城氛祲滅方入蜀使告雲頂之㨗扈蹕貔貅三十萬爭欲先驅掃妖孽摶熊攫豹㨗飛猱諸將縁蜀道摶熊豹㨗狨猱輪之和林赴險蹈虚矜膽决紛馳傳檄啟途使英簜輔之龍虎節懸崖萬仭入雲端前馬不行應氣攝虹梁縹緲架層霄興利州至三泉縣橋閣共一萬九千三百十八間護險偏欄共四萬七千一百三十四間高興動人殊可悅若非由蜀道登天豈與飛仙得相接飛仙嶺相傳徐佐卿化鶴跧泊之地故名飛仙上有閣道百餘間即入蜀路騰傾湍瀑翻驚濤怒震横流還逆折千巖萬壑殷晴雷捲起千堆萬堆雪飛閣尤非地上行劒門呀似天中裂劒州劍門縣在州東北五十里酈元水經注曰大劒戌至小劒戌三十里飛閣相通謂之閣道壁立千尋冷翠屏碧霞城擁清都闕振衣直上玊女臺下視煙塵望吳越五丁碎徙青黛山萬簇蠺叢一作簇亂堆疊金城雖包裹全蜀勝負莫非由勇怯孰云無所騁驍騎閉口勢何勞捕舌時得宋蠟丸書云云雖驍騎萬羣安所用之天𠂻應未誘蚩萌堪嘆顓䝉與天絶劒門苦竹隘招之不降遂抜之寧知皇化如時雨與濟迷津作舟楫㑹聞蓬閬朝真仙蓬閬等州皆納土降簟食壺漿盡迎謁紛綸諸將無虚日爭奏歸期爭獻㨗旌門勑樹受降旌時旌門外勑樹受降旌凡降者於其下待詔優恤冀致窮民遂安帖莫知天欲將如何英猷一旦為虚設無雷東陊孤山峯御營東山無雷傾圮驚風西捲旗竿折御營西軍風折旗竿龍橋忽焉悉中圮攻釣魚山上下浮橋遽中圯䕫皷􅀢音貼然尋亦歇大駕戰皷初聞數十里之外後雖三數里不聞忍令飛駕鼎湖龍持㧞龍髯堕塵刼列仙傳丁約曰儒謂之世釋謂之刼笛聲喚得夢回來梅梢猶印西窻月宻谷行金崇慶間添壽榮禄領驍果駐京畿為聲援聞聖朝太祖皇帝圍守西京東海遂命添夀將諸路兵八十餘萬號稱百萬援之仍賜手詔曰今悉國力當清北方次宻谷口時太祖皇帝親率大軍先以前騎三千嘗之大軍繼至未皷敵潰全軍覆没命驍銳為聲援選歩騎發畿甸號稱一百萬一一皆精練旌旗虹亂渡桑乾絢野如花陳組練移圍布陣宻谷口吞敵出竒將伺便前拒避賈勇中堅已受戰天兵震天威不異弄雷電先驅遊擊隊勢若風雲變兵有風陣雲陣鵰鶚横秋空奮翼鷙雞犬斯須跆音台籍盡八九終了不會還一箭永安宫大安殿方待凱旋廻賜宴惟有孤臣鬢成雪緣底眉頭殊不展智謀士見未然事竊嘆衆皆非所辯參政孟鑄數上書言北方必稱兵胡沙虎必變堪憐當日金源氏誰編良將忠臣傳金源氏實錄孟參政鑄無傳添夀榮祿有傳蜀道有難易并序李白作蜀道難以罪嚴武後陸暢感韋臯之遇作蜀道易云蜀道易易於踐平地戊午秋余入蜀漫天嶺阻雨次秋廻至此嶺帶雨因二公之作為賦蜀道有難易云有言蜀道難有說蜀道易難於上青天易於踐平地說易有所媚說難有所激君曾不見與前修折𠂻誰秉江山筆我來髙蹈仙人蹤控御遺風縱遊歴連雲氣象霸圖中世俗總號蜀道為連雲棧道險阻形勝限疆域黒龍衝斷萬層山駭浪轟雷恣奔擊攅峰叠嶂冷雲間綿亘倚天駢翠壁飛梁架雲棧勢欲跨南北虹橋絡河漢鳥道掛空碧歴其天險臨其峻極望舒按節陽烏歛一作側翼擬循雲路趨鵬程仰天直上青雲梯躡虚且何異登仙但覺日月行寖低終踰絶險得馳驟驟歩媧皇補天石微茫一逕通烟霄攀緣更上蒼龍脊彌旬霖雨秋行潦迷原隰豈不慮蹉跌路岐多墊溺一聞漫天名心寒巳如失况復壅大道與道為通塞無慮千籌將萬計智推力引方行得請設漫天前後論蜀道一言或可畢未應難於上青天飛閣遞連通利走去聲名趨日夜往來何絡繹不應易於踐平地棧蹬缺尋引天荒地老蕭條斷絶人聲跡致令振古豺狼心會不祈天賭一擲自蠶叢且稽代謝幾人一作家恃險會終吉適足笑王公設險以守國在徳不在險昭然如白日上青天踐平地始可與之言其道難與易行路之難難於上青天蜀道之難若比行路是平地出處雖然全在人世路不能無險易長途豈可比青天誓鏟漫天作平地送楊子陽南還鞭催瘦馬出龍庭白酒一盃送子行山頭積雪寒皎潔風物凄凄傷别情窮廬冰凘結吟硯行人欲去愁展轉功名入手頭未白世態浮雲幾千變何如有酒且髙歌百歲風光如過電如過電人生幾度春風靣送𤣥之東風二月吹和林綠楊庭院空深沉整襟危坐罷舜琴時聽百鳥自在吟冷冷流水潄寒玉半天蕭䬃松風音呼童為我金波斟悠然一笑忘古今書齋盡日無人到門掩落花春自老裵􅏆杖履夕陽閑回首春風又衰草長安逺客來紫宸紅塵滿靣初相親挑燈風雨秋夜永詩成落筆愁鬼神縱横議論小天下當時誰謂秦無人一朝别我出祁連黒山風雪十月天分襟執手小溪邊何時客牀相對眠他年乘興遊京洛詩酒無寒金谷約送趙敬叔去年見君瀚海東蒼松鬰鬰山重重今日送君之鎮陽寒烟漠漠天蒼蒼休嘆蕭蕭行路難兩袖春風衣錦還二年兩度客天涯離合都無咫尺間一樽白酒羡君侯入手功名正黒頭今年蝗旱民切痛賦稅須知有輕重一生富貴將幾何西風吹破邯鄲夣自愧趨鳯池空有别離詩紅塵無處避擾擾心如醉何時髙隠舊林泉臥看人間等兒戱送人還鎮陽雲黯慘風浩蕩故里風光空想像寒餘三月索貂裘凍崖冰雪三千丈天淡淡路茫茫送君萬里還鎮陽楊花㸃㸃山城雪啼鳥一聲春晝長多離别少歌笑功名摧促行人老玉簫吹斷碧雲寒梨花寒食空過了君不見洛陽樓觀今蕪荒梧桐葉落秋風凉寒波寂寂山蒼蒼次韻趙徳載大監餞行君不見畢毛召芮强宗周亮天不朽言行功間平歆向漢人望道宗孝恭唐治戎一時入相九才傑白賀胷中五色茸聖朝舉親加東擢封植教誘從元豐蕪臯卑飛華岳隼鼓車暫屈翔麟驄召還喻蜀監王國三雍入對文清雄昨者臨分勤造請是時暑退火星中公瑾之交似醇酎吉甫之頌如清風博山麝注玉鎮席翠壁雪乳金釡龍小人自分悠悠者禆諶謀野淵明窮急觴髙詠鼓英氣颯然危冠髪上衝端敏髙明必貴逹果信頑鄙根中庸摘阮行呈吕西岡西岡老子古鄭客灑落心胷如一作唐李白或歌或嘯或吟臥一作吟哦散髪披襟坐萬壑清風松下座呼童取得古錦囊月魄嚢中暗驚墮制度風流特竒絶韻髙不許俗人别試問先生是何物云是阿咸葬時物英雄無限俱為土如何此物傳今古寥寥千載阿咸志憑誰寫出阿咸意悠然抱此明月腹林下溪邊時一曲十三玉柱秋蟾淨指底松風四絃冷大絃嗚嗚純且雅小絃切切清且勁秋髙千丈寒泉瀑露滴銅盤碎金玉千巖夜雨猿鶴悲半夜西風鬼神哭物竒不肯人間住變作孤鶴上天去長笛續短笛引并序戊午歲秋有自長安特遺余名笛數管短長大小不一余素蓄玉笛因戱作長笛續短笛引為贈長笛短笛有指的清濁有氣亦有質李謩吹笛動長安㝢内競推為第一笛聲斷絶續者誰得許雲封繼其跡落梅宛轉折栁聲許雲封說笛有落梅折栁二曲雲封李謩之外孫也不止飛砂將走石石裂雲穿天亦驚吟龍許雲封怨笛雲封烟鎻不可開直至如今吹不得有客手把昭華琯未應曠代無人識什襲天然希世珍尤當秪自私珍惜會須竒寳吐竒聲宋玉笛賦芳林皓簳有竒寳邪穢氣隨聲蕩滌靜尋白雪引流風開元傳信記云余慮遺忘上清之樂故懐玉笛以手指上下尋之馬融長笛賦中取度於白雪綠水擬寫幽情聊自適遂據胡牀弄秋月蕭條萬籟沉凝寂凡奏一叠十二節每發一聲累九息流韻寥亮入太清嫋嫋餘音遊八極但聞天外鸞鳯鳴豈知海底魚龍泣髙遷亭化為灰燼平陽塢久生荆棘揄揚天下之至音非為俗聾矜結習伶倫嗟味願從事列和悵然尋屈膝武昌老人請易業洞庭老人還自失欲儷清歌妙入神惜無李白生花筆孰知時尚紫雲廻屢變新聲延化日天祐行魏創紀勲觀齊崇嘉徳樓忍名天祐旌功閣圖寫朱三在上頭戰扼狐我太祖皇帝未始輕出無名之師太祖皇帝伯父錫巴哈汗為女真之所害南伐中原此其辭也前戰扼狐嶺下敵之精銳盡於是役龍旗天上來神兵落天闕問罪下中原先有扼狐㨗勍敵四十萬一何爭勇决衝鋒競突刅奮不待成列矢雨注鼓雷疊長兵盡短兵接勢霆擊天柱折聲海振地維絶烈日照雪霜幾何不殄滅若是數百陣然後成帝業信道守文元不易聖統在垂千萬葉敢忘開國緬良難太祖新征戰時節說苑武王伐紂云云武王曰天落兵也五禽言大麥熟簸箕漏麥飯熟即快活提葫蘆沽美酒燒香撥火不如歸去五禽也我愛五禽言味之殊有味不惟由此知物情更是分明見天意大麥熟簸箕漏傷時節感農叟麥飯熟即快活祛顑頷畧契濶提葫蘆沽美酒遶溪山占花栁燒香撥火願言康且夀不如歸去莫饒舌只合吞聲牢閉口放鴈詞啣蘆逺避駕鵝聲人間多避海東青㝠飛休近雙鳬遊恐因悞引到天明稻梁足網羅輕湖海多洲汀太虚無閡且何慕鸚鵡玉籠籠下生與爾全六翮好去恣騰騰若期寥廓求希有必欲翺翔從大鵬宜審遥弓鳴勿為虚弦驚古來惟有一更嬴司隼聆駕鵝聲其目可擊者即縱海青或失駕鵝必及他禽採蓮曲錦雲承露珠盤冷玉女珮環鳴玉井凝歌聲入天鏡來蘭橈攪碎蓬壺影弄香浮葉一何繁翠蓋霞幢不齊整可是芳心空自苦凌波無夣唯烟景長相思燕子不來花著雨鶯聲巧作烟花主滿庭重疊綠苔斑斜倚欄干臂鸚鵡清渭東流劔閣深不知消息到如今相思前路幾回首一夜月明千里心壺天園歌三十六洞天七十二福地共春長在一壺中儘可浮㳺與一作取沈醉乾海子余因六盤之變經西夏信都府過乾海子是夏其地無雨草萎水涸北中凡陂濼皆謂之海子沙葱焦枯沙蓬乾海子乾枯龍子殫顧非海變桑田日如何一旦無涓滴琴髙控鯉遊何許好探麻姑問消息龍子馬名也紀夣衰草淡烟迷故壘情思迢迢似流水關山目斷鴈聲沉幾曲欄干悶獨倚倚欄還憶早春時軟軟東風綻桃李青春如昨歲云暮大抵人生如寄耳如何攜酒對明月一笑紅塵等白蟻歸來夣蝶惱莊周蝶去悠悠幾千里吟哦猶在月明下詩就清歡未能已舉手欲折桂枝去行入青天廣寒裏松聲行水淙淙山重重前溪後嶺萬蒼松我來秋雨霽夜宿深山中霜寒千里龍蛇怒巖谷蕭條嘯貔虎波濤漾漾生秋寒碧落無雲自飛雨瓏瓏兀兀驚俗聾餘韻飄翛散碧空悠然策杖出門去方知萬壑生清風清歡一夕無今古勾引幽人風雅句那堪更被山頭月團圓掛在青松樹和漢臣秋日海棠魂黯馬嵬西去路當時生被春風誤嫣然猶自帶餘酲貪睡那能慰遲暮難寫花仙舊所思褪香愁雪淡胭脂黄昬庭院瀟瀟雨更是梧桐葉落時大水行屯雲墨色日將暮晦明揮霍雨如注水聲夜半摇匡牀平旦出門吁可畏盤渦溔瀁吞邊旁悍流洶湧行中央日中雨復綆縻下溝塍水躍皆渾黄黒風抝怒雷擊地浪頭起立三丈强权枒老木根株拔崚嶒古屋椽桷裂快馬萬蹄迸突而憑陵靈龜百靣澒洞而砯砰銳兵鏖戰城栅倒猛虎嘷吼崖谷崩旁觀氣奪目力眩瀕流上下俱不寧升髙避害呌舟楫篙工倚柂不敢行寂寥向晚頗衰落斷霞返照回新晴鳥飛不盡天界濶蒼烟淡淡山青青銜盃引滿幸無恙收召魂魄猶屏營往年秋水沈半壁閣門九死得一生今日思之痛方定一見洪波心震驚吾聞山挾河回衝底柱東峽江束盤投灔澦魚龍百怪家其中風濤暴横無終窮小溪常時清且淺漪漣不動平於板淺津可渉渉可梁一旦沸騰能漭茫傳聞潰渱山裂破黒蛟夜出作竒禍抉崖走石勢力粗十家六七無空廬百年古塜尚漂泊變生倉卒人為魚君不見去年四月不雨至七月澗谿一綫皆斷絶川居人昔死於暍山居人今死於溺下田黄塵昔蓬勃髙田白沙今障没嗚呼灾變何其頻勦民之命誰肯任勦民之命誰肯任蒼天蒼天實照臨十四夜月秋風滚地來雲捲河漢淨遥觀東海底飛出黄金鏡雖未十分圓桂魄明且瑩停盃對清輝信筆成新詠慇懃舉酒囑姮娥休阻南樓來夜興夏夜對月斜陽樓閣西風裏暑氣著人難睡起覺來厭暑登東樓月明如晝天如水金波漾漾流無聲中秋月好常人情青天休使浮雲蔽不是中秋月也明謹上尊大人領省壽驅馳半世誰能曉一㸃丹衷天可表中原不忍萬民疾肯羡蝸蠅利名好桑田晚見白蘋洲天上人間無限秋筆頭横掃千人軍詞源倒捲銀河流閒來髙卧烟霞裏笑看浮生等白蟻髙歌一笑迴東風春滿漫山桃與李華堂壽筵張再拜獻壽觴試看南山松栢姿一作樹嵗寒依舊色蒼蒼仰祝尊大人領省壽三首帳前驚報天子來臨車下馬無疑猜攀車引袂呼不起齁齁酣寢聲如雷風雲千載際會秋堂上嚴君正黒頭君王一顧聞天下春滿中原四百州蒼蒼松栢貫四時造物兒童元是私戲綵髙歌獻壽巵壽巵願約乾坤期哭尊大人領省尊大人領省卧疾日忽謂人曰天帝釋新起寳輪請吾為記記已成吾為汝輩誦之誦數過左右無曉書者即忘之又云天上寳刹亦成鐘聲甚佳謂侍疾者曰汝聽此否乎後數日有白雲突出帳中如虹蜺然上徹霄漢終日不絶人皆哭曰公行矣尋薨孤兒淚眼空血流一夜不知渾白髪寳燈輪畢新記成夢斷疎鐘吼殘月白雲隠隠入青㝠生死悠悠兩長訣人間天上父子情遺憤有身終盡雪瑞井行赤子半入井寧無惻隠心亟走掣其足啼號嗄以喑其親即偕來翕然集四鄰將謂相謝不世恩忿呼恚詰渠何人令我兒聲哭酸辛中心自誓救顛墜孰顧若輩怨且嗔君子謀道不謀身去婦怨最苦人生生别離怱怱輕别幾時歸紫簫吹落燕南月麗澤門開馬似飛雨情不定雲來去老鴈呌雲雲不住琵琶撥盡斷腸聲斷絃聲斷秋風暮

body:
  text: 䨇溪醉隠集卷一元耶律鑄撰賦天香臺賦余作此賦㑹姪子輩逓傳諷詠往徃質問其所疑予時有瘯音簇蠡音蓏之疾未間及為酒所困倦於應對因命書史為音注應其所請以示之䨇溪醉隠嘉遯西園而杜私門之請偃蹇棲遲縱適放言惬髙蹈養恬之勝地葆光頥真之靈境緑野斯營素意是逞一花一草親移自植計日成趣唯天香臺牡丹為盛婉若羣仙亂摛雲錦珠樹相鮮瓊枝相映英華外發風標天挺精彩相授逸態横出儼保靈和恩華榮命含情延引流風廻穴流風一作遊風宋玉風賦廻穴錯迕善曰廻穴即風不定貌也競笑應譏幽人逕庭莊子大有逕庭逕音勅定切盖吳人呼勑為剔與他定切同李云逕庭激過也國色天香獨占韶光澄心定氣延視廹察知其不妄進號貴客名為花王十客圖以牡丹為貴客維此姚黄洛陽花木記口姚黄千葉黄花也色極鮮潔精彩射人有深紫檀心近瓶有青旋一匝與瓶同也開頭可八九寸許甚有髙潔之性道山居士録曰近心葉細無蘂亦有淺檀肥盛時中心有緑葉三靣而踰寸謂之緑蝴蝶穆穆皇皇臺𨽻衆芳真其王也錢思公嘗曰人謂牡丹花王今以姚黄真王也魏紫乃后也故有姚王魏后之號見花譜又曰洛人以姚花為王魏花為后誠善評也應道無私應化無方知隠知顯知變知常異人録曰牡丹變易千種遲留煙景䕃樾昭陽吸風飲露雲卧霓裳魏后延佇魏后見上註醉妃小立醉妃紅見海山記欲與相扶倚風無力凝笑為容争妍取媚醒酒香艶懶晴天氣翠袂揚祂弋示切柔玉鏤刻玉鏤碧見花木記仙衣戍削縷金絲織金絲緋見麗珍牡丹品昭著風流分外旖旎臭味幽逺容止閑麗素女掩嫮音䕶不足程式蘭香失氣緑華無色脱落塵凡泮奐姱邁表景異致揄揚勝概靈貺彌彰運鍾盛代誕膺王者之稱良有后妃之配英竒特秀望塞華域姿色俱絶勢傾人國靡曼則如此光大則如彼不以純懿盡在于已承天賜之優華天賜紫見緫叙牡丹譜騰芳聲于勝日擅天外之竒名天外黄見海山記豈花中為第一尤姿英艶道潤金璧姿有餘妍艶有餘美氣不可奪操不可易名有餘香風有餘味炎而不附寒而不棄逺之不怨親之不比動無所趨静無所避色無所沮心無所覬繇無慮而無營故無愠而無喜守所抱之天真任自然之榮悴信靈根之有託冠四時而為最靈根紅見麗珍牡丹品燕南牡丹期在穀兩前後北地髙寒常開在夏日又有秋日牡丹冬日牡丹宜其奕葉扶踈宜其名華盛大積于中者必形諸外承休之徴于是乎在於穆令聞曽是不已得無令人渇見風彩有絶其倫有㧞其萃唯道是從惟神是契不因物而顯不附物而起何玉立而不羣何中立而不倚偉英靈之間氣呈盛世之上瑞牡丹有瑞雲瑞露之名感鍾美于所天多化工之為地千葩萬卉雲屯霧積子智切煙披雨沭擁階抱砌如屏氣動色駢肩疊跡於朝㑹者尤知花王之榮貴倚扇成隂倚扇孫氏瑞應圖曰瑞草也一名箑脯王者孝徳至則生枝多葉少根如丝綸而生風主驅殺蟲蠧地錦交展地錦花名見花木記天幕旁垂雲帷髙卷御袍浮動御袍黄牡丹見洛陽花木記千葉黄花也色與間頭大率類女真黄異香冶艶異香牡丹見王十朋集婆律膏薰薔薇露染惜春情態惜春紅見麗珍牡丹譜戀春風致戀春見緫叙牡丹譜花雨漫天金蓮布地比中金蓮毎至夏日特盛姿艶殊絶未見其匹金章廟常宴泰和宫夏日牡丹顧謂元妃李氏曰牡丹誠獨冠花品以金蓮羅列其下尤風流可愛可謂潘妃歩歩生金蓮玉妃綽約玉妃見麗珍牡丹品玉肌丰膩玉肌紅見緫叙牡丹品仙標閒整風骨秀異翠圍粉陣櫛比鱗集五色相宣黄花白花紅花及墨紫深碧是謂五色墨紫見六一居士花釋其色如墨紫類要衍義曰有深碧牡丹又廣記云韓湘聚土舉盆有碧牡丹二朶後為金稜碧色芳藹相襲玉澤堪掬秀色可吸撦充冶切冶芳煙頽然如醉呈露優柔温潤綺靡春睡猶濃東風扶起錦被絢爛錦被花又有五色錦被見花木記繡帯葳㽔繡帯花名見花木記縈結同心同心梅名又有同心李延締連理孫氏瑞應圖曰王者徳化洽八方合為一家則木連理又曰王者不失民心則木連理辟芍藥為近侍直海棠為慶㑹西征記蜀一中近牡丹多栽海棠謂之君臣慶㑹仙人醉露以頽玉今人以杏核中復有杏者為仙人杏述異記曰天台有杏花六出五色號仙人杏洛陽伽藍記有仙人棗玉女吟風而摇佩爾雅䟽云玉女海棠也公嘗易玉團春名為玉女花玉溪生牡丹詩垂手亂翻雕玉佩翠展莎茵錦圍花障槐盖傾偃天香臺前有槐俗謂槐柵者公嘗謂其不雅故目謂槐盖林幄閑敞長樂維宫長樂花名唐蘇題有長樂花賦合歡維帳花譜有合歡桃一朶二色又有合歡柑唐明皇有與羣臣分合歡柑圖楊妃外傳蓬萊宫有合歡橘徑植忘憂天香臺天香亭三徑皆植忘憂花卉古今注曰欲蠲人之憂則贈以丹棘丹棘一名忘憂即萱革也榮延交讓榮屋榮也大魏諸州記曰交讓樹名也兩兩相對嵗更互枮互生不俱盛俱枮合昏儆夜周處風土記曰合昏槿也葉晨舒昏合本草合昏葉似皁莢槐陳蔵噐云即夜合也日華子云合昏又曰合歡蓂莢典厯通厯云帝堯觀蓂莢以知旬朔一召厯莢随月盈虚依厯開落平露臨政孫氏瑞應圖曰平露者如盖王者政平則生東方政不平則西低西方政不平則東低他方亦然白虎通曰平露者樹名也屈軼司直田俅子曰黄帝時有草生於帝階若佞人入朝則草屈而指之故曰屈軼帝休光耀山海經曰帝休木名本草云主不愁帯之愁自銷也帝屋煥爛山海經曰帝屋木名可以禦凶赫奕君子廣志曰君子樹名也清名無患纂文曰無患樹名也崔豹古今注曰此木為衆鬼所畏取此木為噐可厭却邪魅故曰無患炳若丹青晬然玉潔足佐花王潤色盛烈期所望于重華重華見花木記可流芳于萬葉萬葉見花木記延羣英之風概耀榮名于圖牒有百花朝王圖中績姚魏次績諸品牡丹外繢以百花朝之青松森挺大臣介然而廷立翠竹旁羅毅士肅然而就列池蓮澹澹翛然乎無塵君子居也籬菊亭亭兀然乎寄傲隠逸位也無塵寄傲天香臺下二軒名珍叢琦薄祥花瑞草一本作果深圍逺遶端竦低黙者百執事之謂也若仰若俛如揖如伏者尊其王之義也䇿其芳名委其藻質内向光塵猶葵傾日靈雨均霑惠風同被含秀敷榮榮懐天徳天徳紅見緫叙牡丹譜寳閣煇煌寳閣紅見洛陽花木記千葉紅花也錦屏斐亹錦屏紅見道山居士録出夀安錦屏山色粉紅二層葉中心者極細而長有檀瑞玉樓臺瑞玉紅見麗珍牡丹品有玉樓子牡丹重臺牡丹亦曰玉山紅樓子夐間金碧間金見洛陽花木記千葉紅花也色微帯紫而類金繋腰開頭八九寸許葉問有蘂碧牡丹有數品綺紛品彚區别列第霞駮雲蔚繡錯萬計異人録宋單文字仲儒有種藝術上皇召至驪山令植牡丹萬本色様各不同内人呼為花師又呼曰花人炫玊亰之春色玊亰春見青州牡丹品粉紅花有托盤亦曰兩亰紅夸兩亰之神麗兩亰紅見洛陽花木記多葉紅花也聨玉葉以延春緫叙牡丹譜有玊葉萬夀春牡丹直直吏切㑹聖之盛際㑹聖紅見花木記其餘諸花無比其大者章眀花界照映塵刼選王簡栖頭陀寺碑功濟塵刼注云刼猶世也續仙傳丁約曰儒謂之世釋謂之刼也深根寜極無為之業光寵妍時選司馬子長報任少卿書云以為宗族交遊光寵注光美寵盛也春心固結良怯年芳輕易衰歇我振我䇿我歩一作曵我屧朝祛暮逐無情蜂蝶終然殊患本弱者其枝必披上聲末大者其幹必折審其本之弱者薙音替又音雉除草也其草萊盡其蟲蠧牡丹譜蠧蟲捐之必尋其宂以硫黄針之其傍又有小穴如針孔乃蠧所藏處花工謂之窓以大針㸃硫黄末針之蠧即無矣花復繁盛擇其瓦礫易其壤土圖經曰圃人欲其花之詭異培以壤土至春盛開其狀百變醫之治平聲之調之䕶之扶之持之正之直之培而養之使自滋之洛陽花木記甘草黄千葉黄花也其花初出時為單葉因培養之盛變而為千葉廕而遂之使自榮之花譜牡丹性極喜隂凉顧其末之大者去其邪枝㓢音洛其錯節除其狂花翦其亂葉牡丹續譜大率痛打剥即花好推之移之規之繩之背者向之屈者信之擘而分之花譜曰白露前分擘牡丹使自存之列而封之使自保之牡丹記曰初植牡丹澆畢則以細土封壅其根謂之保澤固本為强其幹而弱其枝俾隆其本而殺其末之為者也扶質立幹本道根真花眀葉秀眼界一新客有訪醉隠於天香亭者不覺愕然而嘆曰向之蕪穢曷其治也覩乎殊制甲天下可也醉隠曰向之乖盭使然也重其花者歐陽文忠公花品序牡丹而出洛陽者今為天下第一洛人唯直名白花其意謂天下之真花不假曰牡丹而自可知也其愛重之如此非其業也耘植非時灌揷要術云揷也無度賣知自是忌能懐妬苟一矯衆枉不渉叢脞阿謗横議雜然應和眀其㡬務執以不可謂彼非出於我或僅有所采㣲有所挫争引其功相推其過思求其治焉可致也余承其弊特任其責推心于物旁搜逺索索彼得失洞研究覈從其可從革其可革絀諸荒惑探諸幽頥舉諸眀筭運諸成䇿辨乎根蕟根蕟見白氏長慶集童䝉訓邵康節因言洛中牡丹之盛曰洛人以根蕟而知花之髙下者知花之上也定乎名色甄其瑰竒甄古然切鄭𤣥尚書緯注曰甄表也亷其瑕謫貤以殿最麗珍花品序花以優劣為殿最馳以豉切物次第也品以資格煦以陽和沃以膏澤窮精極智馳神運思孜孜夙夜不落吾事粗有是治無足齒也然天下之事曷嘗有異於是耶九土一臺也六合一園也百花一王萬國一君為國之道在布此花之政也平露臨政屈軼司直之謂也經國之要實理此花之任也疆其幹而弱其枝隆其本而殺其末之謂也緒言未既客茫然進曰㫖哉言乎㫖哉言乎願以所聞書諸信史刻諸金石以夀其傳終古不忒天香亭頌第紀風聲未勒磨崖䝉何以寜用是遂决敢獻其銘銘曰薄構其亭于彼露座桃李無言燕雀相賀天香亭賦伊牡丹之王百花也聲華輝赫令姿煌煌大塊流其形柔祗播其芳以福勝之徴致霱雲之祥福勝紅見陳州牡丹品千葉深粉紅色霱雲見麗珍牡丹品如霱雲之狀外赤内黄臨仁夀之域介温柔之鄉仁夀黄温柔紫並見麗珍牡丹品天標粹美玊色洋洋玊色牡丹見花木後記瑞氣薰蒸承露華房承露白見總叙牡丹品猶澡身浴徳以薦馨香芬烈天香榮耀靈光觀時之光利用賔于花王出竒丰度孰究其詳第而崇號婉而成章絶品姚黄絶品姚黄見陳州牡丹品千葉尺面大青瓶紫檀心而韻勝土人推為絶品非今姚黄也又有古姚黄見後注語殊勝姚黄勝姚黄見洛陽花木記千葉深紫檀心開頭可八九寸許深于姚黄英逸之資固未可量正色處中不易其方漠然而神全然而真示心忘情物莫之嬰辟鷄雍與豕零而幸疾之僥名雖時為其帝者豈能為之抗衡哉金玉其相秀出羣芳特傾心其奚待為殿春之餘光獨醉道者逰心聖域隠跡懼塲有惜花痼疾姚魏膏肓愛其嫵媚展盡底藴于眀時尚其氣節榮聞日流于帝鄉推其道之有在曾不矜其所長彰真宰之妙用染世界使都香唐人牡丹詩曉檻競開香世界一拂萬字一拂黄見海山記萬字紅見陳州牡丹品千葉淡粉紅心青色瓶宛如萬字殿前禁中殿前紫有托盤禁中紅粉紅花有托盤並見青州牡丹品以道為本造化為功其狀百變圖經曰近世多種牡丹圃人欲其花之詭異秋冬移接培以壤土至春盛開其狀百變其態無窮其化如神其道尤隆亂擎薰炷繁錯瓌叢汎以珠露掃以香風何其貴也玉真淑美玉真見花木記勝玉無瑕勝玉見總叙牡丹譜卓冠時英標特國華進登天府
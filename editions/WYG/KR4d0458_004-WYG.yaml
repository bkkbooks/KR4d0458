body:
  text: 雙溪醉隱集卷四元耶律鑄撰七言律詩寓歷亭人間無地避歊蒸忽覺凉從四座生好在醫無閭上月為臨華不注邊城千年遼鶴三生夢一曲南風萬古情今日濯纓知有處大明湖凈舜泉清予本家遼上後家醫無閭秋日酌蘭臯亭朝来爽氣撲蘭臯竊喜西山𨽻我曹孤奮自甘棲澹泊五噫寜苦遂清高逆知江上鱸魚鱠未抵罇前紫蟹螯誰似無何狂醉隱痛延杯勺詠離騷晉葵洪有孤奮論侯家探春人喜報来頻春色看㸔滿玊津紅杏雨踈朱臉嫩緑楊煙冷黛眉顰鳳凰簫咽歌聲轉鸚鵡杯深酒味醇應是雙溪新領要園林良是主人新松聲數間茅屋起雲峯明月天髙睡正濃乍覺夜傾千丈雨不知風度一山松人間拍岸驚秋浪海底喧天怒老龍洗盡生平塵垢慮浩然爽氣溢心胷蒼蒼欝欝本無情何處風来吹有聲四面迅雷平地起九江湍浪一時傾闗山夜靜蛟龍吼河漢秋髙鸞鳳鳴風定松閒無箇事喧天動地可来驚幽人耳凈聆錚錚一夕西風夢裏驚非玊非金非革木似琴似阮似秦箏夜閒拍枕三更雨秋冷喧天萬竈兵孤坐茅簷對明月一聲聲是自然聲巖聲何事韻錚錚風入寒梢鳥自驚七嶺行宫地名夜寒篩漢月九霄霜冷奏秦箏歸心喚起陶元亮醉耳還醒阮歩兵擬賦新詩慵把筆劃然長嘯兩三聲春梅一夕西風糁玊塵曉来䇿蹇到江濵枝頭金蕾安排破雪裏氷姿凖偹春倚竹欲形閒態度臨岐微露舊精神此花底事年来早有意調羮近紫宸梅魂得香字憶昔西湖雪霽芳轉頭瀟洒壽陽粧角中吹散含新怨夢裏飛来帶舊香堪恨月樓三弄曲漫勞詩客九廽腸徘徊目斷江邊使為問春光底處蔵玊骨消沈一夢長羅浮山下幾昏黄祗須怨笛招遺韻一作新恨枉託風媒返舊香滄海樓臺渾縹緲紫陽宫闕更微茫寳猊只篆灰心字誰伴同心與倩娘滄海樓臺見明皇令方士跨海見玊妃太眞院事紫陽宫闕見漢武致李夫人事有梅魂心字香同心梅名謹和尊大人領省雷字韻乾坤昨夜凈氛埃春到南軒一樹梅驛使浮沉芳信斷東君委曲蠟封開竹篩凉月牕前雪風送寒濤枕上雷清入夢魂眠不得劃然長嘯出門来獨醉園梅數年無花今歲特盛中觴有索賦梅詞者為賦世外佳人幼婦辭袁豐之甞謂梅曰氷姿玊骨世外佳人愛春移入背隂枝鼙婆進奏玊連𤨏雲子勸延金屈巵世事儘他無定論醉懷元自有開時由来蕚緑花心在擬倩梅仙遣所思有緑蕚梅好事者比之仙人蕚緑華汴梁艮嶽有蕚緑華堂其下専植此本和人落梅晚来江上斷人腸占斷嚴凝憶獨芳易得飄零驚短笛不勝憔悴褪殘粧月明霜重若為惜塵暗雲埋猶自香擬嫁與春春不管却随流水怨昏黄落梅分得香字􅍋􅍋戍樓三弄角悠悠江使九廻腸一牕夜月空憐影滿地春風自好香憔悴縱無蜂蝶怨風流合有燕鶯忙水邊籬下將誰惜却對騷人怨壽陽擬詠落梅傲雪欺寒獨自芳雪消寒盡老何妨飄零最是堪憐處桃李無情恐妬香夜月有知應懊惱春風何計可商量自從一識東君面贏得林生滿徑霜玊泉新墨并序尊大人領省得江南楊氏子彬受造墨法甚神絶令鑄學造一萬丸其妙即逺過雪堂而蔑視諸家可與李廷珪相先後焉命之曰玊泉新墨故作詩以紀其事云栢液煤揉冷劑香枯膠㸃漆自仙方風生白兎硯名瞳睛瑩電走碧雲牋名鴉背光可笑千金高索價更憐百紙碎裁鋼一作鋩竚情看了人爭道且置三張在一傍一作玩来一足方頭筆莫道張顛酒更狂從渙然覔紙珍重含章承素業價髙樆藻掞皇州秪縁布濩三都賦更欲恢張五鳳樓元銳銘心由白戰陳𤣥研思為㝠搜風流坐上芸窻下落紙雲烟待解憂時余將書獨醉園獨醉亭獨醉道者三賦謹次尊大人領省火絨詩韻并序沙陀舊戍有老榆焉中朽者若蟬翼然附石以鎌鐡撃之即燧尋以馬通燥者穰薪之嘘而可以爨尊大人領省為首倡予從而和之雨撃風摧歲月空卧沙老木暗蔵絨一彎鎌撇手中月幾㸃星飛吻角風放出夜光應有力挽廻春色豈無功燧人勲業今安在惟有眞空用不窮為曹南湖引阮摘賦坐對王郎謂公茂國手手語禪遶盤鳴玊漱流泉千年野鶴穿孤月阮又名月琴見飛鹤穿月因肖其狀萬壑松風入四絃賀老定場將夢斷桐孫傾韻與心傳仲容元是青雲器不短揚雄草太𤣥咏阮㸃鐡成金自有神奪胎無骨示天眞驚蚪昻首出月魄老鶴奮身當桂輪意足聲圓還自問變風變雅更何人應疑一作由来太白司花界長抱琵琶控好春楊妃菊脉脉無言入醉鄉風流猶記在昭陽露晞金掌遺春夢月掛瑶臺怨夜粧不憶千年一作三生傾國艶秪消一縷返魂香無情莫比吳原草更忍罇前舞斷腸芍葯煮披猖二十四風花淑羙豐融殿百華畀付碧蓬頩粉蘂薰裁温馥叠鮮葩無言似笑詩魔惱比韻侔嬌女艶加壯歲逐春心欲謝酥煎靡麗逺泥沙對城南池蓮招曺南湖凌波延佇澹相留應託微波怨未休閒偃露盤如欲語驟傾風盖却囘頭歌珠串脫横塘雨醉玊香凝罨畵樓好在水仙繁㑹處爛張雲錦待仙舟天香臺牡丹牡丹名品數姚黄分外精神分外香氣節得教稱貴客風標元索號花王玊妃醉露足春睡魏后倚風呈曉粧天賜寵榮光價在得無夸麗酒仙鄉牡丹有天賜紫天香臺單葉牡丹率成重葉多葉千葉為賦此紀之雲根元自飬黄芽有靈根紅牡丹標置長春𦙍此花有長春紫牡丹心喜芳時囘上葉眼明今日見重華玉樓疊起連珠樹有玊樓紫牡丹寳閣成層結綺霞有寳閣紅牡丹誰在一天香陣裏得人爭指是仙家唐家牡丹花譜有唐家紅紫牡丹花蕚相輝瑞錦屏有花蕚紫錦屏紅牡丹探春丰度戀春情一作晴有探春戀春牡丹貎同膩玊鏤雕就有玊鏤紅牡丹衣是縷金絲織成有金絲紅牡丹應笑玊華頭髻重有玊華香牡丹愛更金粟臂環清有金粟牡丹又曰簇金温柔誰更鲁傾國有温柔紫牡丹只數楊家姊妹名有楊家紫楊家花牡丹薦福山寺殿前牡丹天女盤中見此花更須宜在竺仙家香名夙著謝靈運標致竟輸楊子華鬭日爛摛丹地錦瑞雲閑襯赤城霞牡丹有鬬日紅瑞雲紅可憐宗正皆芳宴不著歌詩觸處誇輦下歲時記新進士牡丹宴在宗正寺亭子飲獨醉園牡丹下戯題誰伴花王同樂國温柔鄉裏醉鄉侯莫推花酒為閒事難得侯王結勝逰婪尾豈辭延入手招腰可是要纒頭巳將八斗新珠玊買斷春風與帝休題西菴所藏佛牙旃檀奩裏貯靈牙来自中天尊者家瑩色冷侵秋夜月眞光明射晚晴霞本同舍利元無别疑是金剛事有差猶憶廣長舌左右嚼咀風雨震雷車太極宫空翠凝香徹紫微歩虚聲蕩綵雲帷金人承露夜應怪玊女散花春不知别起蟾宫修素月更明龍燭浴朱曦醉来還袖昭華琯待就蒼鸞背上吹戯書太極宫舊碑隂憶乘綺輅命魚車登白空山詣紫虚天籟虚徐生洞府風簫冷徹在樓居九成絳雪無消息三變𤣥雲就掃除唯記清寧年月日五雲閣吏少霞書蔡少霞夢書蒼龍溪新宫碑銘其末題云清寧二百三十一年四月十二日建五雲閣吏蔡少霞書登玊皇閣周覧燕都偶而成書勢傾幽谷控扶桑琪樹霓旌照八荒一種世間豪俠窟九重天上利名場翠簾籠日縱金鳳清蹕掲雲朝玊皇何事未祈心事了更休頽思媿平章遊仙六銖仙帔映花朝䕶蹕痴龍膽氣驕五色雲車廻日馭九葩芝蓋抵星橋閒携鳳女批明月還縱鸞歌透紫霄半夜水精宫殿裏碧桃花下更聞簫琳宫月夜宴集紅雪香團露井桃彩雲輕葉擁霓旄三千玊女霞裝薄十二珠樓月燭髙花界不應辭玉液海人休便獻龍膏文章好在通明殿醉墨淋浪鳳錦袍奉答翠華僊伯并序張唐臣等諸公夜祈大僊僊批以詩云玊皇香案晚朝廻小小星壇向夜開一炷信香通鼻觀翠鸞飛背酒仙来或有問予行藏者亦批以詩云春来㸔取百花叢粉白妖紅造化功燕子鶯兒休調舌花殘明日起薰風祈求仙號批以翠華仙伯予平昔聞祈大仙以為兒戯而不之信也是夜更有詩數首并滿江紅詞一闋氣語豪邁篇什可觀後因醮者以為荅龍燭飛光拂羽林珮環聲急蕩踈隂黄金闕浸明河冷白玉樓涵碧霧深雲隔鳯簫春澹澹月依鸞斾夜沉沉的知天必從人願得得親來拜好音題長春宫瑞應鶴詩二首蘂宸華供列仙班靈境清沉白日閒鶴駕競來趨北極嵩呼元不離南山玉皇宫殿紅雲裏金母池臺碧霧間休應是彰皇化處鎮長春色在人寰千年物外還丹使豈不銜珠首重回遽遶空香辭閬苑競隨虚駕到蓬萊宫有蓬萊門仙家得表明時兆夀域元從此日開不是瑶臺無戀處九苞金鳳感將來李隱卿名谷與青城劉翁同舟至蘭溪卿大夫修生者館之道侣贈李詩云李郎渉世似虚舟片㠶來度楚江秋又毘陵家弟季文和此篇云夢蝶豈知真是蝶騎牛何必更尋牛老夫亦慕道者次韻和之記劉李事迹劉本書生工詩竒異飄然塵外也白公枉識郭虚舟劉李飛符祖劍裘興軼壺中身混世氣酣酒裏意横秋運調朱鳯啄白石耕蒔金錢掣牯牛赤子返真摽指妙阿伽陀藥肯言不劉吐丹千百粒示人遭毒藥不能傷害贈坐竿道士并序竿幾五十尺語人曰嵗陪人則不數年可得上天矣其謬如此故作詩以懲之因寄長春李真人說似蓬萊恐更迷劉郎親躡武陵溪梭抛霞綺龍鱗澀輅展虹橋鳯翅齊棊燭縱光然日月宴衣分色剪雲霓桃花零落春風起笑殺王喬醉似泥寄白雲庵趙鍊師郊園日渉應成趣逺謝囂氛思不羣罨畫溪邊扄岫幌碧桃花下列仙村千年徃事隨黄鶴一片閒心伴白雲縱倚鳯書徵不起可無芳信寄王孫留題大防山孔水唐胡詹記大厯寺孔水云或有人浮輕舟探邃穴入澒洞莫究其源但有仙鼠晝飛頳鱗時見又遼夀昌五年飛㝠子鮮于鴻作孔水銘其序云按幽州土地記沙門惠珍嘗篝火入穴經五六日方還亦不測其淺深也安知此水不與瑶池潛通桃源相接乎故開元天子每時雨不降必遣使投龍璧於此則休應響答事存諸徃記焉山主如上人言洞有白龍時復出見輙化為魚形狀絶異泰和乙丑冬忽流出桃花花片皆當五錢許至今洞中且有樂音不絶此孔水之大槩也因為書其洞壁云尾閭寒泄碧雲漿誰動霓裳混𣺌茫愜意玉龍深釀雨縱游頳鯉靜歕香穴通瑶水明霞近洞接桃源白日長相得羣仙情味切又抛花片賺劉郎登燕都長松島故基縹緲笙歌拂紫霄水晶宫殿䕃蘭臯勢傾蒼海風雲動秀出中天氣象髙可是浪懸秦照膽不知誰玩漢吹毛流鶯似說傷心一作當時事啼徧宫前野小桃又登瓊華島舊址次吕龍山詩韻不放笙歌半㸃閒紫霞香露怕餘殘水摇千尺地中月人倚九重雲外欄碧落更誰乗彩鳳翠屏空自掩金鑾蓬萊宫闕遺基在忍對秋風子細看紫霞西域琖名九龍谷六龍遺蛻九龍蟠終古蟠龍氣象閒逐鹿得非縁石馬啼鵑應自怨橋山披天一鼎神移去落日孤林鳥自還猶託一作陵下哀湍渾自說悔將春夢到人間惟有六陵兩石馬在太祖陵前發藥兒嶺過永定闗詩地志作藥餌後唐作藥兒山靈應也厭囂埃宛寫幽情篆緑苔望氣莫疑非尹喜附輿須自是韓哀側駢翠壁侵雲起斜抱横流捲地來好在舊時堤畔栁不知青眼盼誰開堤有前朝時栁傷古城次友人韻每愛登臨趂雨晴凉生襟袂晚風清草鋪平野厚䄄緑水引斜陽一線明殘栁斷碑興廢地淡烟啼鳥古今情繁華消盡市朝變花落月明空水聲和人黄龍岡懐古又名黄陵岡首倡作黄龍黄龍不負覆舟飛天意人情儘可知一擲乾坤將目睹兩周甲子是誰推若須要處長生鹿長生鹿首倡中語也可是曽收越影騅遼朝良馬有越影騅睿德神功無藉在土花封合御園碑燕都南御園有金源氏武元皇帝睿徳神功碑燕俗呼為御園碑謹和尊大人領省沙塲懐古兼四娛齋韻小沙塲没鐡衣堆憶昔英雄一窖灰青塚荒凉遺舊怨黒河嗚咽冩餘哀書癡信手翻新曲詩瘦扶頭怯大盃汗漫謫仙逰八表子卿歸後幾人来讀漢書偶成寄李稚川看盡人間傀儡棚不知笑殺老禪僧一作萬事從今一唾輕可憐秦廢漢龍興風雲會合無多日禾黍髙低没五陵紙上功名休理㑹夢中身世儘翻騰從今􅂸取生平醉莫惜王公喚不譍見曹丕受禪碑有感從此建安王氣衰君臣離合可傷悲幾人石上留名日千載世間不毁時過客未知誰氏迹野夫猶道漢家基臨風讀罷一長嘆却是曹丕受禪碑因讀史即書偶成一曲狂歌萬古情惜難將日繋長繩未容狐兎逰秦苑已放牛羊入漢陵夢稳幾曽驚鳥喚酒酣長欲看雲騰莫持心事投明月領取繁花半夜燈題漢武内傳爛燭神光射九霄空香虚駕遶霓旄將臨紫極調金液更入明霞漱玊膏瑶水露寒芳草歇鼎湖煙煖景雲髙可憑誰問秋風客忍委三山與怒濤宫怨脉脉慵拈鳯翼簫沈思陳事自無聊不惟只妬鶯聲巧且是嘗憎燕語嬌照膽光芒殊未歇守宫顔色若為消梅花獨自驚時節肯放春風到栁條哀長安漢家宫闕五雲問不似當時夢一般金殿夜延螢燭暗翠簾風窣月鈎閒笙歌竟逐人消歇樓觀空餘燕徃還斜日亭亭澹無語為誰空下九􅉄山煬帝席上同諸人賦疊皷凝笳宴未闌戰塵回首滿人間南山翠竹長上聲不起東海洪波流已乾寳駕陸沈池館盡錦帆星散水雲閒空餘仁夀宫前草遥接雷塘野樹寒李宻嘗移檄郡縣紀煬帝罪云罄南山之竹書罪無窮决東海之波流惡難盡煬帝行逆於仁夀宫後宇文化及弑煬帝葬於雷塘周室風滿珠簾月殿凉水紋珍簟浪生香翠釵飛燕遶春夢寳鏡舞鸞呈曉粧空自不來行暮雨為誰無語背斜陽含情凝絶凌波路未分蓮花是六郎題楊貴妃遺事玉笛聲沉玊漏長玊環心是夜來香如何更飾金訶子却比無言睡海棠雙鳯撫雲留翠輦九龍休雨去蓮湯千秋萬古嵬坡夢應繞新臺怨夀王漢宫幻出壺天醉碧桃旋開雲竇挹瓊膏龍蟠燭影承香輦鳯擁簫聲繞赭袍織女機臨銀漢動捧盤人共玉蟾髙如何今日猗蘭殿吹盡雄風到野蒿煬帝故宫鳯蹕鳴鑾入暮雲繚墻傾影障苔痕三千歌舞春風起百二山河野日昏石馬不嘶秋自老玉樓無迹燕猶存舊時長送龍舟水空伴寒潮過海門繡嶺宫日射天門綺霧開蘂珠宫闕照蓬萊霓裳動入青㝠去羯皷聲含白雨来六轡玊虬籠劒佩九重花界映樓臺惜無術測一本作揣天公意忍竭恩華養禍胎首句事見張祐集明皇嘗自稱天公見羯皷録次趙虎巖遊香山故宫詩韻徃事驚心話欲休併隨閒望入層樓為龍為虎人誰在鷗去鷗来水自流翠輦影沉天地老紫簫聲斷海山秋長歌一曲西風起手把殘花盡日留遊玊泉紛披容與縱笙歌蕙轉光風艶綺羅露冷桃花春不管月明芳草夜如何靈珠浩蕩隨蘭棹雲錦低回射玊珂深入醉鄉休秉燭盡情揮取魯陽戈桃花事見桃花夫人事洛陽耆舊劉伯夀二侍妾名萱草芳草次張子敬游玊泉詩韻併覺氛埃不更侵水天澄碧自相臨縱遊人在知魚樂浪作詩来羡鳥吟花障靜縁芳徑合香雲濃瑣洞房深從君落筆驚風雨要識春風是此心次趙虎岩過玉泉懐古韻玉泉瀟灑已年深昔日遺蹤尚可尋有意林泉堪作伴無情嵗月任相侵携壺乗興開懐飲策杖閒遊信口吟地僻山空無客過松杉庭户月沉沉宫詞玊輦聲沉不再過錦屏寒影夢如何露花凝夜香珠冷苔徑封春翠靨多怨燭淚乾遺曉月妖蓮心苦起秋波姮娥萬古青天上剰比人間受折魔離宫詞蝶粉蜂黄事已休凝塵空滿玉搔頭海棠酣睡醉無力人栁癡眠閒自愁深掩緑隂籠曉月亂飄紅雨漲春流不知燕子來時節幾度雙飛入畫樓戰三封太宗皇帝馬渡大河睿宗皇帝馬渡漢江與金人大戰於三封之原㑹雪蔽天金人大潰也豁然雪霽月色如晝一襲殆盡因志其事云河漢吞聲自請平冷光横絶見長庚是嵗長庚見數月不滅驟揮戈去日西墜觸折柱來天北傾威控望舒延苦戰勢徵滕六縱疑兵獲澤陽之美嘗謂是日雪之作也惟見旌旗陣馬蔽天而下皆北兵也予怪其言而訪諸他人一如其說若非不世雲龍變一舉誰收萬古名中統庚申聖上北征不庭聞說天兵下八埏自臨華夏益精妍龍拏虎擲三千國岳鎮淵渟五十年應欲昭章新日月更為彈壓舊山川可憐棘霸皆兒戯不似神㣲計萬全侍宴萬安閣和林城萬安宫之閣名也六龍捧日上層霄人海妖氛暗自消五彩鳯聲喧鳥道九光芝色煥蘭苕醼酣兠率黄金殿太宗皇帝嘗號萬安宫為蓮宫吹裂崑崙紫玊簫更覺鈞天佳氣合萬枝華燭動虹橋小獵詩翠華東出萬安宫獵獵旌旗蔽碧空鸚鵡杯停縱金勒鷫鸘裘袒控雕弓塞鴻驚帶鵝毛雪野馬塵飛羊角風萬騎耳邊驚霹靂一聲鳴鏑暮山紅翠華十月獵川中馬上書生目不窮濟濟威儀周制度畨畨人物漢英雄一封雲漢飛金詔萬國君王朝玉宫四合相連幾千里熊羆都入我牢籠寛甸有感和林城有遼碑號和林北河外一舍地為寛甸廣輪可數十百里列聖春夏游幸所也黯傷寛甸舊煙光鋒鏑縱横擾帝鄉昔是翠華臨幸地今為白草戰爭場隂符消息成金匱一作傳金版六韜主將有隂符雄㦸分明勝鐵槍職官分紀有雄㦸將軍鐵鎗謂王鐵槍也從此不應將北極等閒容易許禺强莊子云禺强得之立乎北極賢王有雲南之捷詔出甘泉總六軍渡瀘深入建元勲旌旗蟠地慘遮日金鼓震天寒攪雲鏖戰折衝貔虎陣先聲靡拉犬羊羣中朝詞客椽如筆擬一作已與名王紀所聞獻上賢王神燭髙名一作明日月齊司分蘭艾入春畦虹霓渇飲滄溟竭星斗光垂碧落低寒暑縱催窮塞鴈晨昏寧屬禁城雞無能自忖人堪笑唯有青雲是舊梯近聞賢王春水因寄風掲駕鵞擾緑漪鳴蟬聲促越重圍海東青貼翠雲起照夜白侵瑤水飛玉鷺亂飄梨雪去彩鴛爭絶浪花歸非熊未必當時記依舊烟波遶釣磯大江篇寄上賢王以代謝章兼賀平雲南之捷冷浸乾坤影蕩摇狂瀾萬古自滔滔游風欲動雪還沸淫雨不收天更髙留取蛇珠弄明月乞持虹釣袖神鼇渥洼巳厭江南草何事靈胥有怒濤挽皇太子詞象輅長歸不再朝痛心監撫事徒勞一生盛德乾坤重萬古英名日月髙蘭殿好風誰領畧桂宫愁雨自蕭騷如何龍武樓中月空照丹霞舊佩刀韓省幹子平薦章應格朋友漠然不知忽改京秩作七言近體一首賀之山雌澤啄競騰軒孰有昻駒局短轅造物至公殊弗置窮交未喻枉焦煎鳳批一諾膺天陟馬頸三鞶朝日邊虎鼠獰尫隨秉筆銓曹常格勿從旃

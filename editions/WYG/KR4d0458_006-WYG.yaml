body:
  text: 雙溪醉隱集卷六元耶律鑄撰七言絶句嘲蝶莫疑莊喜知為夢且恐韓憑有化身􅵊音情取一生花裏活未宜隨定賣花人一生隨定今人名也邵氏曰姓書無一氏今江南彭澤有之當是姓乚訛為一也立秋前一日蠅大火西流暑氣迴青蠅心緒已徘徊人言明日新消息天外秋風刮地來蛙吹樂府集曰鐃吹鼓吹也古今註曰横吹通謂之鼓吹余清泠泉聞蛙因以蛙吹名之兩部難分曲調名莫疑喧聒是蛙鳴誰能碧草清泉上受用儀同鼓吹聲齊張狗兒拜儀同日口自作鼔吹聲覽鏡月讓清光日讓圓翠鸞伏背浸瓊筵明為富貴自來逼誰不更教長少年聽苗君彈琴一溪流水潄成冰六馬嘘天四座傾未是幽情堪動處試聽徽外兩三聲聽琵琶二首驚沙摵摵葉紛紛不覺清霜滿鬂根寒鴈似啼還似説試臨窮髪望烏孫冷風搜雨鴈呼羣㸃㸃鳴鴉入暮雲何事荒寒千萬刼野人甘忍怨昭君漁父歎寸鈎釣鼇良可嘆片網圖龍直絶癡往來江上人無限鼓掌笑君君不知圖一作屠御牀閲大行皇帝所御玉牀時阿王僣儀已著竊有感為賦萬國趨觀上國光先皇臨是御明堂鼎湖龍去無迴日更好教人惜此牀大獵詩二首營表交馳突騎過射聲雲布已星羅詔官㸃檢貔貅數奏比年前百萬多大駕將校獵必同日發使一右一左交周營表而還然後就獵網絡周阹萬里疆幅􅊷都是禁圍塲傳言羽獵争來道有詔唯教静虎狼禁地圍塲自和林南越沙沱皆浚以塹上羅以繩名曰扎什實古之虎落也比歲大獵特詔先殄除虎狼行帳八珍詩往在宜都客有請述行帳八珍之説則此行厨八珍也一曰醍醐二曰沆三曰駞蹏羮四曰駞鹿脣五曰駞乳麋六曰天鵝炙七曰紫玉漿八曰元玉漿醍醐衆珍彈壓倒淳之純切熬甘分教人號老饕饕大名非癡醉事待持杯酒更持螯周禮八珍第一曰淳熬注曰煎醢加於陸稻上沃之以膏曰淳熬時予號四癡子尋又號獨醉道者麆沆麆沆馬酮也漢有挏馬注曰以韋革為夾兠盛馬乳挏治之味酢可飲因以為官又禮樂志大官挏馬酒注曰以馬乳為酒言挏之味酢則不然愈挏治則味愈甘挏逾萬杵香味醇濃甘美謂之麆沆麆沆奄蔡語也國朝因之奄蔡西漢西域傳無音大宛傳宛王昧蔡師古曰蔡千葛切書二百里蔡毛晃韻蔡桑葛切廣韻亦然奄蔡蔡千葛切為是今有其種率皆從事挏馬玉汁温醇體自然宛然靈液潄甘泉要知天乳流膏露天也分甘與酒仙天乳星主降甘露一作要知天駟流膏乳天許分甘與酒仙駞蹏羮康居南鄙伊麗迆西沙磧斥鹵地往往産野駞與今雙峯家駞無異肉極美蹄為羮有自然絶味獨擅千金濟美名夤縁遺味更騰聲不應也許教人道衆口難調傅說羮駞鹿脣駞鹿北中有之肉味非常脣殊絶美上方珍膳之一也麟脯推教冠八珍不甘滕口說猩唇終將此意須通問曽是和調玉鼎人世號猩脣冠八珍之首吕氏春秋伊尹説曰肉之美者猩猩之脣軟玉膏軟玉膏栁蒸羔也好事者名之往寓六盤羊多來自熈河用梁吳均枹罕赤髓羊之説嘗有此作頃閲舊槀見之因録之於此赤髓薰蒸軟玉膏不消割切與煎熬是須更可教人笑負鼎徘徊困鼓刀行厨已去取温金鼈酒還來請煑玉蟬羮未妨門外令三老長是簾前報五更早發清泠泉戲題行厨家僮名三老者玉液應期養聖胎萬花仙供為人開祇從六甲行厨裏徑就行窩醉去來一作索為六甲行厨計快就行窩醉去來茶後偶題嫩香新汲井華調簪脚浮花椀面髙飲罷酒醒江月上依稀瀛海一遊遨重和惜春詩韻余時經始西園到底總輸開口笑未妨教效捧心顰壺中日月杯中酒只屬鸎花舊主人握月擔風留後日吞花卧酒莫過時請君但就溪堂上更試沈吟味此辭和曹南湖故宫二首練殺聲歌不練兵霸圖應自恃長城水流花落將春去三十六宫空月明香生羅綺粉生光天上人間白日長流水浮雲春夢斷夕陽空滿舊繚墻和人臺城天下紛紛經幾秦六朝風物問無因舊時王謝堂前燕飛入宫墻不見人和人池亭秋宵思歸風定清煙冷自消月明秋水浸蘭橈歸心不與逰塵息空混滄波影動摇和德卿秋日海棠馬嵬别後若為容猶帶宫粧醉暈紅把恨付春春不管似一作却將餘恨託西風和人茶後有懷友人玉甌盈溢仙人掌雲脚浮花雪面堆兩腋清風歸不去為誰吹上句樓來史記有句强續姓苑云勾芒氏之後又蜀志左將軍宕渠侯句扶音垢今燕俗直呼為章句之句和光祖詩詩篇足繼晉名流幾度思君倚寺樓十載龍庭歸不得玉泉何日更同遊和人韻二首十分着意送春來逺近人家花盡開多謝東君無彼此笙歌休放紫霞杯忠臣四海年來少讒佞滿朝日更多洒淚問天天不語不知天意果如何春日席上次髙麗國使新安公詩韻二首緑楊飛盡山城雪花影滿簾春日遲事異世殊春是舊化工著意幾曽私從來造物閑相弄自在飜騰夢裏身人事不知天意思欲迴天地一時春次趙虎巖春思詩韻惜春彌月醉髙樓不放閑人到上頭桃李亂隨流水去滿城風雨替鶯愁次盧希謝冬日桃花詩韻嚴風獵獵雪成堆一夜桃花滿院開春自不知誰着力九重天上挽迴來次趙虎巖詩韻讀書學劒兩無成牢落無由話此情聞道太平公事了蓬牕閑殺老書生寄語幽都君子儒年來活計道人居而今擾擾封侯輩大劒長槍不讀書玉泉泉下有魚龍風起波濤滄海同自是魚龍無意出月明愁殺釣魚翁次趙虎巖過玉泉懷古韻緑迴芳草春長在夢與浮雲一段空休向玉泉悲故國咸陽無處問秦宫路僻山荒碧草迷行人惆悵馬頻嘶當時樓觀尋無處落日疎林鴉亂啼復次過玉泉詩韻四首玉泉佳景昔人傳近築幽居碧水前他日卜鄰無我棄竹籬茅舍好相連玉泉清淺野梅蘇驛路塵空未得書獨坐穹廬情味惡漫吟新句寄雙魚客夢時時遶玉泉碧山無數鎻蒼烟君恩未報歸難得且向龍沙待數年廣文寥落客幽都我在天涯亦隠居料得因循渾忘却數年不寄一封書擬回文二首詩成怨立小樓西晚日春懷傷鳥啼離别書情多寄恨逺山髙處暮雲低樓上獨來心上愁淚垂難道不腸柔秋深夜雨風迴夢燭剪空牕暗燄浮即日擬樂天作従㬰新交與舊遊編排酒令與詩籌但言誤及功名事便索荒忙改話頭容齋三筆衡山王傳日夜縱臾如淳曰臾讀曰勇縱臾猶言勉强也顔師古曰縱音子勇縱臾謂奬勸也揚雄方言食閻慫慂音與上同勸也荆人凡已不欲喜而旁人説之不欲怒而旁人怒之謂之食閻亦謂之慫慂今禮部韻畧收入漢注皆不别用答客問客有調予者曰閲君獨醉園賦君自謂蓮社上逰又為獨醉癡仙仙佛殊教君之所謂必有説矣因以是答是佛盡居安樂國無仙不住没愁鄉聽教共獻天花供更管清名分外香繼韻為答日日浮沈賣酒家不知寒力戰風沙又誰知道新春色開到南枝第幾花沈謂沈齊爾雅云浮罰也答李仲玉白髪嘆功名江海一浮漚賺得英雄雪白頭日月如飛留不住鴈行山色又横秋贈御史四海嗷嗷屬望聲繡衣直指下天庭好將羅隱秋蟲賦自此書為座右銘戲贈隠士劉仲明愛仙無藥可登雲愛酒無錢可計春只説南山有佳處如何猶自是閑人秋日行次池上戲贈釣者垂白窮居野水濵秖疑秋水是龍津神龜已死三千歲何事持竿不顧人重酬脩真宫鍊師玉檢素書魚附去錦牋瑶句鳯䘖來桃花流水長春洞也望羣仙許再開讀書樓贈道士道本無名莫强名在人呈露自然情樓頭山色門前水不是天公彩畫成為閱俳優諸相贈優歌道士一曲春風沓沓歌月光明似鏡新磨誰逰碧落騎鸞鳯記姓藍人是采和近體隔句贈人不知何事傷游子謾折閒花盡日吟轉覺無機是啼鳥静依芳草説春心戲諸公省集萬事人生前已定須知禍福不由人誰憐四海生靈望浪着閑錢問鬼神送許大用還渾水臨岐促我送行詩信筆成詩送子歸望斷碧雲天不盡西風殘日鴈南飛送劉仲素行積雪癡雲失逺岑西風千里暗驚心送君歸去寒山外寂寞歸來獨悵吟用輔之送晉之詩韻執手溪邊酒一杯羨君歸路過金臺因風寄語能詩客囊裏新詩早寄來送王彦髙世間無物可勞神風外浮雲陌上塵還笑鳯凰城下栁長條不解挽行人送焦國寶雲壓荒原塞樹低倚樓停酒望君歸一天風雪晚來定凍合乾坤鳥不飛送王君璋半嶺斜陽天淡淡一川衰草角悠悠雲山望斷中州逺衰草斜陽滿目愁送侯君美塞鴻不度暮聲哀況復分襟把一杯望斷野雲人不見滿天風雪下髙臺送丁仲華歸斾翩翩挽不留别離詩思若為求西風落日重回首何處青山是宿頭送人迴遊江南就花便買金釵澗縱酒休頽玉斗山須信人生行樂耳此行莫問幾時還送行人二首十年鞍馬往來程學劒讀書兩不成故國英雄應笑我苦吟佳句送行人經過離亭知幾度從前端的一千塲只疑折盡無情栁不意東風吹又長送田鍊師行從住三山相見稀又馳雲駕幾時歸楊花不領東風管到處將春自在飛憶李東軒枚卜雲山醉隠居可能無地置屠蘇駕飛鴻去翔寥廓羨殺髙人李士都便從今留眼送飛鴻翔寥廓此東軒留别余之樂府中語也山谷何如盧郎駕飛鴻注云盧徴君駕飛鴻歸隠也寄季淵只須剰剪鴛鴦錦更與重圍翡翠樓不信西風將白雪便教吹上逺人頭寄楊之美萬里闗山人去後一江風雨鴈來時悠悠自别無消息漫草新詩寄所思寄國範舊歡新夢兩悠悠只引相思上驛樓尺素不應無寄處玉灤江抱鳯城流寄李稚川不堪人世若風蓬别後俄驚一歲終寥落天邊倦遊客酒杯何日與君同寄趙虎巖世態人情但見時未嘗子細不尋思傷心吾道難開口何處青山約後期睡起有寄連日輕陰䕶好花幾塲春夢遶天涯尋思不記相逢處又入街西賣酒家賀子所寄風流玩世酒中仙獨醉仙名盖世傳詩價一如聲價重且將錦繡裹山川寄家兄碧雲天外寄相思疊紙封愁鬢欲絲一枕曉窻春夢好東風爛醉小桃枝奉寄郭仲益鍊師瑶草祇須塵外種鳯簫當就月中聞應憐漢女臨溪水閑洗榴花染白雲西齋述事奉寄東都故人酣觴始得離騷味恨殺靈均説獨醒待與解嘲還自笑黙然飜守太𤣥經寄歸二首深掩蘭閨定自珍千金一笑萬金身筆頭無舌傾心事不著流鶯説不真幾憑青鳥報芳塵終是將心寄不真一紙短書分付與蘂珠宫裏弄珠人寄人囊括乾坤計未踈不知胠篋竟何如如何萬里驚塵下未奉平安一紙書春日懷王澹逰禧伯長記尋春信馬蹄畫橋流水亂鶯啼别來往事渾如夢明月滿庭芳草齊懷李舜卿北來見得鴻音少南去徒來蝶夢多一曲髙歌人萬里幾回無語上髙坡懷曹通甫流水迢迢芳草匀相思吟殺倚樓人萬里闗山一壺酒與誰重醉鳯樓春代人作玉簫抛曲錦停梭却倚粧樓怨夢多心在故園身在客一聲秋鴈過滹沱席上和光祖上僉事壽詩韻素娥檀板象牙牀低按秦筝薦壽觴翰林風月三千首一歲從頭上一章為人壽漫漫寒雪望來迷喜見孤松漸出堤一歲只能生一寸與君相約碧雲齊題壽人八十卷尾未入非熊惜壯圖却簮黄髪掩仙居空花不掛真人眼一夜春風撼太虛代書答征西將士抑絶所請一同由蜀道登天回首斯須十二年老我風神今不似劒門闗内陣塲前磨劒行故國江山夢裏行不期今日果長征劒華休遣塵生澀萬事人間總未平醉去來辭五首唯有樂天真道者余嘗自號獨醉道者祇欣歡伯意安哉安哉酒器名也慇懃且莫相迴避著去相將醉去來為慕公和愛嘯臺雙溪北山有孫登嘯臺結茅特就北山萊須非樹挂風瓢處莫厭歌呼醉去來啟事許誰當首肯謀生休自謾牙欸牙欸見楊子繫風捕影非吾事問栁尋花醉去來一作乗取安閒醉去來日日名花次第開㸔長春色映樓臺司花可要司春子凖備西園醉去來可愛風流趙素臺與香風引到蓬萊誠知宦海風波惡離了風波醉去來一作醉去來兮醉去來西園仙居亭對雪命酒作白雪嗺五首嗺與􅟜同音蘇回切李涪刋誤言􅟜酒二十拍促曲名三臺􅟜􅟜合作啐啐馳送酒聲後訛為平聲李正文所説亦然然則余以字書驗之為平聲於義為得啐一字凡九音一音蘇内切曰送酒聲嗺一字凡四音一音蘇回切曰促飲也又嗺送歌也程林曰􅟜與嗺同則嗺酒也以侑酒為義唐人熟語也玉花團結就冰桃玉蘂凝香襲凍醪時自唱歌嗺痛飲踏歌白雪代離騷是日園丁獻凍桃凍桃猶梟桃也情知白玉蓮花酌豈抵天然自暖盃玉友也須期白雪緩歌唯命雪兒嗺誰長更得非中聖自愛唯知是上尊只許飛瓊歌白雪緩歌催捲玉崑崙風流天上玉華君應為花間種玉人延命陽春將白雪立生春色入壺春生春酒名壺春園名浮雲盌裡斟雲液西園有浮雲盌明月杯中酌月波姮娥遺劉剛明月杯月波和龍王家酒名白雪調髙誰可和散花天女與韓娥横笛引有序許雲封説笛有落梅折栁二曲今逸其辭因次韻野梅官栁以代其二曲為横笛引云雪梅清瘦怕春知待結同心與阿誰誰許雲封將怨笛引吟龍去隴頭吹一作更教横去隴頭吹崔道融詠梅香中别有韻清極不知寒良可人意西京襍記有同心梅為誰折栁雪長絲横笛知誰引所思春水緑波芳草路枉教愁殺路傍兒杜工部佳人雪藕絲晃曰雪袖蕝也落梅流韻逰金谷折栁傳情寄玉闗藴結長思無計解只應心曲是連環落梅流韻感金谷之遊人折栁傳情悲玉闗之戍客雲封笛說中語也野梅官栁得長生寫入龍吟與鳯鳴已許雲封封怨笛不教人世有愁聲一作人間休更有愁聲四公子庾辭體四首細腰宫裏芳菲處唯有金衣公子知嘗笑何郎暮春怨紹蘭只寄一聨詩鶯穿楊栁金梭織蝶落宫花玉錢墜採花蜂去未迴來一雙乳燕梁間睡曉枕啼鶯睡起慵日髙墻外趂逰蜂桃花零落聨蝴蝶燕子來時春意濃倚栁穿花自在形報衙朝夕太勞生還家漫結莊周夢直到西風别玉京少年行燕燕鶯鶯滿鳯城好花時節更闗情自從雙鯉消沈後惆悵春流越淺清醉吟行將扶醉玉登華榻更吐歌珠上綺筵兩袖春風花下路得無争指是神仙曲延春要知今日扶頭酒猶是前時軟脚罇且恐鶯花經冷落為延風月與温存濕水謡借問盧溝橋下水甚時離了濕頭山自從流入桑乾後幾度窮兵戰不還天寶謡五家隊仗丹青裏三輔樓臺錦繡中不待海棠春睡足競隨春夢五更風閲史降得詩魔不抗衡多情歡伯下愁城判花視草風騷將倚斷芸牕閲墨兵讀史瓊枝秀出迷春洞璧月光生媚玉樓傾國佳人足傾國無愁天子得無愁髙齊後主時號無愁天子軒轅事業與唐虞搃是規模後世書後世一作業玩兵除德讓不知終古更何如樂毅一舉全齊縱二城風雲慘澹五年兵奈何不世興王業事在垂成間已行讀汲黯傳多欲危言已動心積薪餘論更駸駸足令不得中郎位枉被人譏淚染襟讀王濬傳隨波逐浪順東流幸得成名下石頭勾當江南公事了五湖須更有扁舟讀晉書書蒼溪石壁錢神足惡魯元道崇讓莫推劉子真由此儘知當世事得教懷愍不蒙塵讀隋書二百世猶嫌短促三千年已是尋常神州一作長安祇在天西北天下如何號李唐元夜讀唐開元天寶故事黄閣星繁千炬燭紫宸花爛百枝燈温湯不沃權門火豈覺漁陽已沸騰月宫遊唐逸史羅公逺多秘術嘗與𤣥宗至月宫得霓裳羽衣曲一説開元二十九年中秋夜帝與術士葉法善遊月宫得霓裳羽衣曲更有數説皆不同開元傳信記𤣥宗夢逰月宫得紫雲迴曲紫雲迴曲韻遊空只伴霓裳在月宫未到海棠花睡起豈知愁雨復愁風明皇别録曰帝幸蜀南入斜谷屬霖雨彌旬於棧道雨中聞鈴聲與山相應帝既悼念貴妃因採其聲為雨霖鈴曲以寄恨焉讀裴緑野傳未必求全便自全事須元自貴天然堂堂聖相裴中立晚節浮沉亦可憐讀劉賔客集仙桃滿觀似紅霞横去聲得人人處處誇前度劉郎應有問兎葵燕麥又一本作是誰家弔王文從之終於泰山月摇滄海魚龍泣風蕩荒烟草木號自是清名埋不得巍巍千古泰山髙醉讀列子獨醉亭中獨醉仙唯知仙遁辦逃禪等閑嚼蠟横陳際却味沖虚立命篇觀唐太宗像丹青得許近天真日表龍姿肖所聞功德兼隆古無幾可憐不贖盖都君題明皇思曲江圖偃月堂成已亂基徒令千古罪環兒中原戰血生荊棘可惜一作何事三郎見事遲題廢館醉仙像雲卧霓裳冷畫屏夢魂應繞舊旗亭如今醉着誰家酒猶自頽然醉不醒題鶴僊夢驚圖夢中了了乆忘言戲寫方瞳亦偶然萬古有形皆幻影此身初不異丁僊題藍采和圖終日蹮蹮舞緑袍百錢繩串戲兒曹争如收脚牀頭坐滿眼春風醉碧桃題馬元章水墨美人圖為嫌脂粉汚顔色故着尋常淡薄衣借問赤烏縁底事驚魚深入鳥髙飛又美人二首傾危花界總花神誰計還丹與反真難説玉皇惆悵事分明羞殺月中人衣剪湘雲裳剪霞出門羞落樹頭花東君也雪司花恥却縱春風亂鬢鴉觀畫玩蝶美人圖花不知伊蝶不知粉香旦旦拂花枝玉纎不放輕盈去怕引君王顧盼誰佳人惜梅圖玉骨冰肌瘞雪宫壽陽殘夢捲春空不知吹入髙樓笛却挽長條問曉風香迷蛺蝶圖竊處得非韓御史淡來知是薛瑶英只除哲匠生花筆得把南華夢寫成題織成雙禽組工得許近天真一段幽芳照瑞雲應是深閨孤恨切雙禽託意學回文太宗馬圖大秦熱海為封畧大漢炎人乞一作是附庸遥一作迴想鞭笞天下日此圖應自是雲龍題秋江栢石孤舟圖煙涵老栢蒼龍瘦雲盡髙峯冷翠横野渡無人渡秋水一江秋影浸寒晴跋醉仙圖卧抱春風醉未醒幾時飛得到崑陵料來恐泄天機事也待教人問不譍跋彭氏所藏畫鴈瘦荻枯荷野水深畫工多意作輕陰雨聲驚破歸飛夢一片瀟湘萬里心桃花源上避秦人扇頭碧紗洞裏桃花陌只許劉郎擅好春一片蘭臺風外月不知元屬避秦人題扇頭孤奉提携避暑宫見延明月引清風縱然秋氣為移奪終感殊恩在篋中元日上尊大人領省阿巴國夫人壽莫求天上長生藥已得人間不老方㸔破古今如一日年年春色似尋常詠梅謹上尊大人領省長笑庭一作羣花各様一作自粧競呈春色占時芳孤標冰雪年年伴只作人間獨自香謹次尊大人領省懷梅溪詩韻好將元亮林泉興澹寫王維水墨圖心逺地偏人不到閉門讀盡五車書謹次尊大人領省題壺春園詩韻萬壑雲烟増壯觀一壺天地入雄歌公侯何物堪人老自是一作付與兒童為一作讀揣摩南行寄呈尊大人領省一夢黄梁不待炊若為流淚滿征衣目前西塞北界地名身南渡腸斷東風心北飛寄呈神詠人歌不忍聞若為天地浄妖氛重封一紙匡時䇿哀乞蘭臺款奏君搔首躊蹰淚滿衣東風渾不管相思相思一樹梨花發立到黄昏月上時䕶先妣國夫人喪南行奉别尊大人領省淚滿雲牋未愴神髙樓望不見飛塵重重門户無人到深𤨏桃花一院春燕城之北垂三十里有甕山原先妣國夫人墳室在焉予過之哀感不已而貯之詩仍寄呈尊大人領省以慰其慼云仙佩飄飄駕彩鸞白雲深鎻甕山寒自從好夢風吹斷誰念孤兒淚不乾彩鸞飛去幾時迴望斷青天望不來二十二年恩與愛若為心地不成灰醮臺霜冷紙錢灰醮罷秋風獨自迴滿面塵埃人不識緩驅灰馬吾家良馬也入城來憶大人領省二首一上居庸萬里心居庸闗上望和林和林城逺望不見日落雲明山水深欲迴蘭棹更夷猶事出沉思得自求霜鴈不來書斷絶水寒烟淡倚髙樓憶尊大人領省二首一聲長笛野雲秋忍上髙臺最上頭紅葉暮烟人北望青山落日水東流一度思量一様愁一回傷極一低頭躊躇搔首無人㑹一作悠悠無限闗心事待下樓來却上樓拜書尊大人領省甕山原塋域寢園之壁尊大人領省塋域在燕都西北一舍西至玉泉五里寔曰甕山寢園居在昊天罔極禪寺之右正寢去隧東北百餘歩昔尊大人居台輔竟為伴食所沮曽不得行其道之萬一屹然特立如底柱之在横潰天下人之所共聞知者也悠悠之徒喥喥之口務欲中傷聞其横議則必笑謂左右曰不足介意吾固知不免為任尚輩謂班超無竒䇿其言平平耳若輩後必自知寧無輿論自定是非自别矣曽不數年一如所喻太平與亂俱無象先覺分明儘有閑間氣欲常遊帝所旱霖終不沃人寰曉聞行宫遷居曙色將分夢欲殘一天星斗冷闌干攬衣推枕出門去楊子江豪怒曉寒惜别憶昔相逢各少年幾臨風月醉華筵悠悠别後空回首風起楊花雪滿天漫興誰曽煎得膠黏日誰解拽將䋲繫風豈道花枝與人面大都都得幾時紅信筆自從得踐老成域曽不更登年少塲空賦棲烏夜啼曲可憐誰是賀知章感懷屈盡人間薄宦情千鍾從此一毫輕人心直要平如水水面風來更不平所思望外青山斷復連望中明月缺還圓碧雲暮合横長笛目送歸鴻不盡天述所聞忍竭聲華足笑林也須當問若為心可憐一自施行馬更説重門似海深可笑已將身世付醺酣擬買青山老翠嵐可笑欲閒閒不得又驅鋒鏑下江南自笑獨醉仙居獨醉亭只縁耽味洗心經可能却使談天口唯誦金人背上銘予號酒為洗心經青山青山不伴青春老萬古千秋色自新休去西園醉桃李晚來風起易愁人無何醉隠白石先生何日老青蓮居士幾時醒若須要得留靈景索與除憂舊福庭對酒吟莫勞鄒律喚春回雪盡北山空自來還笑獨醒成底事壯懷須對酒杯開獨自來日日樓頭獨自來别離情緒苦為裁東風倚遍欄干曲人在天涯迴未迴春詞二首曉蘭香露泣愁紅睡起沉吟遶露叢蕩子不來花落去教人争不怨春風空限勒花春事晚及開零落却生嫌春風若不曽相識何事頻來揭畫簾初閲仙音樂催花白雨衒芳春香濕霓裳入夢雲曽是長安少年客天津橋上月中聞因閲樂戲贈友人薔薇露漬霓裳潤桂子風飄月殿香猶自鳴蛙聾醉夢欲教人説是歸昌金樂歌百花氣色雖千變萬刼光陰只一般金樂既和行樂在我將天地結心懽明妃二首漢使却廽憑寄語漢家三十六將軍勸君莫話封侯事觸撥傷心不願聞右百家衣散花天上散花人唯説香名更未聞薄命換遺仙壽在不須青塜有愁雲征婦怨錦織回文織過秋千絲萬縷織成愁停梭心口私相問誰在凌烟閣上頭詩餘鵲橋仙閬州得稼軒樂府全集有西江月而今何事􅆟相宜宜醉宜閒宜睡或曰不若道宜笑宜狂宜醉請足成之皇都門外𤣥都觀裏露井樹傍歌意先生憑甚作生涯只嘲栁嘲桃嘲李酒龍歌鳯莫相廻避就取逢場戯且聼人勸要推移更宜笑宜狂宜醉古歌詞桃生露井上李生桃樹傍蟲來嚙桃根李樹代桃僵太常引題李隱君文集扣聲寂寞播陽春㸔流水混行雲大雅擬扶輪忍欲繼齊梁後塵清風眀月四時長在光景自長新不見謫仙人更何處乗槎問津眼兒媚醴泉和髙齋過煬帝故宫隔江誰唱後庭花煙淡月籠沙水雲凝恨錦㠶何事也到天涯寄聲衰柳將煙草且莫怨年華東君也是世間行客知過誰家木蘭花慢丙戌嵗重逰永安故宫徧覧太液池蓬瀛桂窟殿天香閣同坐中諸客感而賦此花枝臨太液觧語入温柔衒桂窟低迷天香飄蕩倒影遲留湏知畫圖難足更青山環抱帝王州幻出三千花界春風吹上木蘭舟鳳吹繞瀛洲記水淺蓬萊塵揚滄海一醉都休華胥夢雖無迹甚鼎湖龍去水空流青鳥不來難問玉妃㡬度仙逰雜著花史序釋雙溪主人因移接牡丹嘗作天香臺天香亭天香園三賦後分種芍藥有芍藥花選辭三十三首由是繼編花史客有譏者曰先生平昔以意氣自許而肆情花草其負初乎主人曰子不見夫前代明君名臣髙人隠士吟詠情性體狀花卉而遊戲翰墨塲者不可勝紀唐内相陸敬輿後不著書祇為今古集驗方五十篇示鄉人吾修花史亦將傳諸同好有何過乎客曰然則君以牡丹為花王唯芍藥為近侍理宜盡乎主人曰不然吾以若使靈均閲吾衆芳寧無起予之嘆試為吾子縷析之牡丹姿艷萬狀皆絶故以牡丹為花王梅有和羮之任故曰梅為上公槐為三公之位故曰槐為三公松有大夫之封故為大夫竹有剛毅之資故曰竹為毅士芍藥有近侍之稱故曰芍藥為近侍紫薇本署以中書故曰紫薇為中書開元中改中書省曰紫薇省文冠䇿名於翰苑故曰文冠備翰林唐㑹要云文冠花學士院有之木筆有可書之狀故曰木筆備太史木筆似木蘭見洛陽花木記拒霜有捍拒之義故曰拒霜備致師拒霜即芙蓉也屈軼指佞故曰屈軼維御史平露旌政之得失故曰平露維省政甘棗令人不惑故曰甘棗驅惑束晢發蒙記曰甘棗令人不惑迷穀佩之不迷故曰迷穀指南萐莆驅殺蟲蠅故曰萐莆驅蟲蠧蓂莢依厯開落故曰蓂莢知晦朔屈軼平露萐莆蓂莢已上並見天香臺賦注箑莆即倚扇也照天有相日之光故曰照天直晝合昏有知時之性故曰合昏戒夜合昏見天香臺賦注李冠諸果之首故曰仙李司春述異記云仙李縹色李肇國史補云李直方嘗第果實名以緑李為首榴有夏景之宜故曰榴花司夏木犀專九秋之香故曰木犀司秋山茶有冬日之愛故曰山茶司冬蒼官有四時不粹之色故曰蒼官總四時玫瑰薔薇寒芒健刺卒不可犯故曰玫瑰維藩薔薇維垣臺有凌霄故曰凌霄維臺古今宫閣記云有凌霄臺宫有望仙故曰望仙維宫望仙花見青州花品漢有望仙宫殿有長生故曰長生維殿華清宫有長生殿在金沙洞口洞有金沙故曰金沙維洞金沙見王文公集及梅聖俞集金沙大金沙黄金沙川金沙見花木後記祠有王母故曰王母維祠王母祠在玉蘂峯上酉陽雜爼云洛陽城華林園有王母桃峯有玉蘂故曰玉蘂維峯玉蘂峯見劉賔客集云唐昌觀有之龍香芬馥故曰龍香郁烈龍香出海南春鳯婆娑故曰春鳯毰毸玉女散花備見仙經故曰玉女散花玉女花即玉瓏􅋛花也仙人承露肇自漢武故曰仙人承露仙人杏名也葵心傾日故曰葵尸朝日之位桂自月降故曰桂即夕月之次盖有鳯盖故曰碧鳳維盖輦有鳯輦故曰金鳯維輦金蓮維寶炬取金蓮花之制也金蓮花炬見令狐綯傳瑞蓮維薰炷取瑞蓮薰爐之比也瑞蓮香爐前朝内府有之幌有珠幌故曰珍珠維幌繡帶若緌故曰繡帶維緌障有錦障故曰錦被維障裀有錦裀故曰地錦維裀地錦花見洛陽花木記仙樹可以療饑也故曰仙樹維庖帝屋之若帷也故曰帝屋維幄梨花巫娥之名也故曰棃花薦枕席棃花巫山神女名也王昌齡詩云落落㝠㝠路不分夢中喚起棃花雲盖詠此也櫻桃鄭后之諱也故曰櫻桃主中闈櫻桃石趙鄭后之名也見崔鴻十六國春秋萱草宜男猶萱草花之宜男也女貞抱節猶女貞陵冬而不凋也花事之盛在春故曰長春司花酴醿以酒得名故曰酴醿司酒酴醿本酒名而新開花顔色似之故以為名見山谷集禮尚師古故曰古度典禮吳録地理志曰廣州有木名古度不華而寔樂者樂也故曰長樂典樂唐蘇頲有長樂花賦八仙有文昌八座之相故曰八仙侍坐八仙花見洛陽花木記萬年有天子萬年之稱故曰萬年稱觴而長壽仙有壽仙嘉名故曰長壽仙為嘉賔蓮有君子之風故曰蓮為髙士菊有隠逸之説故曰菊為逸民蕙有佳人蕙心蕙質之喻故曰蕙為佳人蘭有穆若金蘭友之語故曰蘭為勝友薝蔔花著釋典故曰薝蔔為禪客海棠為花中神仙故曰海棠為仙侣賈耽花譜以海棠為花中神仙椰子有靈漿飲之得醉見交州記故曰椰子為醉聖見李謫仙青田核如瓠漬水成酒故曰青田為醉鄉青田見崔豹古今注曰核大如五六升瓠酒樹花汁自成仙醖故曰酒樹為黄壚無患子有傳故曰無患子述其傳李屛山有無患子傳榆有榆錢有榆莢錢魯元道有錢神論故曰榆兄有錢神之論橘中二老後稱橘隱左太冲有招隱詩故曰橘弟有招隱之詩樂府解題云小山之徒作招隠之賦以章其志後左太冲有招隠詩余嘗蓄坡仙墨跡橘隠二字榆兄橘弟見淮南子水仙跡著琴曲故曰水仙絃歌水仙操見琴書水仙花見山谷集又見張文潜集云葉如金燈而加柔澤花淺黄其幹如萱草秋深開至來春方已雖霜雪不衰海仙嫋弱故曰海仙低回海仙即錦帶也見王元之集躑躅行不進也故曰躑躅徙倚躑躅花見元微之長慶集又有紅躑躅虞美人可使呈舞故曰虞美人呈冶舞之態虞美人草聞吳音則舞見沈内翰筆談長命女可得侑罇故曰長命女為侑罇之容長命女又曰三春花見洛陽花木記金錢有金錢之號故曰金錢買笑含笑有含笑之名故曰含笑承懽自碧蓮而下至乎君子皆草木花也故曰碧蓮花擁紫陽宫女玉簮錦髻四季承鮮萬葉迎春迎春花見洛陽花木記延嘉賔連都念時好交讓如何君子在焉梟桃厭伏邪氣主殺百鬼故曰梟桃辟邪本草云梟桃一曰桃梟荔枝益氣理内故曰荔枝理内張曲江荔枝賦云有終食於累百愈益氣而理内邪不能神内即平理可謂無虞矣故曰能事畢矣四癡子釋雙溪狂直之狀北山逋客之迹白蓮居士之行獨醉道者之德相與雍容澹乎自持恃其所長多其所宜或拒或違或行或隨相忘爾汝與夫妍媸氣其合也道其同也磅礴為一探其賾也索其隠也析為四癡獨醉道者自警有䨇溪詩一作棲隱謂獨醉癡仙曰願一作敢以蘭臭之言書銘於君之前書之言曰夫以自然之間氣為不覊之髦傑彷徨乎塵垢之外逍遥乎無為之業三日月而騰光一冰霜而抱潔推斯志也信斯心也齊萬刼於一瞬甄萬物於一寫蔑挹清風於箕潁傲表天下於姑射者也等章甫於泥塗埒靈圖於土苴者哉有以擬卞彬禽獸決録目為請者戲為賦此駞性蹇而驕騾性乖而劣牛性癡而頑驢性鈍而拙奔逸絶塵騁出軌轍非所望於斯列雖皆可以代歩之勞寔匪予心之所悦也贊酒贊并序客曰僕聞賢哲以道徳兼人未聞以酣適為務醉隠於是懷罇抱爵延聖引賢以為酒贊羲皇上世康狄未作醇徳為酒饗道為酌醉時以淳和味人以淡泊使耳目不營形神恬漠逮徳下衰澆淳散朴俶推妙理庸延來樂從事千鍾仁醻義酢委質糟丘流毒肆虐值彼殊為尤物遇此反為狂藥計吉凶之起造實就人之善惡無功華胥伯倫天幕純潜粹隠天民先覺近君子之醲懿逺小人之孱薄榮優容於神聖審去就乎清濁朝耽暮嗜古人糟粕冀變澆俗返真抱慤庶宣聖賢之至化罔墜文武之斯道永期美禄於天公頥養天下之衰老獨醉道者自贊酒德有頌醉鄉有記酣觴自贊四癡獨醉或設武備或修文德足啓賢路足躋聖閾醉聖贊爰有大人髙蹈中區僑處無何嘉遯僊居依聖附賢味道之腴保其真筌守其天符竊號醉聖妄稱潜夫筆耕舌織鎔經鑄書箴斥戚施規逐籧篨論削闒茸議除閃揄廱廱優優睢睢盱盱迭居遞宿仁義蘧廬以天為盖以地為輿揮斥八極縱意所如不為物炫不為世拘雍容樂國寄傲華胥榮如辱如有機有樞樂天知命獨與道俱紅叱撥贊余有良馬曰紅叱撥取韋莊紫陌亂嘶紅叱撥之語名之諸突厥部遺俗呼今之諸色桃花馬為叱撥唐天寶中得大宛汗血馬曰紅叱撥丁香叱撥後易其名曰紅玉輦飛香輦粤有龍子桃花秀徹鳯臆麟形沫赭汗血竪整蘭筋雙懸璧月應䇿騰虚希意超折九逸失其權竒八駿驚其没滅籋飛雲兮越絶電朝金微兮暮玉闕庶質子淵之頌人馬相得之説也玉闕見水經注銘醉吟齋銘形籠天地耳隔雷霆援筆輒書吟醉齋銘詩壇將酒陣相與出竒兵無何擅懽場偶戰拔愁城鏡銘應物無私不言善應黒白自證妍媸自定肝膽可呈衣冠可正亮聖人之存誠其用心也如鏡酒銘維主養生擒奸奉公洋洋聖德蕩蕩神功宛然金液穆若春風是以被其澤者必自化於醇醲頌聖壽頌鶴髮孤臣拜手稽首長跪稱觴金液玉酒竊比華封祝聖人壽天齊其長地等其久有以靈壽杖為皇子壽者輒獻頌曰時好古度無患君遷靈壽君子長生萬年註孫綽子曰北阜有木焉名曰時好吳録地理志曰廣州有木名古度不華而實纂文曰無患木名也崔豹古今注曰此木為衆鬼所畏取此木為器以厭却邪魅故􅃅無患劉欣期交州記曰君遷樹名也魏王花木志曰君遷細如甘蕉子如馬乳前漢服䖍注曰靈壽木名也山海經曰廣都之野靈壽實華晉宫閣名曰君子樹名也廣志曰君子樹似檉松洛陽記云光眀殿前有長生樹鄴中記曰世謂西王母之長生樹晉宫閣名曰萬年樹名也華林園有萬年樹

相須而成名其末也去末猶榮實其本也舍本不生苟賔其實庸主其名賔主易位亂是用興是謂開塞之門榮悴之所由也臆說目論曽不足繫研幾析理之辭子其嚮之日論耳目之日字或作自字非遲日薰芳徑遊風扇綺寮韶華容艷冶飛燕語聲嬌玉友延藍尾花奴促緑腰天香結成陳不記水沈消藍尾本曰婪尾緑腰本名緑要瓊林園賦并序瓊林園者金海陵庶人之所營也嘗燕其羣臣于此惋其規模迫狹遂廣燕城展遼大內增建宫室仍起廣樂園于寶昌之西余遊歷燕都因與夫鈎盾按行遺址異其絶古今之制度披覽圖籍知其盡人神之壯麗意不翅加萬於章華什百於阿房及繹史氏詳其庶人本末核諸事跡可謂悉備然前朝耆舊靡不毛舉其所遺神動所閲心隱所聞不得以無言故引筆為賦詞曰探元符撼乾樞剽靈圖展帝容驕氣憑陵而威靈折衝援湯引武潔大比崇命相乎宸居光宅乎天𠂻度邑四方之極定鼎輿地之中海陵改燕京為中都詔曰顧此析津之分野時惟輿地之正中拓層城之萬雉體積陽之九重控八紘之要㑹擁百萬之提封海陵廣燕城營建宫室詔曰眷惟全燕實為要㑹亶全燕之形勝壯帝宅之恢雄名山㑹乾而環北靈海朝巽而㳬東蒼龍卧護以懷抱橫陳疊翠於遙空鍾神秀於天府史記蘇秦說文侯曰燕所謂天府也扼天險於居庸乃翳翔鸞跨神龍翔鸞位神龍位皆遼之大內瑶池位也陵倒景蔽鴻濛森羅移乎地軸幻化出乎人工玉泉是導金水是通渤湧太液滙浸芙蓉十洲繡簇方丈瀛蓬後改瑶池位曰太液池又有芙蓉池有十洲三島非北宫之太液池三島也瓊林璀璨玉蘂巃嵸建木森烈瑞葉青葱海陵營建宫室園苑多取仙都城闕宫殿池島之號凡花木之可珍者易以琪樹珠樹建木瑞葉瓊蕤瑶草朱英紫脫之名珠枝玉果瑶花碧草珍禽竒獸竒薄珍叢良難殫紀謇不可得而窮也綿聨翠苑韜映金墉樓闕嵳峩殿閣穹隆玊梯突兀矗似長雲輦路蔓延頽若垂虹端眀閣飛梁輦路直抵苐三層虹橋絡漢隥道盤空下臨無地勢出蒼穹藹天香之帟幕䕃桂影之房櫳抗促調則秋凄播雅奏則春融滌暑無夏辟寒無冬凛祝融於水臺暍元英於華峯儲隂蓄陽神其帝力冀主造化使天無功登眀月御清風眀月清風二殿在翔鸞位南神龍在北常為祈醮所延羽客而列金童寶炬燦其星繁香霧爛其霞烘訪乘雲於姑射咨問道於崆峒期固九鼎於靈根魏伯陽云九鼎謂丹砂之精主衆妙之真宗抱駐景之神方繼御氣之元蹤庶委質於金毋而從事於壺翁保後天之遐算延厯運之所鍾偷安宸極竊號天公愲自是之荒惑矜超絶乎凡庸奄萬象為已有置六合於牢籠垂拱驕唐虞髙枕傲羲農紛豪華之駘蕩示湛恩之龎鴻傾海以為酒并山以為饔鳯吹擾鸞歌疊鼓揭華鍾白雨催花金蓮布月龍膏繼晷樂事未終玊鑾玲瓏翠蓋葳㽔仙音雜沓紫霞淋漓臨素娥之庭院歷玊女之窗扉紅雲洞瑣長春花雨暗夫香霏香霏亭在仙音長春院內張以鈞天之廣樂燭以日月之光輝虎豹守護其天門龍蛇飛動乎旌旗回晲廣道東顧總期庳臨芳而陋景徽俾宏模廓度紫宸之庭闈黃道洞逹於天街銀河旁繞乎金堤結合歡於鉤陳營長生於太微通眀起乎中央蘂珠延其西陲擴叢霄為凌雲表閶闔為端儀按海陵初起都宫圖後世宗廟多易其殿閣池館名額存其舊名者十無一二亮仰法帝居元圃清都猶謂迫脅不足以壯萬世之宏規詔班爾敕工倕曰匪恢皇儀罔震天威可盡人神之壯麗當蕆能事之瑰竒遂儷廣樂之園就卜寶昌之西屬乎碧城之基繚以紫微之垣冠丹丘之巔枕絳河之湄寶臺􅑬嵼嵬閬崔巍右環翠水左帶瑶池九龍螮霓據中天而崛起五鳯偃蹇摶積風而忘飛十二玉樓兮駢羅三千花界兮低迷嶈嶈焉煌煌焉信彼都㑹之勝槩也景落天外晃銀海也聲華曠代何光大也窮竒極泰吁可駭也使鬼為之則勞神矣使人為之亦苦人矣締嗟搆怨跆音臺籍秦矣絶天流毒足失民矣雖智足拒諌辨足飾非萬姓仇汝汝將疇依惟狂罔念人心惟危章華就而荆人解散阿房起而秦衆乖離是以聖哲克勤克儉無偏無頗唯居其實不居其華以百姓為心以四海為家豈縱無厭之欲匱有生之用佐燕安鴆毒之雄誇者哉海陵實録宫殿之飾多偏用金傅然後間以五采金屑飛空如落雪凡一殿之費以巨萬計往往成而復毁務極華麗國力困弊曽不少恤沉而籌略溺而機智劣功優過絶仁棄義敢推貫日月之誠而隂藴滔天之勢飾卓莽之狙詐與操懿之狐媚辟而忠鯁昵而私阿法嚴而峻令煩而苛厭飽人以道德惡醉時以醇和煽虐熖于毒燎市禁網以誣羅斂怨為德實維伊何滄海橫流黔黎墊波遊童牧竪彼且奚知而遞賡迭和五噫之歌曰神彼帝京之宏麗兮噫壯九重而造天兮噫極鬼工之淫業兮噫殫九有之膏腴兮噫猛苛政如怒虎兮噫敢暴殄天物竊玩神器計同大帝之錫金策猶繆公之時醉亷政純龎甄時隆替審九域之安危實一人之所係移風易化舛純駁粹恬于剝亂逸于乖盩振顛沛之策御怨咨之氣猶指天之有日寧恤志士之流議也耶擬投䇿而斷江海陵臨維楊詩有鞭梢㸃盡長江水不到吳山誓不歸之句將憑怒而傾地衒雄斷以英略愈亦為之兒戲叨無上之大名規尊勢之厚利務隆振乎皇綱忍紛擾乎人紀好還者必然之天道代謝者自然之物理大定之更維揚之變詎不出乎不意嗟乎夸者殉權貪者殉利同歸殊塗萬古一致奈何創巨不恤神羞天恚陸梁不顧鬼青物纍務奮迅龍飛振矜虎視縱其驕蹇逞其惑志忘檢身之格言失子愛之奧㫖致狼狽於剛愎速梟獍以橫恣積非成虐積是為治世殊事變人道不思忽眀君之御民若乘奔而無轡忘天下之歸仁由一日之克已為釋余之所有庸經彼之所以獨夫之號庶人之貶不為過矣龍和宫賦并序龍和宫道陵李妃之正位也或曰龍和位道陵之崩也妃矯遺詔為立東海竊市恩私冀保身於萬全卒不穫免其禍東海由窘步捷徑尋亦失馭而殉身國蠧竟嫁禍神州于陸沈固金源氏之罪人也然其庸隘不足以塞責前輩未嘗不以其罪罪妃之險詖究其顛覆之所自道陵亦不得無讓余從北闕言歸中州稅駕燕都因遊覽前朝圮宫廢苑訊諸遺老得覩龍和故址桂窟瓊林光沉薰歇但瓦礫榛蕪馳邁狐免而巳徙倚周章慨然有懷不覺形於歌詞噫詩人之興感物而作黍離之義於是乎在辭曰抽思古之幽情索隱奧之宜藐音眇登凌雲兮凝絶覺天荒兮地老臨閶闔以徙倚俯玉繩之隥道玉繩瑶光樓之閣道名望層城之一本作而不見唯戰塵與煙草昔在天公唐明皇自呼為天公道陵事跡甚肖明皇宸遊物表駕兮蒼鸞使兮青鳥相羊乎叢霄婆娑乎瓊島縱仙韶之遊韻激水雲之縈繞解語花之婉娩黃金屋之􅌄窱傾四海之殊歡買嫣然之一笑態濃意逺容華可掬咳唾隨風徑生珠玉珠幌煙霧中海棠睡未足挺絶代之瓌姿抱夢蘭之心曲諒赤烏之失氣將飛燕之無悰魚何入乎深淵鳥何飛乎髙空氷肌綽約蕙氣冲融含顰冶艷捧心為容就處月姊之桂窟冀主星娥之璇宫桂窟宫中殿名李妃奏乞坤儀殿避暑章廟使徹其殿額特釀巫峽之雲雨嬛倚蘭臺之雄風蘭臺宫中臺名飄若神仙僑處溫柔懸居綿歷玉鸞啾啾布金蓮於寶池散瓊華於蓬丘金蓮川即山北避暑宫瓊島即山南避暑宫又名蓬萊島典長春之花界顓不夜之珠樓南威西子洛妃巫娥紅潮妬粉黛蹙羞蛾淡隱隱之春山湛盈盈之秋波呈霓裳之祕舞獻玉樹之凝歌佳人傾國天子無愁髙齊後主自號無愁天子李義山亦借使陳後主詩云從臣皆半醉天子正無愁微行要屈千萬纒頭道陵常制每嵗清明西園特設九市以要屈為務濯池錦於雲霞貯璧月於帷幬紛中夏之豪華擅南朝之風流朝轟陸續於方壺夕張爛熳於瀛洲笯靈鳯以為輦御翔龍以為舟方壺瀛洲皆行幸所翔龍舟即泛太液池之舟容與乎瓊田逍遙乎縣圃瓊田縣圃亦皆行幸所殊期與松喬永結為真侣餌以蘂宸之丹粒道陵置玉華宫為嬈丹院挹以金掌之瓊露保嵩呼之呈祥豈南山之足慕靈鎖忽忽其莫留神景微方之可駐奮鼎湖之龍駕振飛轡乎雲路頽玉體以橫陳愁玉音而號訴無靈藥之可竊託妾身於何處推天道於張弓甄四時之代序惟青春之告謝信落花之誰主羌神醉其凝愁隱取賊於妖妒注姢姢之心眼覬夫君之一顧吐幽蘭以徐言恨自惑其頑素忍取毁於求全為孤德之所誤忖竊市之恩私誠不足以負汝由一絲之綸命紹八紘之洪緒寄光隂於過客齊天地於逆旅苟神眀之有在豈相逢而無所李妃死時詰東海及申王之語泫憶君之清淚猶梨花之經雨逐黃裙於流水襲玉環於何許神帝力而震天威矜龍盤而負虎踞計無禍之可嫁幸亂媒之是除期王道之一平叙彛倫之隳斁希韜夏而軼殷周延三五而保亨祚頌河清以納祥亟飛詔以延譽大安元年河清上下數百里特試宏詞黃河清頌實自欺其聖作質萬物其斯覩抑與亂之同事且何瑞之足怙儻不有其穢德又何妖之足惡諒皇天之無親曰惟德之是輔聖朝太祖皇帝大安元年已興問罪之師二年庚午尋取中原河清之徴定我皇祖受命之符也曷猖披之罔念甘肆心於寡助忍乘時而布政舍漸摩而雄據俾彊禦與掊克遂蜂屯而蟻聚敢窘步乎捷徑任側言而革度東海多變前朝制度如鬻尚廄馬糞後園花果者不可悉記民騰怨之弗知東海為虎賊幽於四王府中使沽市酒嘆其味薄曰酒猶如此宜乎百姓怨我我實不知天垂譴之罔悟大安三年大風折通元門腰關太史奏宜修德東海怒形於色大業以之偷去帝乃以之震怒龜鼎將與時遷形勝奚設險阻關山空鎖九重天府史記燕所謂天府者也昊天成命眷我聖祖風雲慘淡龍蛇騰鶩鞭笞萬國混一寰宇籌函夏於拉朽奮天縱之神武殄烏月一作烏沙之烏合覆扼狐之貔虎保中華之利器失緘扄之固護竭束海之狂瀾竟寢聲以委御為天下之騰笑輒殉身於國蠧使寶勢之神州尋陸沈於顛仆長城萬里伯圖終古曽何足保一杯荒土維聖哲名器之宗匠道化理國之良具致興替者維人係安危者非數䀌遊子之寒心疚王室之多故宛赫赫之宗周蔽離離之禾黍通天臺榭朝元洞户基無完甓墉無遺堵弋林釣渚栁塘花塢流螢司夜野鶯典曙豺狼呀以雲屯梟獍紛以星布鬱叢薄與灌莾翳瓊林與瑶圃喟三生之尤物忍此焉而逰處去塵外之仙籞據迷津於神滸貞祐中人屢見李妃於天津橋畔有詰東海之語遷延凝睇含辭未吐顧影低回玉顔增嫮擁返魂之香陳進凌波之微步若回雪飄颻泛流風而輕舉吊故國之丘墟詰若人之遲暮何蓬萊之宫闕絶漢家之簫鼓龍和在蓬萊宫左言未足而沈吟遽倣徨於去住復惚恍之仙逰引廽風之神馭悵垝堞與頽垣鎖野煙與寒霧黯裂帛之聲消慘浣沙之人去信朽木之為物斷不可以為柱慨人間之何世將貞心以自撫恍臨風兮如失中結軫兮延佇私自憐兮自訟知為誰兮愁苦昔昭陽之遺事卒悉偹於伶元為有知之所配自不得而無傳托龍和之陳迹庸粗述乎兹編乖風化之所係故不得而無言險詖私謁固寵負恃窮奢極泰阽危吉士如趙公閒閒等一時名臣凡言李妃者皆得重責棄關雎之大義廢螽斯之微㫖道陵無嗣觸危機而奚歎悔不知其所止弗公其內務正其外苟營其利莫勝其害盍以公而滅私忽區夏之博大既託寄其非人不危亡而奚待憾驪山之烽火淪灰劫於橫潰悼姑蘇之麋鹿走揚塵之滄海天下神器萬世攸賴御非其道足徴撓敗勤武元之經營佚大定之耿介騷云彼堯舜之耿介驕道陵之雄奢僵大安之庸隘周章逰目積蘇纍塊凝情傾想益增感慨徴逸樂於憂勤速顛覆於荒怠孰竦善之不昌孰愎諌之不殆孟參政鑄嘗言虎賊有無君之心道陵笑而不答徐曰豈有此心但跋扈耳孟進曰聖朝焉用跋扈臣為後東海嗣位孟數盡言極誎謂虎賊無君之跡已著用是忤㫖免相寵任虎賊後賊之變也東海仰天而嘆曰若用孟鑄言那有今日事已矣乎非聖不無過過則勿憚改改過不吝是謂自愛濁流黕黷龍光彩敢批逆鱗誠可駭鳯鳴朝陽反為怪率德貴遷善思庸匪癡駭而樂天下之心戴奈斂怨以為德戾聖人之諄誠豈唯念之情熱足使聞之心痗閴荒凉之輦路突狐兔之馳邁結愁隂於莾蒼積悲風於蒲稗欸欸音埃天命之靡常忱大福之不再委窮塵之遺恨詎止歷乎萬代彰直筆於信史以昭示於來載索微言以成章證殷鑒之斯在獨醉園三臺賦粵雙溪之書院實獨醉之園亭鄰九重之花界屬萬雉之金城翳葱葱之佳氣扇淡淡之逰風隱天津於罨畫兮宛繞匹練於花叢挺盧龍之神秀兮逈列疊翠之雲屏得風煙之濃淡陋意匠之丹青仙居亭名秀出洞天之靈境勝槩足播壽域亭名之芳塵延郢中之白雪齊名納天外之陽春齊名竹窗兮松户林幄兮莎茵駢羅兮三臺花桞兮橫陳臨琴臺兮蹇産陵千一作萬頃之煙波對射臺兮螮霓擁萬叠之雲山出絃歌樓於輕靄兮臨正巳樓於髙寒讀書臺之屹立兮抗醉經之髙堂狀穹穹以隆隆兮據一作崛兩臺之中央挹清風於元覽兮淡元心以含章一本作挹清風以述誦兮縱逰心於文場振塵纓以射獵兮奮神氣以鷹揚適髙情於冲淡兮閒絃歌以宫商採歸昌之竒律兮奏和鳴之鏘鏘有客為之鼓掌兮嗤誚人之猖狂問方今之何物兮是周孔與義黃得開口之一笑兮勝百代之流芳如先生者何為兮謾塵外而倣徨既慘淡以經營兮盍秉燭以盤逰貯傾城與傾國兮遍舞榭與歌樓遏行雲於回雪兮掃萬斛之凝愁看青霜以何計兮㸃華鬢以成秋甚矣子之難悟兮舍吾道夫何求有琴書之真味兮足頥志以消憂况翛然而無夢兮笑蝴蝶與莊周乘夫天地之正兮御元氣以周流誰憐子之羈世兮自絶迹於幽尋未悉陳豫能事兮况凝坐巳沈吟琴也者禁止邪以正人心蕩鄭衛之淫哇發太古之純音元鶴為之翔舞六馬為之噓天諒迢迢之流水猶一作如道法乎自然或香穗縈紆几净一作室靜窗眀或煙霞閒逺月白風清但琅然一揮手亦足以陶寫幽情曽不以絃歌而衒買名聲射也者必先正其巳者也或馳騁營域或容與園圃從者如雲觀者如堵决拾既偹繁弱一作烏號是張驚弦裂石流鏑穿楊獸不得發鳥不暇翔亦丈夫一樂事樂在路絶豺狼弓矢之道意趣尤長無機呈露天道時光詩書乃經國之大業教化之成式宜乎賢哲心醉經籍得教育天下之英逸藻鑑世間一作古今之得失了萬事於一顧照千載一作古如一日於以定禮樂於以正人倫上以忠於人主下以化於齊民令投跡禮義之鄉徑躋仁夀之域醉之以道飽之以德此讀書者之所治非投筆者之所責嗟爾俗狀塵容曽何足與研幾探頥凝神至道味其無味孰營營焉以歌舞為事客茫然神醉遽不自持忘其所以為是失其所以為非竟卷舌而固聲但捧手而吁欷先生怡然沐浴聖澤含情隱笑徐復顧謂客曰伊運自然之妙理與養浩然之氣惟頥神於造化徴化成於天地宇宙無窮物名有量咸從其類固非一狀天之分與各適其宜鶴長鳧短斷續俱悲人生天地間萬物之一名營營擾擾自以為靈有察於未萌以已為愚者有暗於所見以巳為明者有然其然而非其非者有然其非而非其然者有潜德自適者有賣知竊寵者有輸忠自許者有紛慮邪計者有任真自得者有矯情飾行者有辭極貴之位者有爭毫忽之利者由是𡨕心相與推移人之相去何啻九牛毛與雲泥始知天之為天物依然而不齊趣中之至趣言外之微言尤非吾子之所知也獨醉道者賦有物自然惠澤如春獨醉道者德其頥真懷純抱粹齊心服形歷來樂之坦途欵除憂之福庭引齊物之論注洗心之經唐子西號為齊物論豫名家釀為洗心經洞滌嗜欲之邪穢净蕩聲塵之囂腥酳玉瀣為金液玊瀣近日名灑非隋煬帝所釀玊瀣也營糟邱為蓬瀛養其神於天和全其真於聖眀鄒陽酒賦清者聖明濁者頑騃言無所阿行無所傾豪無所奪雄無所爭靜不知其所待動不知其所乘隱不知其所辱顯不知其所榮純氣有所守神物有所接神物見坡仙濁醪有妙理賦鷇食而采乎元根鳥行而拋乎浩劫潄玉露之華滋芳與澤其紛烈挹萬古之清風吞幾團之眀月南史謝譓長愛獨醉曰入吾室者但有清風對吾飲者唯當明月聳懼不入乎胸次繇遌物之弗懾適志氣於曠放以堪輿為迫脅意毋固必行毋聲跡曽不知出榮辱之境曽不知入是非之域與物以之推移與道以之消息容與乎大庭之館優偃乎建德之國樂其聖治感其醇化協氣旁流道濟天下何其風之淳和何其俗之溫雅佚忘機而棄智恧蜚聲而騰價總春風以為御奮元風以為駕朝徜徉乎華胥暮逍遙乎姑射驕其醉者矜其醒者一以巳為甕天之醯雞一以已為歡場之害馬必期道之所在烏乎往而不可通天下乎一氣無間然於物我二豪鞅掌審乎庸瑣隘而芥蒂窘而叢脞恍若有得莫知所賀行歌而去倚歌而和歌曰微道者之發僕覆也僕不知真人之大成也獨醉園賦蓮社上逰獨醉癡仙馳聲榮路棲心化元務雍雍以延聖尤孜孜於進賢諶既醉於大道殊泂酌以微言粵饗道者本乎忘情而沈世者利乎適意適其意而冲其氣者無捷於春酒忘其情而凝其神者莫優於濃醉八珍紛以駢羅八音縱其迭遞合歡伯之淳德俱淡乎其無味味養老之靈液沃𤣥心之精一一萬事於微塵淡存亡於自得純純焉而優入聖國熙熙然而徑登春臺輸江山於醉眼攄嘯歌之吟懷南睨天津北眺蓬萊芳煙淡佇惠風徘徊徴杯命杓羅樽列罍汲引琬液掀撥玉醅澆我胸中之磈磊滌我渴心之塵埃既主百福之所㑹寧俟一日之不齊顔色憔悴足可惜形容枯槁奚自哀溺醉沈欲鬻醒市名各竒所趣得無相輕泥古人之糟粕外物徹之疏眀感偏枯之去就愲養恬之精誠唯有道者襟期殊在悠然獨酌半醉半醒地偏心逺孤唱無和茫然不覺壯懷暗驚賴其尤物容寄幽情得逰其道乃遂其生疏瀹乎其慮澡雪乎其神神守其全天守其真邪氣不之能襲憂患不之能入隘靈均之凝滯懿無功之淳寂王無功醉鄉記云醉鄉氏之俗豈古華胥氏之國乎何其淳寂也如是蹈詠漁父之名歌吟頌大人之至德蹴破虛空蘇晉竟逃至於禪窟神游八表李白豈謫除乎仙籍曷妨醉墨顛倒淋浪任聖友之真率愚號酒為聖友恣野人之清狂酒名有野人春標仙居之勝槩主長春之煙光逰赫胥氏之國典無何有之鄉王道蕩蕩聖德洋洋縱心乎浩然寄傲乎羲皇淳風導化和氣呈祥天香藹藹鳯鳴鏘鏘天香鳯鳴皆近代名酒伊麴生之風味殆不可以相忘融一壺之春色㪺五雲之仙漿瓊蘇積其清潤金波注其澄光漲蒲桃之鴨緑漬薔薇之鵝黃捧合歡之金掌即懸玊之華堂抱清聖之所務嗜至樂其何長召風姨以度曲邀月姊以佐觴播承雲之雅奏掬湛露於凝香不知手之舞之足之蹈之踴之躍之又從而歌之也歌曰至人披露天地心兮形骸放浪空古今兮威鳯傾冠􅀈玉音兮擁鼻長吟梁甫吟兮歌聲未竟泉涌風結白浪摧捲紫霞漿竭續稱歌曰碧雲日暮佳人信邁殊未來兮綿綿增慕咀冰嚼雪共此杯兮歌闋引觴塊然徑醉毁之不怒譽之不喜俟欲醒而復酌期必醉而方睡祈天長與地久使循環而無已獨醉亭賦維無懷氏之俗且有鴟夷異體而同名一味至道之腴一含至道之精酌焉而不竭注焉而不盈是謂一死一生而乃知交情五桞易色八仙效靈延致髙陽之徒與夫大人先生濯罍滌器獻觴捧罌乞朝夕黽勉而從事計不可得灑掃其郊坰淡超然而特處主養生之園亭唐子西號酒為養生挹春江之緑漲就枕流而濯纓滌除元覽庸鏡至清尋躋夀域竟拔愁城擅自得之場偃無何之兵與導淳化之源為勒清時之銘銘曰臨之以武略濟之以文經聖人醇其政而天下和平既勒而銘鴟夷頽然道者盱衡曰伊除憂來樂而愈病析酲神聖功用民無能名敢載緒言以醲郁聊頌至德之餘馨頌曰粵康粵狄道融化成神物尤物難弟難兄漙桂華之香露混丹山之鳯鳴瓊液零珠而玉音琅琅金泉漱玉而和鳴頌聲命從事於青州而問津於澠假道乎黃壚稅駕乎烏程將以沈酣縱適而情傳以清白魏略以白酒為聖人清酒為賢人怡養而形遂右引螺杯而左引兕觥感聖澤之渥沐表天樂之光榮澤畔之行吟自非同調方外之酒徒素非同心翕二道之至趣特引聖為證眀苟賢愚是混而神心莫澄豈知可崇君子之德而當澆小人之情哉醉鄉日月云凡酒以色清味重者為聖色如金而醇苦者為賢黑色酸醨者為愚以家醪糯釀醉人者為君子以巷醪黍釀醉人者為小人猶頌而德聖道以眀任聖之和激聖之清耽道物之極研天地之精當不滯於萬物何醉醒之足嬰恃醒負醉適足驕矜以醒為德以醉為榮漫與醒而非醉妄比醉而非醒薄幽人之獨醉短髙人之獨醒延譽自是之醉推忠自許之醒此之謂衒名之醉彼之謂狥名之醒醉其醉之所不醉醒其醒之所不醒醉其醉之醉者不知醉之為醉醒其醒之醒者不以醒之為醒醒曷足以譏醉醉曷足以嗤醒醒不足以知醉醉亦不足以知醒孰知蜾裸之與螟蛉心醉其利骨醉其名利盡而心折殉名而骨驚豈二豪之足慕笑獨醒其何成獨醉道者兀兀騰騰幸得全於天然養其拙以頥情恭命玉友延接蘭生相與道逰至德之世無機恬惔自然之庭文經武略之語醉鄉日月酒徒以飲器小者曰文大者曰武金泉桂華露皆近代名酒方湖别業賦雙溪别墅實曰方湖東控滄溟西擁皇都蘭州曼衍雲錦糢糊有田一㕓有宅一區我引我泉我疏我渠我灌我園我溉我蔬蔬食為肉安步為輿行吟坐嘯足以自娛或臨夀域亭名或即仙居亭名或隱而橘或入而壺左弧與矢右琴且書枕麯藉糟懷瑾握瑜命速伯倫為招三閭將補不足與損有餘我智如斯人無我愚則自謂何如而清狂者乎四癡子賦覽江山之神秀卜嘯臺與雙溪養煙霞於朝暮躔日月乎東西吟浮蓮葉舟嘯躡青雲梯計懸黎與結緑等土苴與塗泥凌雲之氣吐成虹霓摩空之聲唾為珠璣核盈虛之消息搜臭腐之神竒窮大化於索隱味至道以研幾齊其榮悴一其是非鼓腹而逰含哺而熙鷗鷺為之相狎麋鹿為之相隨我忘物邪物忘我機忘我邪我忘機無為之化日以自逺一作去聖日逺信德下衰滅質尚文或以身狥名或以身狥利茫茫終古遞有其人猶龍跨於迷津實虎據於榮路苟馳聲而一作以騁價竟躐威而跖怒吾何以知人心惟危休機一作狂直涉世特是一癡北山逋客漫解蘭佩浪縳塵纓㳂危襲險質軀沽名山人奚適道帙凝塵朝趨暮謁失素乖真法筵沈寂岫幌虛眀雲封蕙帳煙鎖山扄蘭路窈兮土花碧草堂閴兮風葉聲夜漫漫兮鶴怨晝沈沈兮猿驚慨英靈之情苦讓遊子以詒之詒音貽競獻嘲而騰笑目逋客以移之客謂避地逋謂冥飛御白雲以棲息茹紫芝以療飢嬰以時網絡以塵羈就稱逋客亦是一癡吁嗟勞生心瘁營求隂傾暗奪貌間言柔詎味嚼蠟於橫陳希食畫餅為端憂訟蕉鹿之真夢樂化人之神逰白蓮居士庸緣覺路去絶妄源六塵斯濯五濁斯蠲悠然忘情一作心淡然忘言吾不知其所以然而然香雲布地花雨漫一作連天依淨土之香火結極樂之因緣塵塵剎剎極樂世界際天匝地靡所不在天地之間逍遙自得違真背趣妄自生惑亦是一癡獨醉道者叩彼𤣥關了心遺境逰無功之鄉納無何之景結六氣之御遺八風之乘棄頑騃之穢德從聖眀之醇政鄒陽酒賦清者聖明濁者頑騃濯七情之內煎釋中腸之凝結延羲皇之至化與機猜而謝一作杜絶門無雜賔不妄相接入室者有清風對飲者是眀月或御鶴觴或進螺巵言不及道慮不及私處不知其所持行不知其所之何尤物之淳德曽無補於眀時吾從衆之有道務獨醉以奚為狎杯玩杓酌誚斟譏孰謂先生偃蹇棲遲凝神滯物有失推移亦是一癡何其婩魚略切斫齒略切何其墨音眉杘癡何其㺒口交切㤉口家切何其怯疑青山背約黃髮垂期酒徒已矣吾誰與歸醒邪醉邪慧邪癡邪似之而非不可得而知也醉䆿音藝未訖癡僿音伺相及矜其所得衒其所適智有聾肓事無終極癡醉之間不可致詰獨醉之醉四癡之癡相與之守不知之知孰知心聲可以攄懷孰知蠻觸角逐囂埃胡謂乎寶地胡謂乎蓬萊唯恬體道於癡醉如復嬰兒之未孩雪賦并序聖上御極之元年春國蠧間釁鳩合梟獍職為亂階余遂自朔方挺身東邁為驚塵夭閼而周流窮野僅逹天闕聖上北征還幸瓊華島之廣寒宫時余偹員侍從㑹侍清宴雪作不覺斐然技癢每欲攄蓄念為發幽情曽不足自宣竊慕詩人比興引叙永懷敢述是賦有姑射之仙人為玉華之真君總堪輿之所統運混元於中宸宣五榖之精華驅造化之威神望剡剡以薄天氣飄飄而凌雲橫庇諸夏光被四表則天之大罔不覆燾靈境奪晝陽烏隱輝幽荒失夜燭龍寢照布清眀和一之德遵純白無二之道厲色靜昏霾惠渥潤枯槀以縞素為質以豐登為寶虛室宜其生白玉燭調於元造符瑞圗云玉燭者瑞光也見則四時之色洞如燭也爾雅云四時和謂之玉燭雲將為衛以偹御風伯清塵而先導紛花雨以泛灑振玉塵而進掃歷羣玉之靈峯擁瓊華之仙島倚天外之清風異江山之易老僻回中之荒寒陋齊宫之褊小駢崑閬於清晝列蓬瀛於白曉崑山閬苑蓬萊瀛洲皆行幸所也寒庭挺琪樹太洞玉經曰廣寒宫中有寒庭瑶草承珠叢晃蕩水精都劉公幹清慮賦曰入水精之都烜赫眀光宫玉京未足擬其麗羽人無以希其蹤來飄然而憑虛去翛然而乘風揮斥八極神用無方定靈居乎瓊田為長生之福鄉受天花之仙供仙經有玉女散天花之說治玉屑為雲漿皓然塞乎天地與日月兮爭光白帝儀其羽衛元冥凛其威靈勾芒沐其膏澤祝融儲其淳精其臨物也肅其御物也清其利物也博其為物也眀皭然而不滓皎然而不涅蔽柔祗之質渝卑此君之腰折偉天上之飛瓊天上飛瓊稼軒詠雪詞中語也保嵗寒之名節抗盈耳之竒聲琴曲白雪有竒雪聲揚效瑞之光烈播陽春於嚴凝藹幽蘭於芳歇主白玉之樓臺顓爛銀之宫闕散净界之空花下清都之瑞葉倣徨乎塵垢之外逍遙乎清白之業青女屏跡於環丘之庭素娥失色於金樞之穴氷姿艷逸玉質呈露凛然自潔旌其積素謝白雪之帝鄉淡飈車之容與辟驚塵之夭閼竟裴回乎天路姑射仙人飄颻神舉經其瑶域造其粉野音墅風雲感㑹應化制變將襲三封之休祥睿宗皇帝壬辰春正月乘雪大敗女真於三封重冠百王之瑞典扺大㩬音竒之谷稅飛逰之輦駕丹山之白鳯麾玉鸞為羽扇稼軒和人觀雪造物故豪縱千里玉鸞飛解鼉城之長圍却玉龍之酣戰密清滄海之飛塵彈壓禺強之健羡由廣寒清虛之府即不夜通眀之殿差瓊㽔於薄具駐倒景於清宴光宅真居道映天下夜光眀月銷聲鑠價調兮何髙和兮何寡原大塊而收乎神功命太素而秉乎元化包荒宏曠天然異禀臨照無私以為巳任御昭回之天宇逗長春之花䕃致靈景於眀庭延神光於清禁殊冀蕩滌邪穢仍為掃除氛祲計氷壺與凉簟始不妨其髙枕是日釋道㑹集故有神光靈景之語釋二祖慧可初名神光道書有靈景道君聼琵琶賦有美一人兮秀發英華超然獨處兮髙謝紛譁邀我乎仙居期我乎無何遺我以同心延我以鼙婆挹之以緑蟻進之以紅螺引流風於回雪弄却月於淩波輕攏慢撚感怨相和曰如何眀淑忘我實多激流波以潄霧結回風於陽阿縱遏雲之遊韻倚飛龍而長歌歌曰撫凌雲而自惜兮殊鬱伊其維何慨良㑹之遲暮兮怵佳人之蹉跎大尾羊賦并序端卿持節使博囉或曰舊康居也其國多羊羊多大尾其大不能自舉土俗例以小車使引負其尾車推乃行且乞余為道其所以乃為之賦世有癡龍發跡康居音渠播精惟玉效靈惟珠一角觸邪名動神都六蜚奮御聲振天衢肥遁金華與道為徒體純不雜質真不渝惟仁是守惟善是圖不食生物幸逺庖厨含仁懷善其德不孤義合麒麟與夫騶虞駝背上異馬尾後殊末大之名是專是沽小心惴惴中抱區區務以身保支體毛膚青蠅莫逐白鳥莫祛尾大不掉可怪也夫前傴而僂後蜷而痀牽草縈茅土曵泥婁蘇其土苴載以後車聼其自引縱其所如退不能却進不能趨莫順而情實纍而軀冬委冰霜夏混蟲蛆末大之咎其至矣乎吁枝大於幹腓大於股不折必披是其證歟是其鑑歟毁假山賦并序國東門外酒家泥為假山窮竒極怪以盡其變都人士女蜂喧蟻擾不得其門而入者數月有好事者惡其幻惑而圮之因述其事以賦粵若稽古眀眀我后誕敷淳化務見素抱朴切禁僞除詐伊兹山之為物何得列此堂厦外藻飾以金碧中雜糅以土苴態度殊常容貌閒暇示岩岩之屹立索眩時之髙價枝峯蔓岫莫能相下將競秀乎海上之三山角壯乎雲間之二華抱旡狀之詭質誠可惋而可訝敢惑海內之耳目竊阿譽於華夏匪癡兒騃女而相尚浮誇旡以紛綸傾動京華致彼郊園涉春歷夏歌吹喧啾京臺飛榭酒壚為之屢空人相為之枕藉粲華燈以繼晷擬洞天之不夜曷淟涊俗之僻異獨撫心而悲咤以矯誣為幾智以譎怪為秀雅其染輕浮其作塵瑣忌有所觸惡遷其座既不推物出其右曽不接物虛其左其為體也常自髙於恬妥其為用也羌不勝乎頓挫豈拒雷霆其脆易破弗任雨露其跡亦涴非席上之珍非可居之貨旡雲雨之姿當輦轂之下剗僞以真適足以賀逼真以僞為鬼所唾化人竒幻期復嫁禍翕然同辭騰聲附和疾甚則亂固知不可恐夤緣馴致蒲脯鹿馬人為物靈在境真假披露精誠敢告來者輿論橫議成功弗毁我曰不然致逺恐泥推其誠者之謂信行而宜之之謂義義為人之正路信為瑞之符契舍信何守舍義何歸我智如斯人旡我譏著誠去僞是可謂有成也離實學僞非所以示民也有成為難牖民孔易天地旡窮古今同致多前聖之格言智惠出有大僞作僞心勞日拙抑先王之所棄夫其或者兹山之陊將新垣平之玉杯與乎哀章之銅匱使寂寞於陸沈更旡聞於人世吾用是知所謂聖人者詎一時之利驁萬世之患而短義人之氣也永歌賦并序協洽之嵗龍去鼎湖余還自蜀適值姦蠥蟻動蜂起越眀年東歸居雙溪書院以歌詩為事因采詩篇目凡五十題斷章取義遂作此賦命之曰永歌謂言之不足故嗟歎之嗟歎之不足故永歌之也其詞曰彼何人斯而比列星兮表武丁以進賢之為心况蜉蝣出以隂兮蟋蟀而候秋吟懿文王之眀德令聞兮維天之命靡常撫小戎而遵大路兮獵非熊於渭陽有客岌其冠而長其佩兮起髙卧之東山冀烈文物於仁夀之域兮釋民勞乎乂安齊國夀於南山兮延生民於羲皇播凱風為頌聲兮挹湛露為椒漿閔豫小子寧知行路之難兮猗嗟國步之多艱曷昏氓之多僻兮由巧言而興端甘采薇而伏清白兮孰與還乎故鄉步徙倚於噫嘻兮擬遡谷風而髙翔歷吉日之良辰兮忽乎我將行心既醉而莫持兮愧北山之英靈希依東方之日之休光兮欸東方之未明欸音俟襲雞鳴之出關兮恆惄惄以潜征野有蔓草而閴其無人兮心瘁四牡之倭遲佚衡門之投跡兮乃載驅而載馳風雨凄其瀟瀟兮蒹葭颯其蒼蒼抑鴻鴈違寒而迅征兮何草不黃落而休芳日月汨其不淹兮溘白駒之過隙惟北風之奮振兮厄青蠅於榛棘系曰終期皇化而綿六合殊思文德以經國信南山而大有佳處維清時不可以驟得

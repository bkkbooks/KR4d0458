野色煙光錦繡中楊柳結攀垂柳帶桃花嘶立落花風延引仙人蓮葉舟衣冠雜沓載凉州風流今日蘭亭會移在桃源水上頭楊柳唐樂家歌姬名也燕俗上巳日結柳帶為圈脱窮亦猶景龍記上巳日柳弮之説方湖釣魚臺杜梨花外杜鵑啼醉倚東風上釣磯上一作擁真是一聲聲更切不知猶更勸誰歸玉溪玉溪聲㵼玉聲寒流繞祥煙瑞靄間却是氷壺凉世界始知元是在人寰水平橋洞簫吹罷思無聊却下閑庭弄柳條寂寞小園春晝永一聲啼鳥水平橋白石山山本無情不解愁年來底事也驚秋古今閲盡興亡恨知為何人雪滿頭山市吟山閣連城日曰新千形萬狀只無人自分長樂樓臺象不染長安市井塵桃源洞仙情分與桃源儘與劉郎有舊縁兩手未為無用處不妨和月弄清泉驚風成陣花委塵白日如馳催老人只須深入桃源洞留住朱顔占住春過北村麥穗經場穀尚青縣官嚴令督秋徵嗔他問著西成事斜倚鋤耰並不譍觀田漠漠屯雲翠拍天人謠鬼詠是豐年老農愁倚鋤竿立五穀雖成不值錢秋日田行野老郊迎頂斗鑪馬前行語更相呼田荒室露渾餘事乞免官徵一歲租靈城元日惆悵重明竟未廻塵揚滄海刼前灰誰期六合披攘際得引屠蘇最後杯未待金鷄送曙光鴈行羅列進桃湯如何白獸樽中酒盡日無人引一觴立春前一日對雪桃李無言盼斷春值春潜處暖生雲晚來縱有殘風雪明日人間總屬君立春口號細風吹緑水生波翠陌瑤阡艶綺羅春信朝來到人世滿城簫鼓醉人多春意千里萬里遊子去一行兩行歸鴈來休倚髙樓起惆悵滿城桃李為春開春曉曉來雲捲四山晴睡起池塘春水平滿眼東風吹栁絮落花無語怨啼鶯瓊枝委露凝香雪澹月籠花浸麝塵喚起丁寧休喚起苧蘿山下浣紗人雷發聲連日隂雲慘不開依稀寒色滿樓臺一聲踴地蟄龍起六合洗天霖雨來寒食日見花開寒食常年柳未黄今年花滿舊池塘如何春色今年早試對春風笑一塲白日玉澗鳴泉彈洛浦蒼龍横沼冩離騷晴忩睡起爐煙冷滿院春風白日髙臨春臺為臨春色上歌臺獨捲紅羅坐緑苔忽囀一聲穿九陌永新傳送莫愁來七夕一別相逢淚如雨不禁憔悴語相思佳期咫尺還知否明日傷情兩別離今日相逢明日離逡巡離合幾多時無情雲雨休遮隔人道相逢一歲期雨洗秋容秋氣清翠簾髙捲暮樓晴似含羞澁誰家女旋索金針拜月明中秋不見月夜闌人静漏迢迢雲影無情閉碧霄不見嫦娥真面目徘徊虚度可憐宵秋日宜都道中採蓮歌斷木蘭舟萬里長風入戍樓靈鳳不來青鳥去隴雲江月可憐秋儺畢酌吟醉齋畢方魃蜮避時儺便覺祈禠氣象和歡伯解言應也道最難除得是詩魔詠雪碧玉壺天白玉塵十分添起月精神從今休作輕盈態學殺楊花不是春故宫對雪三首瓊室亂穿樵子徑瑤臺空映野人家天公也是灰心地更忍教開玉樹花足憐瓊室傷殷鑑可是一作道瑤臺屬夏家元自飛花將蔕葉已摶羊角到中華飄颻舉似霓裳舞爛漫横陳玉樹花寧知㸃㸃飛來處生自幽人兩鬢華園中對雪驚風不展瑤花限浩蕩年光落又開却是仙娥相見處爛銀宫闕玉樓臺月臺雪霽水精簾下玉塵埃旋逐風姨去又來應審素娥殊有待已懸飛鏡上瑤臺雪中戲示漢臣散花臺上千山雪晴雪樓前萬樹花觸處造門堪臘酒更休得問是誰家雪後吟雪助夜寒更漏澁何能盼得到天明乾坤已落羲和手休更瓊瑤陌上行姮娥月姊應勞駕望舒可能圓缺為陽烏如何竊盡長生藥却種相思樹一株十六夜月姮娥减却舊精神桂魄難同昨夜新多謝清光不相負徘徊終夕伴詩人底事姮娥出海遲玉容寂寞不勝悲清光未必天邊減冷暖人情亦可知昨夜銜杯冩我歡玻瓈萬頃桂花寒素娥今夕如羞澁似怨詩人取次看對月吟誰遣姮娥到畫筵徘徊清影不勝憐廣寒宫殿應蕭索想見人歸難自眠炭山窑子店大風後有回風數日不已西風崛堁過柴扉回裂雲衣纒酒旗懶舉扇來時自蔽祇知塵汚庾元規和林雨大雹有如雞卵者誰擁珠璣積玉京縱欺明月易愁晴若教不值驪龍睡不信波斯擅得名波斯國王名阿克達布西域國土未可悉紀唯此國多出珍珠雷雹喚起阿香雲外具低徊龍馭過神州翠裀萬頃無人捲弄散珠璣去不收西園梅花婆律膏融滴蠟開幾多香陣過樓臺封姨更是相料理吹到南華枕上來對後園梅花簡示諸公莫訝氷姿渾是雪若存花態即非梅靈根豈受寒拘束直把陽和竟挽回早梅一逕縈紆入草萊柴門雖設不曾開東風是洩春消息吹到梅花樹下來燕都地寒梅信在春飲梅花下除了孤髙梅子真蘭生更待與誰親無如清友延清客有似賢人對聖人曾端伯云花中十友清友者梅花也博聞後集號梅花為清客梅花引淡粧素服映氷肌香襲幽情暗有期漏泄美人心下事怕拈横玉倚風吹龍城録趙師雄遷羅浮日暮於林間見美人淡粧素服芳香襲人師雄醉寢明日起視坐大梅花樹下春梅怨笛歌一聲愁笛吟龍起萬㸃驚香怨雪飛珍重冰魂莫回首酒痕猶滿去年衣三月二十二日夢中詠瓊花一樹瓊花手自栽栽成盼得到春來春來爛漫知多少羞殺羣芳不敢開題戀春牡丹玉籍名延不世香含情惟務振流芳自縁始戀春料理是索東君力主張牡丹問誰能一作培養牡丹芽南一作西枕天津第一家不枉得輸青帝力見開知是異凡花唐家紅紫二色牡丹誰齊音劑天香凝去聲彩霞靈根培養地仙家漢皇可忍思傾國鹿走中原是此花花譜云李唐時遺種也或云出民唐氏家題一花二名牡丹政縁中業擅英聲是索宜專第一名抱一足為天下式儘消仙筆與題評雙頭牡丹並倚春風映畫堂相偎應説夜來長同枝同葉縁何事脉脉芳心各自香玉盤雙捧九天香競負恩華示寵光意得沉香亭北畔太真臨鏡倚新粧帶將來野花新傍玉欄開長恨何人向此栽自是王孫不知道牡丹根上帶將來戲題與牡丹同名芍葯生倚英姿勝玉英一生生占牡丹名懸知也是陳驚座誰許分庭擬抗衡勝玉一生香皆芍葯名也前漢游俠陳遵傳列侯有與同姓字者每至人門座中莫不震動既至而非因號其人曰陳驚座云長春芍藥同座客賦標舉孤芳藴異香異香芍藥名也定知經歴幾炎凉自來不受春拘束顯是司花少主張和林芍藥夏至前後始盛以元微之芍藥詩開張七寳裏為韻分得張字題與牡丹同名芍藥花譜有御衣黄牡丹亦有御衣黄芍藥有遇仙紅牡丹亦有遇仙紅芍藥似此同名四十餘品英名竊比擬花王傾慕花王事業香奴頴萬花題品處不教花相敢承當楊萬里芍藥詩好為花王作花相戱題所賦芍藥花辭雕章開發自生春藻思敷花逐日新不獨筆端元有舌為花須可與傳神取維揚紅玉樓子千層閣芍藥種遲而未至紅玉樓當在玉京千層閣合在層城延留應欲騰光價待合瓊花作伴行孔常父芍藥譜云紅玉樓子初開時淺紅經數日乃黄或謂之絳州紫苗樓子千層閣葉大小間出千餘層其苗青或謂之青苗黄樓子芍藥楊家一捻紅嬌潤與醉西施較等差倘使紅粧無藉在寳冠須也是閒花楊家一捻紅醉西施紅妝寳冠皆芍藥名也醉粉殊宜凝笑寳冠雅稱紅粧少時詠芍藥樂府中語也醉粉凝笑亦是芍藥二名墻北桃樹一樹緗桃幾萬枝餘花落盡未開時從今甘比墻南樹長得春風半月遲燒桃樹根碧桃林盡了無痕溪水無光山色昏依舊負薪人不斷採殘枝葉更刨根路邊桃花不似劉郎初見時塵埃憔悴損胭脂多情閲盡行人面醉倚東風果笑誰三月桃花詞春盡山桃花滿枝怨春休道北來遲人人争醉春時節政一作却是江南腸斷時日日亭午大風樹杪忽見桃花一枝贏得夭桃衒麗姿漸教開上最髙枝司花未必能為地便是頺風欲起時冬日桃花同諸公賦碧桃花擁長春洞秀出元英獨自芳一㸃香心滿容笑探傳何意與劉郎答王澹遊冬日二色桃花詩凍得梅花開不得笑他和雪倚欄干漫山漫野知多少尚對東風怯暮寒落花瘦緑癡肥怨影濃一簾紅雪障晴空驚湍飛去無消息吹折春心不是風圓福院竹甚茂盛幽都一郡所未有超上人云原有桃樹百本余悉去之始植此君因為之賦忍教儀鳳籜龍孫縱酒劉郎道與存應説碧桃花解語可無桃葉代桃根司春園五月五日梨花是日因事不飲雨迷雲夢夢迷春只自將春認不真莫笑獨醒人索寞也須曾是洗粧人已是春風釀雪香月波斜浸玉肌凉如何不入荆王夢却逼何人要洗粧晨詣香山禪寺觀兩閣前後玉簮玉簮花映清凉國露潑一作洗冰姿日未昇只似舊時香世界水沉香氣自薰蒸楊妃菊追尋秋色到東籬腸斷三郎足別離折得一枝香在手臨風何處寄相思醉浮愁頰半朝紅流恨空遺滿六宫睡殺海棠春不管斷魂招得嫁秋風朝一作潮楊花遊人枉自怨年華斷送春風是此花可是東君一作蜂蝶不知難管領一天晴雪過一作落誰家詠苔露茵疊翠藉閒園神篆班班世未傳誰道東君翻古畫盡輸春色買苔錢紫菊濃改新粧厭舊粧留連春色到秋光淵明老後無歸客籬下而今不遜黄乞花惜花人草乞花詩欲得花枝慰所思計取問花珠玉價索知都是買花貲戊午冬十一月二十八日過閬州楊氏獻小桃十二月二日又獻杏花誰意嚴凝運化機小桃生蕚綻芳蕤東君枉了為春主開到杏花猶未知惜花御史春事權輿未渠其據切央惜花御史似蜂忙分明白著千紅紫陪奉宫花為括香唐穆宗宫中花開以重頂帳蒙蔽置惜花御史掌之號曰括香御史錦連錢王炎云錦連錢余之良馬也擬其色名之錦連錢暈玉連錢稱裊行吟軟玉鞭可愛金蓮花世界與人長結畫圖縁桃花馬二首花滿長春洞裏開萬枝雲錦映樓臺劉郎不道誰家物盡與龍媒帶取來散花仙子神如水閑散瑤花剪霞綺春風吹滿鐵連錢鞭碎玉鞭鞭不起予之鐵驄桃花色備五采求自渥洼紅叱撥顧影驕嘶躡紫烟縁雲隨步步一作是金蓮天然紅玉飛香輦宜載花間醉玉仙余避暑所川野無非金蓮金蓮川由此得名晨鷄延頸長鳴有所懷司晨期振宿隂開傾心解抱扶桑日直是聲聲呌出來過瓊林園聞鶯神州沉陸宫鶯在不忍頻將舊事題似與幽人説情緒盡情啼了又重啼雛鶯一簾疎雨洗清明啼殺東風陌上鶯寒勒百花開不得問他春色與誰争新鷹逼駱駝山馳快馬迭鴛鴦濼按新鷹性耽神俊多成癖非為霜前被凍蠅秋鶯落盡羣英一見愁只因天地兩經秋流鶯不道春光老剗地如今調舌頭早春歌朔風戰野地擘裂震匣瑶琴絃凍折春風不意到人間昨夜柳梢先漏洩白雪謡天花瑞葉將騰六眀與天公示心曲一時三白表何事表白孤忠一作有臣三獻玉題黄梅出山圖祖佛不識山中主良才可惜遭斤斧肩擔明月過前峯一時忘却曹溪語鮒魚辭鮒託微波致微意上自蛟龍至鱏音尋又音滛鯉今雖得百萬江湖寧比當時斗筲水日將出隂雲夜合乾坤失萬象不能分別得蒼凉海㡳浴重光却與行人指南北五將行螣蛇逰霧相乗勢龍舉雲興相借力致使雲消霧散時要似枯魚過河泣秋蓮怨紅衣亂委鴛鴦浦羅襪塵消水仙府凝情照影竟無言應惜芳心為誰苦松聲風低滿地蛟螭走風髙萬壑龍蛇吼蒼蒼元是嵗寒姿休錯思量比蒲柳五禽詠大麥熟簸箕漏小麥青青大麥黄野老啼饑空遶塲感大麥熟簸箕漏惆悵無由除粃糠麥飯熟即快活長安米貴不易居粒粒皆比明月珠彼麥飯熟即快活寧知西山有餓夫提葫蘆沽美酒黄壚邈若山與河人生安樂孰知他為提葫蘆沽美酒快喚靈均聽浩歌燒香撥火燒香撥火情發衷心知有願天必從千聲萬聲禱何事應禱時和將歲豐不如歸去不如歸去不如歸吻裂血啼誰汝知便休也把春催去就去萬花深處飛

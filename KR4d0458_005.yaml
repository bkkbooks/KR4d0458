body:
  text: 雙溪醉隱集卷五元耶律鑄撰五言絶句髙城曲城髙一百尺枉教人費力賊不從外來當察城中賊金微道茫茫首蓿花落滿金微道一千里驥足十二閑中老出後漢耿夔傳夔出居延塞五千里至金微山小獵虎落入長圍期門突似飛烏號驚霹靂白額藉忘歸留别趙虎巖吕龍山燕南春色老燕北草初肥露冷野花瘦月明江樹稀懷趙虎巖吕龍山六年風雨夜一寸别離心日暮步芳草相思塵滿琴懷舜卿過鴈三四聲相思千萬里策杖倚西風行雲渡秋水寄楊誠之相去一萬里相思堪倚樓漢宫臨薄暮羌笛怨髙秋寄李東軒一紀不出門三年不窺園有誰曾得似髙士李東軒送趙伯玉行去鴈失歸羣孤聲不可聞一樓花外月千里隴頭雲懷髙敞春滿鳳城陌惜春人未來相思不可寄何處有髙臺代寄露委花團雪夜深香著枝春風殢楊柳秖是漫摇絲代人寄逺怨蝶休春夢驚烏遶夜啼唯應故山月相與過遼西擬孟郊古怨妾意似花枝願與春長在郎意似花隂逐日隂移改閨怨惜春驚白日不到回心院合照妾人情也逐花隂轉池亭睡起絲雨籠深院團花皺碧羅不憐孤枕夢終曰戀池荷長春閣院僻行人少垂楊覆地絲閣髙秋色早山逺夕陽遲登廣寒殿故址萬古消沉盡浮雲事幾塲酣歌頺醉玉休得問興亡春晚雨餘芳草緑石盡野泉渾落日一聲笛斷腸人倚門落花不堪三月尾風雨又相和片片樹頭少紛紛地上多獨醉園寓興百品消愁藥三生解語花一時都聚在方外酒仙家飲逸園無何有醉隱稱是飲中仙玉瀣涵金液金波養玉泉飲南園欹紅醉濃露凝碧厭芳煙我有一壺酒置君花樹前玉忩歌玉鈎垂翠箔珠幌背蘭膏花瘦露如洗月明秋更髙夜坐香起深齋静横琴夜更幽千巖風雨冷一夜鬼神愁嘲漁父若為逃世網却計釣名鈎自是驚飛盡羣羣海上鷗漁父荅世路披天險名聲足是非月明風露下吹笛放船歸雜詠我雖不解事知時莫如我須為扇仁風吹滅權門火示子人皆縁禄富我獨以官貧富貴莫圖著恐他來逼人蕩子行雲思故山逰子何時還天地如逆旅光景不可攀題西山早梅扇頭西山先得日南枝先得春朱曦與青帝豈屬種花人十六夜月月姊應吞怨無人冩所思柔情將綽態須是破瓜時樂聖齋對酒吟錦幛五十里胡椒八百斛那能知許事且盡杯中物春雷琴素匣開寒玉烏龍出秋水長到夜深時恐乘雷霧起燈蛾歎白日不出飛夜燈安可親比明不可投一作投明無意去何以暗藏身即事青州少從事平原多督郵洞庭春色裏誰是醉鄉侯錢幣白鹿殊持重青蚨豈致貧不唯堪使鬼且是更通神一作如何堪使鬼只是為通神得雲齋所遺竹箭因以此寄時雲齋南遊未回適足堪申意浮㳺亦識機未應為信往著處便忘歸申意浮㳺信往忘歸皆箭名也南征過蜀寄題故園水擊三千里鵬摶九萬程不應棲隱地猶待卧龍耕太河篇怒浪淘晴雪驚雷日夜奔洪流將碧落空自勢相吞次韻閬州述事首肯唐庚賦心推郭奕詩為誰携斗酒還酹魯公祠宋張俊自陜西回過漫天坡郭奕有詩大漫天是小漫天小漫天是大漫天只因大小漫天後遂使生靈入四川遂不仕離堆有顔魯公祠堂閨思鴈陣驚秋信蛩吟襲夜幃河源應凍徹方憶搗征衣心事苧衣寛塵𤨏菱花暗春入水聲滑水涵春影澹問鴻鴻巳歸問花花不知却把鳳凰簫水精簾下吹七言絶句雪嶺抑揚霆電决雌雄霆激狂鋒電掃空如席片飛何處雪撲林聲振海天風我軍乗風雪敗敵于松林之雪嶺陽關振威馳突過天山擒擿如神指顧間底事戰塵收不起一作得陣雲西下望陽關我軍時出張掖之天山至燉煌郡界太行宿衛諸將已抵陽關故境隂河虎臣信任國心膂虓將樂為王爪牙賈勇隂河西去路空拳轉鬭戰龍沙我軍又自夏州隂河追撃西師前漢燉煌郡正西關外有白龍堆沙後漢咫尺龍沙注白龍堆沙漠也李陵傳士張空拳司馬遷傳張空拳注云拳與絭同絭亦作弮廻飛狐震疊威聲逕出師偃旗卧鼓豈無時折衝樽爼風流在未要喧傳塞上辭南征紀事揭雷夔鼓傾天險絡漢虹橋併鬼工説是樓船横海將擬輸吳越夀重瞳達蘭河河名也在和林北百餘里陣雲壓地欲填空鵝鸛飛馳欲得風龍戰未分天欲暮不知誰復是虞公拒馬河陣雲北壓飛狐口戎幕西臨拒馬河不獨擬虞公止日誓心期奮魯陽戈水經云巨馬河劉無黨地志作此拒字千泉擁旄羽騎附飛翼傾地鐵林和鳥翔黄金練愈凝霜氣青玉龍争掣電光千泉在大磧石東非前史中所見千泉也河間王親鏖擊追騎于此飛翼鳥翔二陣名也碎事金練金甲也雜爼云常見青龍突陣乃知劒之靈也唐王仲初詩衣袂障風金練重劒光横雪玉樓寒西北不宜有怒徒傾地自伐無功可一作為補天争忍競一作並驅千萬騎又相馳突二三年戰沙陀李沙陀笑睡龍當獨眼龍更堪一作鴉軍都似李横衝彼須要不從風靡除鐵山來作戰鋒玉門關六合同風奉一君誰期貴介竟孤恩自從五夜傳金柝已早三年閉玉門時自玉門關舊境以西道路不通前出塞擬取安西襲玉關短兵鏖戰下臯蘭隂風勢挾天山雪凍徹河源徹底乾十年老將浮苴井萬里疲兵碎葉川傳督諸君傳詔令問何時到海西邊後出塞併吞處月下樓蘭光復金微静鐵關凖擬鑿空通四海會須鞭石到三山誓洗兵氛雪國讐氣横遼碣紫山秋豈容日下西王母只屬東西海盡頭丁靈二首長驅席卷盡連營震讋禺强撼北溟虎豹騎從雲騎隊又隨横野過一作下丁靈師古云丁靈胡之别種也月朘日蹙漫逃天廹脅丁令地一邊悵不似從東海畔聯珠營直到虞淵阿王時避地丁令境朘音宣愚嘗述丁令辯附其畧于此因阿王避地丁令以有和林城唐明皇御製碑銘沙塞之國丁零之鄉之語詢之諸公故述是辯云云諸書所載丁靈丁零丁令三字不同詳其前後事跡似非一種史記北服丁靈李陵傳衞律為丁靈王蘇武傳丁令盗武牛羊顔師古曰令音零即上所為丁靈耳漢書作北服丁零後漢南單于傳丁零㓂其後鮮卑傳北拒丁零載記丁零翟斌及諸書唐史月支都督府丁零州范陽郡丁零川雖皆無音乃是先零字漢書丁零乘弱攻其北丁令比三歲入盗後漢北部又畏丁零逃遁逺去烏桓傳其土在丁令西南莽將嚴尤領丁令兵屯代郡及諸書丁令令皆音零然則令字亦有連音史記西至令居姚氏音令為連前漢書地理志令居孟康亦音令為連通典丁令魏時聞焉在康居北烏孫西似其種與北丁令别也然亦無音後魏書丁令在康居北丁音顛令音連御覽丁令亦音顛連考其地在前康居東北隣烏孫至今尚成部落丁音顛令音連為是北海内經丁靈國在海内其民從膝以下有毛馬蹄善走詩含神霧丁靈人馬蹄自鞭其脚日行三百里杜君卿採前史烏孫長老言圵丁令有馬腦國其人從膝以上至頭人也膝以下生毛馬腦馬蹄而走疾于馬著之通典聖朝太宗皇帝嘗詔和端等入北海往復數年得日不落之山未始聞有馬腦馬蹄之民是知諸家所説不加考覈遞相祖述耳好怪不經世俗之所不免者也可勝詫哉秋山二首萬騎龍趨兩隊分翠華方自發期門内官急把朱旗颭傳道先教詔虎賁兩龍如舞發璿臺蔽日旌旗四面開疑自錦林花嶂裏建章營騎下天來庭州星羅遊騎遍氛埃似與頺風下九陔可道漢家哀痛詔未應原是為輪臺庭州北庭都䕶府也輪臺𨽻焉唐書長安二年改庭州為北庭都䕶府又曰後漢車師後王故庭有五城俗號五城之地即今其俗謂之伯什巴里蓋突厥語也伯什華言五也巴里華言城也濟黄河河西有金粟城西夏所築河西岸與金之東勝相直對境河東即唐東受降城地也雷滚洪流激怒濤何時清澈鑑秋毫冰夷應訝無持赠莫認精誠是寸膠逈馳聲勢出崑崙據盡人間要路津快著靈濤天上去就傾銀漢洗兵塵金蓮花甸金蓮花甸湧金河流繞金沙漾錦波何意盛時遊宴地抗戈來俯視龍渦和林西百餘里有金蓮花甸金河界其中東滙為龍渦隂崖千尺松石騫疊俯擁龍渦環繞平野是僕平時往來漁獵遊息之地也阿延川詩劉無黨地志阿延川本遼朝至夏納凉處並無殿宇唯松棚數楹而巳倦比紛華悦目人土階猶恐是勞民數間帶葉松棚下指緑莎為翡翠茵過長城為誰到一作過古長城外又自經今戰地邊木燭嶺空懸素月一作片月爐門山只鎻荒煙沙磧道中去年寒食在天涯寒食今年又别家天北天南人萬里春風開盡馬蓮花本名馬藺俗訛呼為馬練今又呼馬蓮過駱駝山天作竒峰象槖駝人間牧圉肯來過祇縁頑礦成無用不識瘡肩陟峻坡昔駕朱輪白槖駝石駝曾見屢經過蒼顔今日應難識瘦馬服箱轉舊坡金滿城金滿名城一作為名果是誰分明須只是癡兒想來可是教人笑金滿城時是幾時便得城中垜滿金不應將買住光隂愈竒夢渴何生賦足見從來不足心渡陷河陷河在無定河東沙地極虚有南風則隨步澒洞或值其甚虚處輒陷溺其中宣徳潰河亦然殆不可以理求天幕旁圍翡翠茵自來原自是迷津誰期也值南風起吹得黄沙不見人一作天宇光臨翡翠茵欲行還住認迷津如何又是南風起吹得飛沙不見人認一作問翌日渡東陷河水碧天臨碧玉津李白詩多言浮水碧注云碧玉類也水中有此碧也上無纎翳下無塵畏途也幸逢今日特地一作直是清明不陷人一作人人喜説逢今日天氣清明不陷人過無定河無定河在龍河唐綏州理龍泉縣隋日上州一自揚鞭過上州若為癡絶漫遲留為憐此水渾無定引得龍泉也亂流何一作底許頺波是上流若然洄泬幾時休如今淺地仍依舊漫漶東西到處流幾臨沙步駐驪虬甚欲窮源問水頭有底奔波無定在忽東流了便西流是余前此三年過無定河因附之于此故前篇有仍依舊之説夏州塞外道如何不渡諾真河步拙由來步越多不是賀人情意好要臨安樂駐行窩夏州塞外道有諾真河步拙泉步越多山賀人山安樂戍入蜀口號金馬可堪充鐵馬鐵牛那是糞金牛虚名豈得為時用足致天兵下益州遊果州鳳山觀誰是浮游獨醉仙鳳還來上鳳山巔定應人不知名字只問南充謝自然過花樓絶磴層巒路屈盤欲教人歴畫圖間行雲逼渡樓前氷放出林梢一半山曉發牛山驛山靈護野煙霞静風伯清塵草樹香鶴背酒仙和醉夢不知延入五雲鄉夜泊青海集古歸心日夜憶咸陽海角天涯不是長今夜月明何處宿北風低草見牛羊靈州客舍春日寓懷凉葉常先白露零草過寒節未敷榮十分體得春消息不似西風有信誠靈州地寒過清明草始萌芽前年立秋日嘗在此州其日便有深秋氣味和林春日書事凍折池塘百草芽斷鴻低雪怨凝笳晴忩一曲春風詠開徹滿山桃杏花春日即事客中草草過清明寒襲羅衣雨又晴夢覺畫樓春寂寂海棠枝上有啼鶯野宿清笳聲咽思徘徊漠漠癡雲凍不開寒入貂裘眠不得通薪餘火撥成灰北風作惡晚猶寒征鴈一聲雲漢間歸夢暗隨天際月清輝皎潔滿關山馬上偶得誰念天涯久倦遊可堪回首又驚秋登髙極目暮雲碧衰草荒山不盡頭客中吟旅懷夜永夢偏饒明滅殘燈獨自挑雲外五更征鴈盡帳寒風冷雨瀟瀟白鴈飛時秋夜長玉欄黄菊傲寒霜寸心萬里雲山夢一日三秋鐵石膓萬里故人寒舊盟一樽薄酒正含情夢廻星斗闌干夜膓斷西風征鴈聲客中次人韻塞鴻飛盡野雲收羌笛悠悠漳水秋有客北來歸未得倚門長嘯看吳鈎客中次郭器之詩韻典盡征衣出醉鄉一回頭處九回膓黄花滿地秋風老坐數飛鴻到夕陽客中二首幾度求歸不放休翩翩蝴蝶思悠悠夢廻三徑黄花老題遍一林紅葉秋咽咽霜笳吹底怨泠泠山溜㵼何愁和林望斷白雲暮愁入水雲東一作天盡頭蒼官臺層臺重到記登